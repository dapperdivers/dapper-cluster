[env]
_.python.venv = { path = "{{config_root}}/.venv", create = true }
# Repo-local wrappers (claude → claude --worktree; see .claude/bin/)
_.path = ["{{config_root}}/.claude/bin"]
KUBERNETES_DIR = '{{config_root}}/kubernetes'
FLATE_PATH = '{{config_root}}/kubernetes/flux/cluster'
KUBECONFIG = "{{env.HOME}}/.kube/config"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/kubernetes/bootstrap/talos/clusterconfig/talosconfig"

[tasks.deps]
description = "Install dependencies"
run = "uv pip install -r requirements.txt"

[hooks]
postinstall = "lefthook install"

[tools]
# Template tools
python = "3.15.2"
uv = "latest"
# Operations tools
"aqua:cloudflare/cloudflared" = "2026.7.2"
"aqua:FiloSottile/age" = "1.3.2"
"aqua:fluxcd/flux2" = { version = "2.10.1", slsa_signer_identity = "https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@refs/tags/v2.1.0", slsa_signer_issuer = "https://token.actions.githubusercontent.com" }
"github:home-operations/flate" = "v0.8.0"
"aqua:getsops/sops" = "3.13.3"
"aqua:helm/helm" = "4.3.2"
"aqua:jqlang/jq" = "1.7.1"
"aqua:kubernetes-sigs/kustomize" = "5.6.0"
"aqua:mikefarah/yq" = "4.54.3"
"aqua:siderolabs/talos" = "1.14.5"
"aqua:yannh/kubeconform" = "0.8.0"
"aqua:kyverno/kyverno" = "1.20.0"
"ubi:BeryJu/korb" = "latest"
"aqua:evilmartians/lefthook" = "2.2.4"
# Formatting & linting (run via lefthook git hooks)
oxfmt = "0.72.0"
gitleaks = "8.30.1"
zizmor = "1.33.1"
helmfile = "latest"
kubectl = "latest"
task = "latest"
