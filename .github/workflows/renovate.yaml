---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Renovate"

on:
  push:
    branches: ["main"]
    paths:
      - .renovaterc.json5
      - .renovate/**.json5
  schedule:
    # Twice an hour, off the top of the hour: GitHub sheds :00 schedules under
    # load (the old "0 * * * *" fired roughly every 7h). Renovate merges a green
    # automerge PR on its *next* run, so cadence here = automerge latency.
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      dryRun:
        description: Dry Run
        default: "false"
        required: false
      logLevel:
        description: Log Level
        default: debug
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  main:
    name: Renovate
    # In-cluster, UNPRIVILEGED ARC runner set (no Talos mount, namespaced RBAC
    # only). `container:` makes kube-mode run the steps in a separate job pod;
    # the runner set's hook template runs it as the runner uid with no
    # ServiceAccount token. See
    # kubernetes/apps/actions-runner-system/actions-runner-controller/runners/dapper-cluster-unprivileged/
    runs-on: dapper-cluster-unprivileged
    container:
      image: ghcr.io/renovatebot/renovate:44.216.1@sha256:5b22aef2bf23e861a9eea10db05392122f49aa43ec298d3a5ea207cf374d08ec
    permissions:
      contents: read
      packages: read
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: "${{ secrets.DUNCE_BOT_APP_ID }}"
          private-key: "${{ secrets.DUNCE_BOT_APP_PRIVATE_KEY }}"
          # Branches/commits, PRs, the dependency dashboard issue, status checks,
          # and workflow-file updates (action pins).
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write
          permission-workflows: write

      # No checkout: Renovate clones the repo itself. The image is pinned by
      # digest (Renovate bumps it) instead of the old `renovate-version: latest`.
      - name: Run Renovate
        env:
          LOG_LEVEL: "${{ inputs.logLevel || 'debug' }}"
          RENOVATE_AUTODISCOVER: true
          RENOVATE_AUTODISCOVER_FILTER: "${{ github.repository }}"
          RENOVATE_BASE_DIR: /tmp/renovate
          RENOVATE_DRY_RUN: "${{ inputs.dryRun }}"
          RENOVATE_INTERNAL_CHECKS_FILTER: strict
          RENOVATE_PLATFORM: github
          RENOVATE_PLATFORM_COMMIT: true
          RENOVATE_TOKEN: "${{ steps.app-token.outputs.token }}"
        run: renovate
