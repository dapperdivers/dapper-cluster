---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=home-operations/flate
  FLATE_VERSION: "0.8.0"

jobs:
  image-pull-filter:
    name: Image Pull - Filter
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: kubernetes/**/*

  image-pull-extract:
    if: ${{ needs.image-pull-filter.outputs.changed-files != '[]' }}
    needs: image-pull-filter
    name: Image Pull - Extract Images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.extract.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          # Pinned so a broken mise release can't float into CI on its own
          # (mise-action's `version` defaults to "latest"). 2026.7.17 could not
          # resolve aqua packages with prefixed upstream tags — kubernetes-sigs/
          # kustomize tags as kustomize/vX.Y.Z — and 404'd on this repo's
          # .mise.toml; 2026.7.18 fixes it.
          # renovate: datasource=github-releases depName=jdx/mise
          version: v2026.11.14
          cache: false
          # Only install what this job actually uses. Without this, one broken
          # tool anywhere in .mise.toml takes down image pulling.
          install_args: github:home-operations/flate
          tool_versions: |
            github:home-operations/flate ${{ env.FLATE_VERSION }}

      - name: Extract Images
        id: extract
        # Must render from flux/cluster: the app-template OCIRepository comes from
        # the common Flux component, which -p ./kubernetes/apps never builds, so
        # that path silently returns [] for every app-template PR (#4697 did that).
        # From flux/cluster, though, a namespace-kustomization change re-renders
        # widely, and apps needing cluster-secrets (CI can't decrypt them) fail on
        # both sides and make flate exit 1. So capture the list, accept a non-zero
        # exit when stdout is still a JSON array, then write it to GITHUB_OUTPUT.
        # Render validation is Konflate's job, not this one's.
        #
        # flate also treats any non-image field holding "a/b:c" as an image, which
        # catches LLM model IDs such as openrouter/moonshotai/kimi-k2.6:exacto
        # (Round Table Knight spec.model). Drop refs that cannot exist: three or more
        # path segments with no registry host would resolve to Docker Hub, which only
        # has namespace/name repositories.
        run: |
          rc=0
          flate diff images -p ./kubernetes/flux/cluster -o json --no-progress > images.json || rc=$?
          if ! jq -e 'type == "array"' images.json > /dev/null; then
            echo "::error::flate exited ${rc} without a JSON image list"
            exit 1
          fi
          [ "$rc" -eq 0 ] || echo "::warning::flate exited ${rc} (some renders failed, see log); using the image list it produced"
          jq -c '[.[] | select((split("@")[0] | split("/") | length) < 3 or (split("/")[0] | test("[.:]|^localhost$")))]' images.json > images.filtered.json
          jq -r --slurpfile kept images.filtered.json '.[] | select(. as $i | $kept[0] | index($i) | not) | "::notice::skipping non-image reference \(.)"' images.json
          {
            echo 'images<<EOF'
            jq -c . images.filtered.json
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  image-pull:
    # Knight pull requests (branch `knight/...`, roundtable-k8s/roundtable#288)
    # never reach the self-hosted runner, which can talk to the nodes.
    if: ${{ needs.image-pull-extract.outputs.images != '[]' && !startsWith(github.head_ref, 'knight/') }}
    needs: image-pull-extract
    name: Image Pull - Pull Images
    runs-on: ${{ github.event.repository.name }}-runner
    strategy:
      matrix:
        image: ${{ fromJSON(needs.image-pull-extract.outputs.images) }}
      max-parallel: 4
      fail-fast: false
    steps:
      - name: Setup Mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          # Pinned so a broken mise release can't float into CI on its own
          # (mise-action's `version` defaults to "latest"). 2026.7.17 could not
          # resolve aqua packages with prefixed upstream tags — kubernetes-sigs/
          # kustomize tags as kustomize/vX.Y.Z — and 404'd on this repo's
          # .mise.toml; 2026.7.18 fixes it.
          # renovate: datasource=github-releases depName=jdx/mise
          version: v2026.11.14
          cache: false
          # NOTE: intentionally not scoped with install_args like the extract job.
          # This job has no checkout, so `talosctl latest` below is the only tool
          # spec; if a stale runner workspace leaves mise.lock behind, mise-action
          # auto-adds --locked and a scoped `talosctl` would fail as "not in the
          # lockfile".
          tool_versions: |
            talosctl latest

      - name: Pull Image
        env:
          IMAGE: ${{ matrix.image }}
        run: talosctl --nodes "$NODE" image pull "$IMAGE"

  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          # No SARIF upload (would need security-events: write); findings
          # surface as PR annotations and fail the job instead.
          advanced-security: false
          annotations: true

  roundtable-validate:
    name: Round Table - Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: v2026.11.14
          cache: false
          # Only the tools this job uses (versions come from .mise.toml).
          install_args: aqua:helm/helm aqua:mikefarah/yq aqua:yannh/kubeconform

      # Round Table custom resources vs. the CRDs of the chart digest Flux
      # deploys (roundtable-k8s/roundtable#254), plus a negative test.
      - name: Validate Round Table manifests
        run: .github/scripts/validate-roundtable.sh

  # Knights open pull requests from `knight/...` branches
  # (roundtable-k8s/roundtable#288). Such a pull request may only touch the
  # Round Table's own config, and never its RBAC, tokens or encrypted files.
  # Knights share dunce-bot's identity with Renovate and autodeploy, so this
  # rests on the branch name: a convention the owner accepted, not a boundary.
  knight-pr-paths:
    if: ${{ startsWith(github.head_ref, 'knight/') }}
    name: Round Table - Knight PR Paths
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check changed paths
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.number }}
        run: |
          gh api "repos/${REPO}/pulls/${PR}/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)' | sort -u > files.txt
          bad=$(grep -v -E '^kubernetes/apps/roundtable/' files.txt || true)
          bad="${bad}$(printf '\n'; grep -E '(\.sops\.|rbac|github-token\.yaml$|/namespace\.yaml$)' files.txt || true)"
          bad=$(printf '%s\n' "$bad" | sed '/^$/d' | sort -u)
          if [ -n "$bad" ]; then
            echo "::error::a knight pull request may not change these paths:"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "All $(wc -l < files.txt) changed files are allowed."

  # Single aggregate check: the one to mark required in a branch ruleset.
  status:
    if: ${{ !cancelled() }}
    name: Build Success
    needs:
      - image-pull-filter
      - image-pull-extract
      - image-pull
      - zizmor
      - roundtable-validate
      - knight-pr-paths
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: echo "All jobs passed or skipped" && echo "$RESULTS"
