---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Obsidian Vault

# Chart render of the obsidian-vault HelmReleases (Syncthing in app/, the vault jobs in
# jobs/): `kustomize build` never hands the values to the app-template schema, so a value
# it rejects would only show up in the cluster. Same check locally:
#   scripts/helm-values-check.sh kubernetes/apps/selfhosted/obsidian-vault/*/helmrelease.yaml
# The job scripts and their tests live in the private dapperdivers/vault-jobs repository,
# which builds the image the CronJobs run.

on:
  pull_request:
    branches: ["main"]
    paths:
      - kubernetes/apps/selfhosted/obsidian-vault/app/helmrelease.yaml
      - kubernetes/apps/selfhosted/obsidian-vault/jobs/helmrelease.yaml
      # the chart version the HelmRelease is rendered with
      - kubernetes/flux/components/common/repos/app-template/**
      - scripts/helm-values-check.sh
      - .github/workflows/obsidian-vault.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Obsidian Vault - Chart
    # GitHub-hosted on purpose: this runs a script from the pull request, and the
    # self-hosted runners can reach the cluster. No secrets are used.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          # Pinned so a broken mise release can't float into CI on its own
          # (see ci.yaml).
          # renovate: datasource=github-releases depName=jdx/mise
          version: v2026.11.14
          cache: false
          # Only the tools this job uses, at the versions .mise.toml pins.
          install_args: aqua:helm/helm aqua:mikefarah/yq

      - name: Render the HelmReleases with their chart
        run: scripts/helm-values-check.sh kubernetes/apps/selfhosted/obsidian-vault/*/helmrelease.yaml
