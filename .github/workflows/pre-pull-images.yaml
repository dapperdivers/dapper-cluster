---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Image Pull

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter:
    name: Image Pull - Filter
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        with:
          patterns: kubernetes/**/*

  extract:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Image Pull - Extract Images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.extract.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          # Pinned so a broken mise release can't float into CI on its own
          # (mise-action's `version` defaults to "latest"). 2026.7.17 could not
          # resolve aqua packages with prefixed upstream tags — kubernetes-sigs/
          # kustomize tags as kustomize/vX.Y.Z — and 404'd on this repo's
          # .mise.toml; 2026.7.18 fixes it.
          # renovate: datasource=github-releases depName=jdx/mise
          version: v2026.7.18
          cache: false
          # Only install what this job actually uses. Without this, one broken
          # tool anywhere in .mise.toml takes down image pulling.
          install_args: github:home-operations/flate
          tool_versions: |
            github:home-operations/flate 0.4.9

      - name: Extract Images
        id: extract
        run: |
          echo 'images<<EOF' >> $GITHUB_OUTPUT
          flate diff images -p ./kubernetes/flux/cluster -o json >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

  pull:
    if: ${{ needs.extract.outputs.images != '[]' }}
    needs: extract
    name: Image Pull - Pull Images
    runs-on: ${{ github.event.repository.name }}-runner
    strategy:
      matrix:
        image: ${{ fromJSON(needs.extract.outputs.images) }}
      max-parallel: 4
      fail-fast: false
    steps:
      - name: Setup Mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          # Pinned so a broken mise release can't float into CI on its own
          # (mise-action's `version` defaults to "latest"). 2026.7.17 could not
          # resolve aqua packages with prefixed upstream tags — kubernetes-sigs/
          # kustomize tags as kustomize/vX.Y.Z — and 404'd on this repo's
          # .mise.toml; 2026.7.18 fixes it.
          # renovate: datasource=github-releases depName=jdx/mise
          version: v2026.7.18
          cache: false
          # NOTE: intentionally not scoped with install_args like the extract job.
          # This job has no checkout, so `talosctl latest` below is the only tool
          # spec; if a stale runner workspace leaves mise.lock behind, mise-action
          # auto-adds --locked and a scoped `talosctl` would fail as "not in the
          # lockfile".
          tool_versions: |
            talosctl latest

      - name: Pull Image
        env:
          IMAGE: ${{ matrix.image }}
        run: talosctl --nodes "$NODE" image pull "$IMAGE"

  success:
    if: ${{ !cancelled() }}
    needs: pull
    name: Image Pull - Success
    runs-on: ubuntu-latest
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: echo "All jobs passed or skipped" && echo "$RESULTS"
