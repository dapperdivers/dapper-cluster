# DRAFT (fleet-restore, 2026-11-24). Converted from dapper-cluster 12cbac303^ to the current CRD shape
# (roundtable-k8s/roundtable#241). Validated with kubectl apply --dry-run=server; never applied.
# Phase 3 (credentials + offensive tooling). Needs: ExternalSecret agravain -> Secret agravain-secret
# (infra/agravain-externalsecret.yaml; Infisical key SHODAN_API_KEY, still used by opencti).
# Model is the original one; confirm it still exists in pi-knight's catalog or pick a new one.
# Removed: writable vault path Research/ (no such top-level folder any more; Agents/Roundtable/ is writable).
# Runs scanners and password crackers against targets named in tasks: hold until egress allow-lists exist (roundtable#348/#168).
---
apiVersion: ai.roundtable.io/v1alpha1
kind: Knight
metadata:
  name: agravain
  namespace: roundtable
  labels:
    ai.roundtable.io/round-table: personal
    # legacy label: shared-workspace mount and the mission planner still read only this one
    ai.roundtable.io/table: personal
spec:
  domain: pentest
  # Kimi K2.6 (was openrouter/google/gemini-2.5-flash).
  model: "openrouter/moonshotai/kimi-k2.6:exacto"
  # capabilities:
  #   browser: true  # Disabled until browser sidecar is configured
  skills:
    - shared
    - pentest
    - research # For autoresearch skill optimization
  tools:
    nix:
      - nmap
      - whois
      - dnsutils
      - nikto
      - gobuster
      - ffuf
      - masscan
      - testssl
      - sqlmap
      - nuclei
      - katana
      - naabu
      - dalfox
      - gowitness
      # - zaproxy  # Package broken/missing in nixpkgs
      - feroxbuster
      - socat
      - tcpdump
      - curl # For autoresearch API calls
      - jq # For JSON processing
      # Expanded Pentest Tools (Added 2026-04-06)
      - wpscan # WordPress security scanner
      - rustscan # Fast port scanner
      - thc-hydra # Credential brute-forcing
      - john # Password cracking
      - hashcat # GPU-accelerated password cracking
      - amass # Subdomain enumeration
      - subfinder # Passive subdomain discovery
      - whatweb # Web technology fingerprinting
      - netexec # Network service exploitation (crackmapexec successor; renamed in nixpkgs)
  # --- Isolation (whiteboard decision 8, roundtable-k8s/roundtable#377): gVisor + default-deny egress. ---
  # Every knight is isolated by default; opting out must be explicit. Neither field exists in the CRD yet,
  # so both are commented out: runtimeClassName comes with #164 (PR #383) and needs #212 on the cluster;
  # egress comes with #348 (per knight) and #349 (table default). Uncomment when those land.
  # Role: pi-knight; pentest (phase 3, held until egress exists, #380).
  # runtimeClassName: gvisor
  # egress:
  #   allowedHosts:
  #     - openrouter.ai         # model provider (pi-knight, OPENROUTER_API_KEY from roundtable-secret)
  #     - github.com            # git-sync sidecar pulling the arsenal (gone once the arsenal is an OCI image volume, #350)
  #     - api.shodan.io         # Shodan
  #     - internetdb.shodan.io  # Shodan InternetDB
  #     - <engagement targets>  # the named targets of each engagement, and nothing else
  #   allowedPorts: [443]
  # A standing allowlist cannot fit a scanner whose targets change per task. Either an allowlist per
  # engagement (edit, apply, run, remove) or an ephemeral mission knight (#368) with the target list.
  nats:
    url: nats://nats.database.svc:4222
    subjects:
      - "fleet-a.tasks.pentest.>"
      - "fleet-a.tasks.research.>" # For autoresearch tasks
    stream: fleet_a_tasks
    resultsStream: fleet_a_results
    maxDeliver: 1
  vault:
    claimName: roundtable-vault
    readOnly: true
    writablePaths:
      - "Agents/Briefings/"
      - "Agents/Roundtable/"
  arsenal:
    name: personal
    repo: https://github.com/dapperdivers/roundtable-arsenal
    ref: main
    periodSeconds: 300
  workspace:
    size: "10Gi"
  concurrency: 1
  taskTimeoutSeconds: 1800
  env:
    - name: TMPDIR
      value: "/data/scratch"
    - name: XDG_CACHE_HOME
      value: "/data/scratch/.cache"
  envFrom:
    - secretRef:
        name: roundtable-secret
    - secretRef:
        name: agravain-secret
  prompt:
    identity: |
      You are Sir Agravain, Knight of Pentesting and Research for the Round Table.
      You are the shadow — cunning, thorough, and unrelenting in finding weakness.
      Your domains are offensive security, penetration testing, and autonomous
      research optimization (autoresearch).
