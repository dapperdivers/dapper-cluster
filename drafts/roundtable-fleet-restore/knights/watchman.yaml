# DRAFT (fleet-restore, 2026-11-24). Converted from dapper-cluster 12cbac303^ to the current CRD shape
# (roundtable-k8s/roundtable#241). Validated with kubectl apply --dry-run=server; never applied.
# Phase 4, roundtable-dev table. ServiceAccount watchman and its RBAC already exist on main (infrastructure/app/watchman-rbac.yaml).
# Model is the original one; confirm it still exists in pi-knight's catalog or pick a new one.
# Blocked on the org arsenal's watch/night-watch-triage skill: it still writes Missions in the old CRD shape and
# names retired knights (rt-runtime, rt-arsenal). The prompt below names them too: update when restoring.
---
apiVersion: ai.roundtable.io/v1alpha1
kind: Knight
metadata:
  name: watchman
  namespace: roundtable
  labels:
    ai.roundtable.io/round-table: roundtable-dev
    # legacy label: shared-workspace mount and the mission planner still read only this one
    ai.roundtable.io/table: roundtable-dev
spec:
  domain: watch
  serviceAccountName: watchman
  # Cloud model on purpose: triage over 24h of telemetry needs more context
  # and reasoning than the local qwen pool offers. DeepSeek V4 Pro keeps the
  # high-context value lane without paying frontier-model rates.
  model: "openrouter/deepseek/deepseek-v4-pro"
  skills:
    - shared
    - watch
  tools:
    nix:
      - kubectl
      - curl
      - jq
      - yq-go
      - gh
      - ripgrep
      - stern
      - k9s
  # --- Isolation (whiteboard decision 8, roundtable-k8s/roundtable#377): gVisor + default-deny egress. ---
  # Every knight is isolated by default; opting out must be explicit. Neither field exists in the CRD yet,
  # so both are commented out: runtimeClassName comes with #164 (PR #383) and needs #212 on the cluster;
  # egress comes with #348 (per knight) and #349 (table default). Uncomment when those land.
  # Role: pi-knight, roundtable-dev table; night-watch chain (#381).
  # runtimeClassName: gvisor
  # egress:
  #   allowedHosts:
  #     - openrouter.ai                # model provider (pi-knight, OPENROUTER_API_KEY from roundtable-secret)
  #     - github.com                   # git-sync sidecar pulling the arsenal (gone once the arsenal is an OCI image volume, #350)
  #     - api.github.com               # gh / GitHub API with the knight's token
  #     - <kube-apiserver>             # kubectl with the knight's ServiceAccount: NOT a hostname; needs a toEntities: kube-apiserver rule #348 does not render yet
  #     - <prometheus / victorialogs>  # in-cluster, unauthenticated APIs: see #381 before allowing them
  #   allowedPorts: [443]
  nats:
    url: nats://nats.database.svc:4222
    subjects:
      - "rt-dev.tasks.watch.>"
    stream: rt_dev_tasks
    resultsStream: rt_dev_results
    maxDeliver: 1
  vault:
    claimName: roundtable-vault
    readOnly: true
    writablePaths:
      - "Agents/NightWatch/"
      - "Agents/Briefings/NightWatch/"
  arsenal:
    name: personal
    repo: https://github.com/dapperdivers/roundtable-arsenal
    ref: main
    periodSeconds: 300
  # watch/* skills (night-watch-triage, telemetry-queries) live in the org arsenal
  arsenals:
    - name: platform
      repo: https://github.com/roundtable-k8s/arsenal
      ref: main
      periodSeconds: 300
  workspace:
    size: "5Gi"
  concurrency: 1
  taskTimeoutSeconds: 3600
  env:
    - name: TMPDIR
      value: "/data/scratch"
    - name: XDG_CACHE_HOME
      value: "/data/scratch/.cache"
  envFrom:
    - secretRef:
        name: roundtable-secret
  prompt:
    identity: |
      You are the Watchman, sentinel of the Night Watch and member of the
      Round Table development team (roundtable-dev table). Your domain is
      the health of the platform itself: the roundtable operator, pi-knight
      runtime, dashboard, arsenal, and the manifests that deploy them.

      Each night you sweep Prometheus and Victoria Logs for the day's errors,
      reduce them to fingerprinted incidents, and dispatch at most THREE fix
      Missions to your teammates (rt-runtime, rt-ui, rt-operator, rt-arsenal).
      You never fix code yourself — you observe, triage, dispatch, keep the
      ledger at /vault/Agents/NightWatch/ledger.md truthful, and write the morning
      report yourself.

      Read the watch/telemetry-queries and watch/night-watch-triage skills
      before acting. Discipline over heroics: a quiet, accurate night beats
      a busy, noisy one.
