# DRAFT (fleet-restore, 2026-11-24). Converted from dapper-cluster 12cbac303^ to the current CRD shape
# (roundtable-k8s/roundtable#241). Validated with kubectl apply --dry-run=server; never applied.
# Phase 1. ServiceAccount tristan and its two ClusterRoleBindings already exist on main (infrastructure/app/rbac.yaml, knight-rbac.yaml).
# Model is the original one; confirm it still exists in pi-knight's catalog or pick a new one.
# Removed: the dormant ollama-pool env block.
# gh is in the tool list but tristan has no GitHub token any more (the shared GAWAIN PAT is gone); add spec.github if wanted.
# Persona for the kagent job nightwatch, as a Chain (decision 13, #214): chains/jobs/nightwatch.yaml.
# flux-ops and k8s-reader retire: a person asks tristan through the gateway instead (infra/flux-ops skill).
---
apiVersion: ai.roundtable.io/v1alpha1
kind: Knight
metadata:
  name: tristan
  namespace: roundtable
  labels:
    ai.roundtable.io/round-table: personal
    # legacy label: shared-workspace mount and the mission planner still read only this one
    ai.roundtable.io/table: personal
spec:
  domain: infra
  serviceAccountName: tristan
  model: "openrouter/deepseek/deepseek-v3.2"
  skills:
    - shared
    - infra
  tools:
    nix:
      - kubectl
      - kubectx # Fast context/namespace switching (Added 2026-04-06)
      - kubernetes-helm
      - stern
      - k9s
      - fluxcd
      - nmap
      - talosctl
      - cilium-cli
      - yq-go
      # Container & Cluster Analysis (Added 2026-03-23)
      - trivy # Vulnerability scanning for container images and IaC
      - popeye # Kubernetes cluster sanity checks
      - crane # Container image inspection and manipulation
      # Added 2026-03-09 - Fleet self-improvement assessment
      - procps # ps, top, free, vmstat - CRITICAL for process visibility
      - bind # dig, host, nslookup - CRITICAL for DNS debugging
      - iputils # ping - CRITICAL for network connectivity testing
      - traceroute # Network path debugging
      - htop # Interactive process monitor
      - iftop # Network bandwidth monitor
      - netcat-gnu # Network testing (nc)
      - go # Go compiler for operator development
      - gnumake # make for CRD generation
      - gh # GitHub CLI for PR creation
      - jq # JSON processing
      - tree
      - curl
  # --- Isolation (whiteboard decision 8, roundtable-k8s/roundtable#377): gVisor + default-deny egress. ---
  # Every knight is isolated by default; opting out must be explicit. Neither field exists in the CRD yet,
  # so both are commented out: runtimeClassName comes with #164 (PR #383) and needs #212 on the cluster;
  # egress comes with #348 (per knight) and #349 (table default). Uncomment when those land.
  # Role: pi-knight; jobs: nightwatch (chains/jobs/nightwatch.yaml), morning-briefing infra step.
  # runtimeClassName: gvisor
  # egress:
  #   allowedHosts:
  #     - openrouter.ai              # model provider (pi-knight, OPENROUTER_API_KEY from roundtable-secret)
  #     - github.com                 # git-sync sidecar pulling the arsenal (gone once the arsenal is an OCI image volume, #350)
  #     - <kube-apiserver>           # kubectl with the knight's ServiceAccount: NOT a hostname; needs a toEntities: kube-apiserver rule #348 does not render yet
  #     - <talos nodes>              # talosctl to the node IPs on 50000: CIDR, not a hostname; drop talosctl or add a CIDR rule
  #     - raw.githubusercontent.com  # upstream release notes and issues (nightwatch web lookups)
  #     - api.github.com             # GitHub issues/releases (nightwatch); anonymous unless spec.github is set
  #     - kubernetes.io              # docs
  #     - fluxcd.io                  # docs
  #     - docs.cilium.io             # docs
  #     - docs.ceph.com              # docs
  #     - www.talos.dev              # docs
  #     - cloudnative-pg.io          # docs
  #   allowedPorts: [443]
  # nmap and the network tools (traceroute, iftop, netcat) cannot work under an allowlist; drop them.
  nats:
    url: nats://nats.database.svc:4222
    subjects:
      - "fleet-a.tasks.infra.>"
    stream: fleet_a_tasks
    resultsStream: fleet_a_results
    maxDeliver: 1
  vault:
    claimName: roundtable-vault
    readOnly: true
    writablePaths:
      - "Agents/Briefings/"
      - "Agents/Roundtable/"
  arsenal:
    name: personal
    repo: https://github.com/dapperdivers/roundtable-arsenal
    ref: main
    periodSeconds: 300
  workspace:
    size: "10Gi"
  concurrency: 2
  taskTimeoutSeconds: 1800
  env:
    - name: TMPDIR
      value: "/data/scratch"
    - name: XDG_CACHE_HOME
      value: "/data/scratch/.cache"
  envFrom:
    - secretRef:
        name: roundtable-secret
  prompt:
    identity: |
      You are Sir Tristan, Knight of Infrastructure for the Round Table.
      You are the ranger — tireless, observant, and master of the wilds.
      Your domain is HomeLab, Kubernetes, and cluster operations.
