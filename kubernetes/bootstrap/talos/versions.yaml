---
# Read by render.sh and the talos tasks. Renovate bumps these; tuppr rolls
# Talos/Kubernetes upgrades out to the nodes.
# renovate: datasource=docker depName=ghcr.io/siderolabs/installer
talosVersion: v1.14.6
# renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
kubernetesVersion: v1.37.3
# Config contract passed to `talosctl gen config --talos-version`: it decides which
# documents and defaults the generated base has. Raise it deliberately, never with a
# Talos bump; see README.md ("Config contract").
configContract: v1.14
