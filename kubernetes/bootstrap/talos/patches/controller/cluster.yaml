cluster:
  allowSchedulingOnControlPlanes: false
  apiServer:
    extraArgs:
      # https://kubernetes.io/docs/tasks/extend-kubernetes/configure-aggregation-layer/
      enable-aggregator-routing: true
      feature-gates: MutatingAdmissionPolicy=true
      runtime-config: admissionregistration.k8s.io/v1beta1=true
      # Increase timeouts and request handling capacity
      request-timeout: "300s"
      max-requests-inflight: "800"
      max-mutating-requests-inflight: "400"
      # Reduce watch cache memory usage
      default-watch-cache-size: "100"
      # OIDC authentication (structured multi-issuer) lives in its own patch:
      # ./patches/controller/apiserver-oidc.yaml
    # Live heap sits at ~2-3 GiB per apiserver (219 CRDs, ~1,100 watches on the
    # busiest one), flat over a week: no leak. At 4Gi, GOMEMLIMIT (95% of the
    # limit, set by Talos) left no headroom and control-1 was OOM-killed on
    # 2026-11-20. Node has 16 GiB; peak use <50%.
    resources:
      requests:
        cpu: 500m
        memory: 3Gi
      limits:
        cpu: 2000m
        memory: 6Gi
    admissionControl:
      - name: PodSecurity
        configuration:
          apiVersion: pod-security.admission.config.k8s.io/v1beta1
          kind: PodSecurityConfiguration
          exemptions:
            namespaces:
              - openebs-system
  controllerManager:
    extraArgs:
      bind-address: 0.0.0.0
  coreDNS:
    disabled: true
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
      quota-backend-bytes: "1073741824" # 1 GiB (double peak usage of ~350MB)
      # Widen raft timeouts to tolerate ~20-22ms WAL fsync latency on Proxmox VM
      # disks (SSD/hardware migration ruled out). Stops leader flapping when a
      # heartbeat is delayed by a slow fsync. election-timeout is 10x heartbeat.
      heartbeat-interval: "250" # default 100ms
      election-timeout: "2500" # default 1000ms
    advertisedSubnets:
      - 10.100.0.0/24
  proxy:
    disabled: true
  scheduler:
    extraArgs:
      bind-address: 0.0.0.0
