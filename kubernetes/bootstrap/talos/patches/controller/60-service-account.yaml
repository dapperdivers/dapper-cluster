# Service-account signing key.
#
# The key lives in the Talos 1.14 KubeServiceAccountConfig document instead of
# v1alpha1 .cluster.serviceAccount (Talos rejects both at once), because only
# the new document has accepted.publicKeys: extra keys the apiserver trusts,
# which is what makes a zero-downtime key rotation possible.
#
# issuer.privateKey is filled in by render.sh from talsecret.sops.yaml
# (certs.k8sserviceaccount.key); only public keys belong in this file.
#
# Rotation 2026-11-21 (old key exposed in a session transcript):
#   stage A  sign with OLD, accept NEW  (done)
#   stage B  sign with NEW, accept OLD  (bundle key swapped)  <- current
#   stage C  sign with NEW, accept nothing
cluster:
  serviceAccount:
    $patch: delete
---
apiVersion: v1alpha1
kind: KubeServiceAccountConfig
issuer:
  privateKey: SET_BY_RENDER_SH
  issuerURL: https://10.100.0.40:6443
accepted:
  publicKeys:
    # old (exposed) key, sha256(DER) ed09c41d875c9a8d. Remove in stage C, once
    # no pod still holds a token signed by it.
