# kube-apiserver OIDC authentication — Structured Authentication Configuration.
#
# Authentik gives every application its OWN issuer URL (…/application/o/<slug>/), so the
# legacy single-issuer --oidc-* flags can only ever trust one app. This uses the k8s
# Structured Authentication Config to trust MULTIPLE issuers — one JWT authenticator per
# app, each scoped to its own audience. Both map preferred_username -> user and
# groups -> groups with the `oidc:` prefix, so the oidc-rbac ClusterRoleBindings apply
# identically regardless of which app issued the token. x509 cert auth (talosconfig /
# admin kubeconfig) remains the break-glass.
#
# Delivery: Talos renders `configuration` below into the apiserver's
# --authentication-config file itself (as apiserver.config.k8s.io/v1beta1) and restarts
# the apiserver when it changes. Before the 1.14 config contract this was a machine.files
# entry under /var/lib/kubernetes/authentication plus an extraVolume and an extraArg.
#
# Adding a new OIDC-to-apiserver app (e.g. another dashboard) = add a jwt authenticator
# block below with that app's issuer + audience.
#
# Hardening (both authenticators):
#   - userValidationRules: the apiserver itself rejects tokens that don't map to a
#     kubernetes-* access group — a second gate independent of the Authentik policy
#     bindings on the kubectl/headlamp applications. CEL errors fail CLOSED. NOTE:
#     this check must live in userValidationRules (post-mapping, `user.groups` is a
#     typed list(string)) — in claimValidationRules `claims.groups` is type `any`,
#     and CEL comprehensions over `any` FAIL COMPILATION -> apiserver crash-loop on
#     restart (hit live on control-1, 2026-07-01).
#   - uid <- sub: audit-stable identity. preferred_username is user-editable in
#     Authentik; sub (sub_mode: hashed_user_id) is immutable. Never bind kind: User
#     RBAC to oidc: usernames.
#
# anonymous: Talos now always uses this file and no longer passes --anonymous-auth=false,
# and its default document allows anonymous /livez, /readyz and /healthz. Anonymous access
# stays fully off here, as it was. That is tied to `startupProbes: false` in
# 00-apiserver.yaml: the apiserver pod's probes are anonymous requests.
# (`configuration` is replaced as a whole by a patch, not merged, so everything the
# apiserver should use must be in this file.)
apiVersion: v1alpha1
kind: KubeAuthenticationConfig
configuration:
  anonymous:
    enabled: false
  jwt:
    # kubectl CLI (kubelogin)
    - issuer:
        url: "https://sso.chelonianlabs.com/application/o/kubectl/"
        audiences:
          - "kubectl"
      claimMappings:
        username:
          claim: "preferred_username"
          prefix: "oidc:"
        groups:
          claim: "groups"
          prefix: "oidc:"
        uid:
          claim: "sub"
      userValidationRules:
        - expression: 'user.groups.exists(g, g in ["oidc:kubernetes-admins", "oidc:kubernetes-viewers"])'
          message: "not a member of a kubernetes access group"
    # Headlamp web dashboard
    - issuer:
        url: "https://sso.chelonianlabs.com/application/o/headlamp/"
        audiences:
          - "headlamp"
      claimMappings:
        username:
          claim: "preferred_username"
          prefix: "oidc:"
        groups:
          claim: "groups"
          prefix: "oidc:"
        uid:
          claim: "sub"
      userValidationRules:
        - expression: 'user.groups.exists(g, g in ["oidc:kubernetes-admins", "oidc:kubernetes-viewers"])'
          message: "not a member of a kubernetes access group"
