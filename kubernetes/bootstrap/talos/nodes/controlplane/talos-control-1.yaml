# talos-control-1 (10.100.0.50). Its role comes from the directory this file is in.
machine:
  install:
    disk: /dev/vda
    image: factory.talos.dev/installer/5cc10e6e83c6e3b32167fe812094d4715c9fa3e1a77bcfe61fa4cf71b4b9fed3:${TALOS_VERSION}
---
apiVersion: v1alpha1
kind: HostnameConfig
auto: "off"
hostname: talos-control-1
---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: ethSel0
selector:
  match: glob("bc:24:11:2e:9f:34", mac(link.hardware_addr))
---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: ethSel1
selector:
  match: glob("bc:24:11:0a:70:8d", mac(link.hardware_addr))
---
apiVersion: v1alpha1
kind: Layer2VIPConfig
name: 10.100.0.40
link: ethSel0
---
apiVersion: v1alpha1
kind: LinkConfig
name: ethSel0
mtu: 9000
addresses:
  - address: 10.100.0.50/24
routes:
  - gateway: 10.100.0.1
---
apiVersion: v1alpha1
kind: LinkConfig
name: ethSel1
mtu: 9000
addresses:
  - address: 10.150.0.10/24
