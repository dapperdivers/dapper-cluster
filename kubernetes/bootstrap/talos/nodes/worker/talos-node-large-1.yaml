# talos-node-large-1 (10.100.0.54). Its role comes from the directory this file is in.
# gVisor node for sandboxed agents, labelled workload.cluster.io/agent-sandbox:
# - Agent Substrate gVisor workers (kagent, #4777) run their own runsc inside an
#   unprivileged worker pod, which needs to create user namespaces. Talos
#   defaults this to 0 as hardening ("fork/exec ...: no space left on device"),
#   so only nodes with this label raise it.
# - Round Table knights run under the `gvisor` RuntimeClass (handler runsc,
#   kubernetes/apps/roundtable/infrastructure/app/runtimeclass-gvisor.yaml),
#   which needs the siderolabs/gvisor extension in the install image.
#   Schematic 36c18967... = qemu-guest-agent + nfsrahead + gvisor
#   (roundtable-k8s/roundtable#212). large-2 and large-3 run it too.
apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  image: factory.talos.dev/installer/36c18967cadc8f0e76ff8c1e1492b65f404e2e897012f5a4c147f45b4fae12e3:${TALOS_VERSION}
provisioning:
  diskSelector:
    match: disk.dev_path == "/dev/sda"
  wipe: false
---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  workload.cluster.io/agent-sandbox: "true"
---
apiVersion: v1alpha1
kind: SysctlConfig
params:
  user.max_user_namespaces: "11255"
---
apiVersion: v1alpha1
kind: HostnameConfig
auto: "off"
hostname: talos-node-large-1
---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: ethSel0
selector:
  match: glob("bc:24:11:7d:6d:e5", mac(link.hardware_addr))
---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: ethSel1
selector:
  match: glob("bc:24:11:b5:70:e8", mac(link.hardware_addr))
---
apiVersion: v1alpha1
kind: LinkConfig
name: ethSel0
mtu: 9000
addresses:
  - address: 10.100.0.54/24
routes:
  - gateway: 10.100.0.1
---
apiVersion: v1alpha1
kind: LinkConfig
name: ethSel1
mtu: 9000
addresses:
  - address: 10.150.0.14/24
