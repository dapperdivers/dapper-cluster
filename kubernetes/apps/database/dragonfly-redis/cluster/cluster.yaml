# yaml-language-server: $schema=https://kube-schemas.pages.dev/dragonflydb.io/dragonfly_v1alpha1.json
---
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: dragonfly
spec:
  image: ghcr.io/dragonflydb/dragonfly:v1.40.2
  replicas: 3
  # Dragonfly is a shared, passwordless cross-namespace cache (paperless,
  # searxng, etc.). Operator v1.6.x managed a same-namespace-only NetworkPolicy
  # (we set networkPolicyEnabled: false); v1.7 removed the feature and the CRD
  # field, so no policy is created and the field must not be set.
  args:
    # maxmemory is kept well below limits.memory: Dragonfly's RSS includes
    # connection buffers and snapshot/replication fork overhead on top of the
    # dataset, so setting maxmemory == the cgroup limit causes OOMKills under
    # bursts before eviction can kick in.
    # Originally sized for OpenCTI's event stream (OpenCTI retired 2026-11);
    # could be shrunk now that only small shared-cache tenants remain.
    - --maxmemory=2560Mi
    - --proactor_threads=2
    - --cluster_mode=emulated
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 3Gi
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values:
                  - mayastor-storage
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: "kubernetes.io/hostname"
      whenUnsatisfiable: "DoNotSchedule"
      labelSelector:
        matchLabels:
          app.kubernetes.io/part-of: dragonfly
