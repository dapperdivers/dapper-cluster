---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # The plugin is deployed with app-template, which ships no CRDs. These were
  # applied by hand at install (2025-07) and went stale; track them with the
  # plugin version (Renovate groups this with the operator + sidecar images).
  # renovate: datasource=github-releases depName=cloudnative-pg/plugin-barman-cloud
  - https://raw.githubusercontent.com/cloudnative-pg/plugin-barman-cloud/v0.16.0/config/crd/bases/barmancloud.cnpg.io_objectstores.yaml
  - ./helmrelease.yaml
  # minio-store: kept read-only as the restore source for the PG17 archive
  # (postgres-v3) and pre-Garage PG18 history (postgres-v4) until retired.
  - ./objectstore.yaml
  - ./garage-store.yaml
