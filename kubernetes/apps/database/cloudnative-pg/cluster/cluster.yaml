---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 3
  # standard-trixie: the bare 17.x tags were the legacy bullseye images (Debian
  # 11, EOL), and PG18 images ship only for bookworm/trixie. CNPG's in-place
  # major upgrade requires the SAME distro on both sides, so the distro move
  # happens here on 17 first (all DBs use the C collation, so the glibc change
  # can't affect index order). Standard images include pgvector (archon/postgres).
  imageName: ghcr.io/cloudnative-pg/postgresql:17.12-standard-trixie@sha256:b6d31545fc2c500cc56af2cff91bbc37408deff6815b84446da0a2c9a54b3d1c
  primaryUpdateStrategy: unsupervised
  # Promote an already-updated replica instead of restarting the primary in
  # place. With the default (restart), the primary is down while its node pulls
  # the new image — ~3 min of write outage on the 17.6 -> 17.11 bump (#4575),
  # which crash-looped authentik. Switchover is a few seconds of reconnects.
  primaryUpdateMethod: switchover
  storage:
    size: 20Gi
    storageClass: ceph-rbd
  walStorage:
    size: 20Gi
    storageClass: ceph-rbd
  superuserSecret:
    name: cloudnative-pg-secret
  enableSuperuserAccess: true
  postgresql:
    parameters:
      max_connections: "400"
      shared_buffers: 256MB
      max_slot_wal_keep_size: 4GB
  resources:
    requests:
      cpu: 2000m
      memory: 1Gi
    limits:
      cpu: 6000m
      memory: 8Gi
  monitoring:
    enablePodMonitor: false
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: minio-store
        serverName: postgres-v3
  bootstrap:
    recovery:
      source: postgres-v2
  # NOTE: externalClusters is needed when recovering from an existing cnpg cluster
  externalClusters:
    - name: postgres-v2
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: minio-store
          serverName: postgres-v2
