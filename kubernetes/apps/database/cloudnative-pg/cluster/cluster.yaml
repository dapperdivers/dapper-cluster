---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 3
  # standard-trixie: standard images include pgvector (archon/postgres DBs).
  # A MAJOR bump here is an offline in-place pg_upgrade, which CNPG only supports
  # within the same distro — keep the -trixie suffix, and change the barman
  # serverName below in the same commit (the plugin doesn't separate archives
  # across majors). 17 -> 18 done 2026-11 (#4689 distro move, then this).
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie@sha256:1abcfd1cac6d53cda5185706819aab36d66a4ed88e99fc2ae44ab0826aa99f00
  primaryUpdateStrategy: unsupervised
  # Promote an already-updated replica instead of restarting the primary in
  # place. With the default (restart), the primary is down while its node pulls
  # the new image — ~3 min of write outage on the 17.6 -> 17.11 bump (#4575),
  # which crash-looped authentik. Switchover is a few seconds of reconnects.
  primaryUpdateMethod: switchover
  storage:
    size: 20Gi
    storageClass: ceph-rbd
  walStorage:
    size: 20Gi
    storageClass: ceph-rbd
  superuserSecret:
    name: cloudnative-pg-secret
  enableSuperuserAccess: true
  postgresql:
    parameters:
      max_connections: "400"
      shared_buffers: 256MB
      max_slot_wal_keep_size: 4GB
  resources:
    requests:
      cpu: 2000m
      memory: 1Gi
    limits:
      cpu: 6000m
      memory: 8Gi
  monitoring:
    enablePodMonitor: false
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        # Garage (storage/garage) since 2026-11. Old archives stay in MinIO
        # (minio-store): postgres-v3 = PG17, postgres-v4 = PG18's first hours.
        barmanObjectName: garage-store
        serverName: postgres-v4
  bootstrap:
    recovery:
      source: postgres-v2
  # NOTE: externalClusters is needed when recovering from an existing cnpg cluster
  externalClusters:
    - name: postgres-v2
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: minio-store
          serverName: postgres-v2
