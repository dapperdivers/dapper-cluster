---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11@sha256:70664ebcfa1100361b5bdc28bbf06fdbe08db2dc4ad7bd14de33c5e05fe8ea8e
  primaryUpdateStrategy: unsupervised
  # Promote an already-updated replica instead of restarting the primary in
  # place. With the default (restart), the primary is down while its node pulls
  # the new image — ~3 min of write outage on the 17.6 -> 17.11 bump (#4575),
  # which crash-looped authentik. Switchover is a few seconds of reconnects.
  primaryUpdateMethod: switchover
  storage:
    size: 20Gi
    storageClass: ceph-rbd
  walStorage:
    size: 20Gi
    storageClass: ceph-rbd
  superuserSecret:
    name: cloudnative-pg-secret
  enableSuperuserAccess: true
  postgresql:
    parameters:
      max_connections: "400"
      shared_buffers: 256MB
      max_slot_wal_keep_size: 4GB
  resources:
    requests:
      cpu: 2000m
      memory: 1Gi
    limits:
      cpu: 6000m
      memory: 8Gi
  monitoring:
    enablePodMonitor: false
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: minio-store
        serverName: postgres-v3
  bootstrap:
    recovery:
      source: postgres-v2
  # NOTE: externalClusters is needed when recovering from an existing cnpg cluster
  externalClusters:
    - name: postgres-v2
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: minio-store
          serverName: postgres-v2
