---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app vault-mcp
  namespace: &namespace selfhosted
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      # Serves the Obsidian vault to kagent agents; see kubernetes/apps/kagent/README.md
      app.kubernetes.io/part-of: kagent
  dependsOn:
    # Owns the obsidian-second-brain PVC this mounts.
    - name: obsidian-vault
      namespace: *namespace
  path: ./kubernetes/apps/selfhosted/vault-mcp/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 10m
