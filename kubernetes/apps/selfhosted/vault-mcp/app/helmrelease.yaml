---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault-mcp
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      vault-mcp:
        containers:
          app:
            image:
              repository: docker.io/library/node
              tag: 24.22.3-alpine@sha256:116b800c3754b440ee0aa3ed2f20f5bf3d99a554bfd9adeea09ea8017f6e85f5
            # The MCP filesystem server only speaks stdio; supergateway serves it as
            # Streamable HTTP at :8000/mcp, which kagent's RemoteMCPServer needs.
            # The vault is mounted read-only, so write tools fail even if called.
            command:
              - npx
              - -y
              - supergateway@4.2.2
              - --stdio
              - npx -y @modelcontextprotocol/server-filesystem@2.3.0 /vault
              - --outputTransport
              - streamableHttp
              - --port
              - "8000"
              - --healthEndpoint
              - /healthz
            env:
              TZ: ${TIME_ZONE}
              HOME: /tmp
              NPM_CONFIG_CACHE: /tmp/.npm
              NPM_CONFIG_UPDATE_NOTIFIER: "false"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8000
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 5
                  # First start downloads both npm packages.
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        # Vault files are owned by syncthing's 1000:1000.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: vault-mcp
        ports:
          http:
            port: *port
    persistence:
      vault:
        existingClaim: obsidian-second-brain
        globalMounts:
          - path: /vault
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
