---
# Only kagent's controller may reach the vault (agents' tool calls go through it);
# the API key is the second check (#4777).
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vault-mcp
spec:
  description: Vault MCP server, only from the kagent controller.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vault-mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kagent
            app.kubernetes.io/name: kagent
            app.kubernetes.io/component: controller
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # Kubelet probes.
    - fromEntities:
        - host
