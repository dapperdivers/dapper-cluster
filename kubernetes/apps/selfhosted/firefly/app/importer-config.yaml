---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# SimpleFIN import configuration for the daily CronJob, rendered as a Secret
# because it embeds the SimpleFIN access URL (pulled from Infisical as
# SIMPLEFIN_ACCESS_URL — the permanent claimed URL, not the one-time setup token).
#
# Derived from the 2026-08-05 importer-UI export with fixes:
#   - all 25 SimpleFIN accounts mapped to existing Firefly account IDs instead of
#     the exported create-duplicates default; only one new account is created
#   - date_range: rolling 45-day lookback (covers the data gap since the one-time
#     June import; content-hash dedup makes the daily overlap safe)
#   - access URL templated in from Infisical instead of committed
#
# Three mappings are best guesses — verify against transaction descriptions
# after the first import (import runs are tagged, so remap + re-run is cheap):
# the loan mapped to 165, the three cards mapped to 143/145/149, and the
# retirement account mapped to 171.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: firefly-importer-config
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: firefly-importer-config
    template:
      engineVersion: v2
      data:
        config.json: |
          {
            "version": 3,
            "source": "ff3-importer-2.3.2",
            "created_at": "2026-08-05T13:56:03-05:00",
            "date": "",
            "default_account": 180,
            "delimiter": "comma",
            "headers": false,
            "rules": true,
            "webhooks": true,
            "skip_form": true,
            "add_import_tag": true,
            "roles": [],
            "do_mapping": [],
            "mapping": {},
            "duplicate_detection_method": "classic",
            "ignore_duplicate_lines": false,
            "unique_column_index": 0,
            "unique_column_type": "external-id",
            "pseudo_identifier": [],
            "flow": "simplefin",
            "content_type": "csv",
            "camt_type": "",
            "custom_tag": "",
            "identifier": "0",
            "connection": "0",
            "ignore_spectre_categories": false,
            "grouped_transaction_handling": "",
            "use_entire_opposing_address": false,
            "map_all_data": false,
            "pending_transactions": false,
            "access_token": "{{ .SIMPLEFIN_ACCESS_URL }}",
            "accounts": {
              "ACT-e8f0d3e3-9735-4f0c-8a50-90e519290b60": 143,
              "ACT-082469d1-b47a-4e27-a482-a941e843cc10": 145,
              "ACT-c11ba0b6-913b-46e7-873d-74fb9183afdb": 147,
