---
# The blog desk trusts the x-authentik-* headers the gateway adds after forward auth, and
# it can read the vault and push to the public blog. So only the internal gateway's Envoy
# may connect: anything else in the cluster could otherwise send a forged header.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: blog-desk
spec:
  description: Blog desk, only from the internal gateway (authentik forward auth in front).
  endpointSelector:
    matchLabels:
      app.kubernetes.io/controller: blog-desk
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            app.kubernetes.io/name: envoy
            gateway.envoyproxy.io/owning-gateway-name: internal
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Kubelet probes.
    - fromEntities:
        - host
