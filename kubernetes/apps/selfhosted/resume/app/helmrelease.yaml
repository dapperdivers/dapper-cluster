---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app resume
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      resume:
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/dapperdivers/developer-portfolio
              tag: latest@sha256:8b5de617ca2bd7b82a92c5430fe3d3cabf34f4f8b12034e376201512bbd68c7e
            env:
              ALLOWED_DOMAINS: "https://www.${SECRET_DOMAIN_PERSONAL},https://${SECRET_DOMAIN_PERSONAL}"
              # The gateway forwards no visitor address, so the app's limiter
              # would put every visitor in one bucket. Rate limit at the
              # Cloudflare edge instead.
              RATE_LIMIT_MAX: "0"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/comprehensive
                    port: 8080
                  initialDelaySeconds: 30
                  periodSeconds: 60
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/comprehensive
                    port: 8080
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 3
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/comprehensive
                    port: 8080
                  initialDelaySeconds: 45
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 4
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                cpu: 1000m
                memory: 2Gi
    persistence:
      tmp:
        type: emptyDir
        advancedMounts:
          resume:
            app:
              - path: /tmp
                readOnly: false
    service:
      app:
        controller: *app
        ports:
          http:
            port: 8080
    # Gateway API (parallel-run). Apex host attaches to the apex listener too.
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN_PERSONAL}"
          - "www.${SECRET_DOMAIN_PERSONAL}"
          - "${SECRET_DOMAIN_PERSONAL}"
        parentRefs:
          - name: external
            namespace: network
