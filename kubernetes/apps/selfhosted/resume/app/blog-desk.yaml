---
# The private blog desk: lists the blog posts in the vault (Projects/Blog, type: blog-post),
# previews each with the real blog build, and makes it live by pushing the converted article
# to blog-content/articles (blog-builder then publishes it within five minutes).
#
# The only blog component that can read the vault, and it reads it read-only. Reachable only
# through the internal gateway with authentik forward auth (route annotation below), and the
# network policy beside this file lets nothing else connect, so the x-authentik-* headers it
# trusts can't be forged from inside the cluster. DESK_GROUPS narrows it to authentik admins.
# Image: developer-portfolio's blog/Dockerfile, target desk.
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blog-desk
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      blog-desk:
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/dapperdivers/developer-portfolio-blog-desk
              tag: sha-0326949@sha256:f76677b0986d6a0020474cd4011c910c1dbaf7ce9bed723a7df6ffa86ad87a23
            env:
              VAULT_DIR: /vault
              CONTENT_DIR: /content
              DESK_AUTH_HEADER: x-authentik-username
              DESK_GROUPS: authentik Admins
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
              readiness: *probe
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                # Previews run astro build in-process
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
    service:
      app:
        controller: blog-desk
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          authentik.home.arpa/forward-auth: "true"
        hostnames: ["blog-desk.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: network
    persistence:
      # The vault, read-only: the desk reads posts and the images they embed
      vault:
        existingClaim: obsidian-second-brain
        globalMounts:
          - path: /vault
            readOnly: true
      # blog-content: the desk writes articles/ (and its own .desk-staging/)
      content:
        existingClaim: blog-content
        globalMounts:
          - path: /content
      tmp:
        type: emptyDir
        sizeLimit: 2Gi
        globalMounts:
          - path: /tmp
