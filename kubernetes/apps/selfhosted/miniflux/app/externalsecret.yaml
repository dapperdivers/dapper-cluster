---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# Database credentials (infisical-postgres store). The DB and role are created by the
# Kyverno postgres-init automation; this only supplies the app's connection string.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: miniflux-db
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-postgres
  target:
    name: miniflux-db-secret
    template:
      engineVersion: v2
      data:
        DATABASE_URL: postgres://{{ .MINIFLUX_POSTGRES_USER }}:{{ .MINIFLUX_POSTGRES_PASSWORD }}@postgres-rw.database.svc.cluster.local/miniflux?sslmode=disable
  dataFrom:
    - find:
        name:
          regexp: ^MINIFLUX_POSTGRES_(USER|PASSWORD)$
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# App secrets (infisical store): the OIDC client secret (Authentik generates it on the
# first blueprint apply; copy it here) and the password of the local `admin` account.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: miniflux
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: miniflux-secret
    template:
      engineVersion: v2
      data:
        OAUTH2_CLIENT_SECRET: "{{ .MINIFLUX_OIDC_CLIENT_SECRET }}"
        ADMIN_PASSWORD: "{{ .MINIFLUX_ADMIN_PASSWORD }}"
  dataFrom:
    - find:
        name:
          regexp: ^MINIFLUX_(OIDC_CLIENT_SECRET|ADMIN_PASSWORD)$
