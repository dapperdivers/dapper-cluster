---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# Miniflux: RSS reader. State lives entirely in Postgres (CNPG), so no PVC / VolSync.
# Agents and scripts talk to its REST API in-cluster at miniflux.selfhosted:8080.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app miniflux
  annotations:
    # Postgres-init automation: Kyverno generates the init secret and injects the
    # init container that creates the DB/role. Creds come from Infisical.
    postgres-init.home.arpa/enabled: "true"
    postgres-init.home.arpa/user-key: "MINIFLUX_POSTGRES_USER"
    postgres-init.home.arpa/pass-key: "MINIFLUX_POSTGRES_PASSWORD"
    postgres-init.home.arpa/dbname: "miniflux"
    postgres-init.home.arpa/secret-store: "infisical-postgres"
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      miniflux:
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        # init-db container injected automatically by Kyverno postgres-init
        containers:
          app:
            image:
              repository: ghcr.io/miniflux/miniflux
              tag: 2.3.5@sha256:8fd6c3c434ecc3d4083306f83e03c0bb74c632e0f8378da5ead7e1773b0b89c9
            env:
              TZ: ${TIME_ZONE}
              LISTEN_ADDR: 0.0.0.0:8080
              BASE_URL: https://rss.${SECRET_DOMAIN}
              RUN_MIGRATIONS: "1"
              # Local break-glass account; day-to-day login is Authentik OIDC.
              CREATE_ADMIN: "1"
              ADMIN_USERNAME: admin
              # Poll every 30 minutes (default 60); the agents read what's new each morning.
              POLLING_FREQUENCY: "30"
              # Keep read entries for a year instead of the default 60 days, so agents
              # can look back at what a feed said.
              CLEANUP_ARCHIVE_READ_DAYS: "365"
              # Authentik OIDC. The client id is pinned in the blueprint; the secret
              # is generated by Authentik and copied into Infisical.
              OAUTH2_PROVIDER: oidc
              OAUTH2_OIDC_PROVIDER_NAME: Authentik
              OAUTH2_CLIENT_ID: miniflux
              OAUTH2_REDIRECT_URL: https://rss.${SECRET_DOMAIN}/oauth2/oidc/callback
              OAUTH2_OIDC_DISCOVERY_ENDPOINT: https://sso.${SECRET_DOMAIN}/application/o/miniflux/
              OAUTH2_USER_CREATION: "1"
            envFrom:
              - secretRef:
                  name: miniflux-db-secret
              - secretRef:
                  name: miniflux-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthcheck
                    port: &port 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: miniflux
        ports:
          http:
            primary: true
            port: *port
    # Gateway API (TLS terminates at the Gateway). Plain route: Miniflux does its own
    # OIDC, so no forward-auth annotation.
    route:
      app:
        hostnames: ["rss.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: network
