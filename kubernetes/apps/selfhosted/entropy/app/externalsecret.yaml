---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: entropy
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: entropy-secret
    template:
      engineVersion: v2
      data:
        # Reuses the existing Firefly PAT (Firefly doesn't scope tokens anyway).
        # Entropy is read-only by design — it never writes to Firefly.
        FIREFLY_III_TOKEN: "{{ .FIREFLY_III_ACCESS_TOKEN }}"
  dataFrom:
    - find:
        name:
          regexp: ^FIREFLY_III_ACCESS_TOKEN$
