---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: obsidian-vault
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: volsync
      namespace: storage
  values:
    controllers:
      syncthing:
        strategy: Recreate
        containers:
          app:
            image:
              repository: lscr.io/linuxserver/syncthing
              tag: 2.1.7@sha256:c4207d8f5b66d5f67eedb636b75500b5a04898e9f33299d252f4b966c41a4128
            env:
              PUID: "1000"
              PGID: "1000"
              TZ: ${TIME_ZONE}
              STGUIAPIKEY: # pinned so the health check's copy never drifts
                valueFrom:
                  secretKeyRef:
                    name: obsidian-vault-secret
                    key: SYNCTHING_API_KEY
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /rest/noauth/health
                    port: 8384
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probe
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
            securityContext:
              # linuxserver s6 init needs root, then drops to PUID/PGID 1000
              runAsUser: 0
              runAsGroup: 0
        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch

      # Plain-Markdown views of each vault (Vault Snapshot + Vault Catalog) for agents
      # that read raw files and can't run Dataview. Rewrites only on change; writes
      # <file>.tmp then renames (ignored via the vault's .stglobalignore).
      vault-snapshot:
        type: cronjob
        cronjob:
          schedule: "15 * * * *"
          timeZone: &timeZone ${TIME_ZONE}
          concurrencyPolicy: Forbid
          activeDeadlineSeconds: 600
          successfulJobsHistory: 1
          failedJobsHistory: 2
        containers:
          app:
            image: &pythonImage
              repository: python
              tag: 3.15@sha256:46837ed3105db0029b6d656816185c6258e3b39690532fb782428e0a5fd76182
            command: ["/bin/sh", "-c"]
            args:
              - |
                rc=0
                for v in /vaults/*/; do
                  echo "== $v"
                  python3 -I /scripts/vault-snapshot.py "$v" || rc=1
                done
                exit $rc
            env: &jobEnv
              TZ: *timeZone
              PYTHONDONTWRITEBYTECODE: "1"
              OUTPUT_DIR: Resources/Generated
              OLLAMA_URL: http://ollama.ai.svc.cluster.local:11434
              OLLAMA_MODEL: gemma4:e4b
            resources: &jobResources
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext: &jobSecurityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        pod: &jobPod
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault

      # Nightly: backfill missing descriptions with the local model, then the health
      # check (Resources/Generated/Vault Health.md), so it reports what's still missing.
      vault-nightly:
        type: cronjob
        serviceAccount:
          identifier: vault-jobs # reads volsync ReplicationSource status for the backup check
        cronjob:
          schedule: "0 2 * * *"
          timeZone: *timeZone
          concurrencyPolicy: Forbid
          activeDeadlineSeconds: 3600
          successfulJobsHistory: 1
          failedJobsHistory: 2
        containers:
          app:
            image: *pythonImage
            command: ["/bin/sh", "-c"]
            args:
              - |
                rc=0
                for v in /vaults/*/; do
                  echo "== $v describe"
                  python3 -I /scripts/describe.py "$v" || rc=1
                  echo "== $v health"
                  python3 -I /scripts/health.py "$v" || rc=1
                done
                exit $rc
            env:
              <<: *jobEnv
              MAX_NOTES: "40"
              MIN_AGE_HOURS: "6"
              SYNCTHING_URL: http://obsidian-vault-syncthing:8384
              SYNCTHING_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: obsidian-vault-secret
                    key: SYNCTHING_API_KEY
            resources: *jobResources
            securityContext: *jobSecurityContext
        pod:
          <<: *jobPod
          automountServiceAccountToken: true

      # Sunday morning: Journal/<YYYY>/Weekly/<YYYY>-W<ww> Weekly Review.md for the past week.
      vault-weekly-review:
        type: cronjob
        cronjob:
          schedule: "0 7 * * 0"
          timeZone: *timeZone
          concurrencyPolicy: Forbid
          activeDeadlineSeconds: 1800
          successfulJobsHistory: 1
          failedJobsHistory: 2
        containers:
          app:
            image: *pythonImage
            command: ["/bin/sh", "-c"]
            args:
              - |
                rc=0
                for v in /vaults/*/; do
                  echo "== $v"
                  python3 -I /scripts/weekly-review.py "$v" || rc=1
                done
                exit $rc
            env: *jobEnv
            resources: *jobResources
            securityContext: *jobSecurityContext
        pod: *jobPod

      # Voice drop folder: audio saved anywhere under <vault>/Inbox/Voice/ is transcribed
      # (Speaches), summarized (Ollama) into a note, and moved to Attachments/Voice/.
      # 04:30: Night Shift morning brief on the Claude subscription -> Briefings/Morning/<date>.md
      # (sections from Resources/System/Morning Brief Topics.md, plus vault gap suggestions).
      night-shift:
        type: cronjob
        cronjob:
          schedule: "30 4 * * *"
          timeZone: *timeZone
          concurrencyPolicy: Forbid
          activeDeadlineSeconds: 5400
          successfulJobsHistory: 1
          failedJobsHistory: 2
        containers:
          app:
            image: *pythonImage
            command: ["/bin/sh", "-c"]
            args:
              - |
                rc=0
                for v in /vaults/*/; do
                  python3 -I /scripts/night-shift.py "$v" || rc=1
                done
                exit $rc
            env:
              <<: *jobEnv
              CLAUDE_AGENT_URL: http://kagent-controller.kagent.svc.cluster.local:8083/agents/kagent/claude
              GAPS_PER_NIGHT: "3"
              CURATED_PER_NIGHT: "2" # raise once the zettel quality has been reviewed
              BUDGET_MINUTES: "75"
              SYNCTHING_URL: http://obsidian-vault-syncthing:8384
              SYNCTHING_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: obsidian-vault-secret
                    key: SYNCTHING_API_KEY
            resources: *jobResources
            securityContext: *jobSecurityContext
        pod: *jobPod

      voice-inbox:
        type: cronjob
        cronjob:
          schedule: "*/15 * * * *"
          timeZone: *timeZone
          concurrencyPolicy: Forbid
          activeDeadlineSeconds: 3000
          successfulJobsHistory: 1
          failedJobsHistory: 2
        containers:
          app:
            image: *pythonImage
            command: ["/bin/sh", "-c"]
            args:
              - |
                rc=0
                for v in /vaults/*/; do
                  python3 -I /scripts/voice-inbox.py "$v" || rc=1
                done
                exit $rc
            env:
              <<: *jobEnv
              STT_URL: http://speaches.ai.svc.cluster.local:8000
              STT_MODEL: deepdml/faster-whisper-large-v3-turbo-ct2
              # kagent agent that suggests filing, related notes and zettels (Zettels/).
              # Unset to turn the librarian step off.
              LIBRARIAN_URL: http://kagent-controller.kagent.svc.cluster.local:8083/agents/kagent/voice-librarian
              BACKFILL_PER_RUN: "2"
              # Rescan right after writing: the hub's watcher misses these pods' writes.
              SYNCTHING_URL: http://obsidian-vault-syncthing:8384
              SYNCTHING_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: obsidian-vault-secret
                    key: SYNCTHING_API_KEY
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 512Mi # whole recording is read into memory for the upload
            securityContext: *jobSecurityContext
        pod: *jobPod

    service:
      syncthing:
        controller: syncthing
        ports:
          http:
            port: 8384
      syncthing-lb:
        controller: syncthing
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: ${OBSIDIAN_VAULT_VIP_GATEWAY}
        ports:
          sync:
            port: 22000
            protocol: TCP

    route:
      syncthing:
        hostnames: ["vault-sync.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: syncthing
                port: http

    persistence:
      config:
        existingClaim: obsidian-vault
        advancedMounts:
          syncthing:
            app:
              - path: /config
      # One entry per vault (PVC created by its own Flux Kustomization in ../ks.yaml)
      second-brain:
        existingClaim: obsidian-second-brain
        advancedMounts:
          syncthing:
            app:
              - path: /data/second-brain
          vault-snapshot: &vaultMount
            app:
              - path: /vaults/second-brain
          vault-nightly: *vaultMount
          vault-weekly-review: *vaultMount
          voice-inbox: *vaultMount
          night-shift: *vaultMount
      scripts:
        type: configMap
        name: vault-scripts
        advancedMounts:
          vault-snapshot: &scriptsMount
            app:
              - path: /scripts
                readOnly: true
          vault-nightly: *scriptsMount
          vault-weekly-review: *scriptsMount
          voice-inbox: *scriptsMount
          night-shift: *scriptsMount
      tmp:
        type: emptyDir
        advancedMounts:
          vault-snapshot: &tmpMount
            app:
              - path: /tmp
          vault-nightly: *tmpMount
          vault-weekly-review: *tmpMount
          voice-inbox: *tmpMount
          night-shift: *tmpMount

    serviceAccount:
      vault-jobs: {}

    rbac:
      roles:
        vault-jobs:
          type: Role
          rules:
            - apiGroups: ["volsync.backube"]
              resources: ["replicationsources"]
              verbs: ["get", "list"]
      bindings:
        vault-jobs:
          type: RoleBinding
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            identifier: vault-jobs
          subjects:
            - kind: ServiceAccount
              identifier: vault-jobs
