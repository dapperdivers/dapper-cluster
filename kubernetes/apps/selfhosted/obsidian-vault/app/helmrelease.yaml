---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: obsidian-vault
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: volsync
      namespace: storage
  values:
    controllers:
      syncthing:
        strategy: Recreate
        containers:
          app:
            image:
              repository: lscr.io/linuxserver/syncthing
              tag: 2.1.7@sha256:c4207d8f5b66d5f67eedb636b75500b5a04898e9f33299d252f4b966c41a4128
            env:
              PUID: "1000"
              PGID: "1000"
              TZ: ${TIME_ZONE}
              STGUIAPIKEY: # pinned so the health check's copy never drifts
                valueFrom:
                  secretKeyRef:
                    name: obsidian-vault-secret
                    key: SYNCTHING_API_KEY
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /rest/noauth/health
                    port: 8384
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probe
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
            securityContext:
              # linuxserver s6 init needs root, then drops to PUID/PGID 1000
              runAsUser: 0
              runAsGroup: 0
        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch

      # Plain-Markdown views of each vault (Vault Snapshot + Vault Catalog) for agents
      # that read raw files and can't run Dataview. Rewrites only on change; writes
      # <file>.tmp then renames (ignored via the vault's .stglobalignore).
      vault-snapshot:
        type: cronjob
        cronjob:
          schedule: "15 * * * *"
          timeZone: &timeZone ${TIME_ZONE}
          concurrencyPolicy: Forbid
          activeDeadlineSeconds: 600
          successfulJobsHistory: 1
          failedJobsHistory: 2
        containers:
          app:
            image: &pythonImage
              repository: python
              tag: 3.15@sha256:46837ed3105db0029b6d656816185c6258e3b39690532fb782428e0a5fd76182
            command: ["/bin/sh", "-c"]
            args:
              - |
                rc=0
                for v in /vaults/*/; do
                  echo "== $v"
                  python3 -I /scripts/vault-snapshot.py "$v" || rc=1
                done
                exit $rc
            env: &jobEnv
              TZ: *timeZone
              PYTHONDONTWRITEBYTECODE: "1"
              OUTPUT_DIR: Agents/Generated
              OLLAMA_URL: http://ollama.ai.svc.cluster.local:11434
              OLLAMA_MODEL: gemma4:e4b
            resources: &jobResources
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext: &jobSecurityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        pod: &jobPod
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault

      # Nightly: backfill missing descriptions with the local model, then the health
      # check (Agents/Generated/Vault Health.md), so it reports what's still missing.
      vault-nightly:
        type: cronjob
        serviceAccount:
          identifier: vault-jobs # reads volsync ReplicationSource status for the backup check
        cronjob:
          schedule: "0 2 * * *"
          timeZone: *timeZone
          concurrencyPolicy: Forbid
          activeDeadlineSeconds: 3600
          successfulJobsHistory: 1
          failedJobsHistory: 2
        containers:
          app:
            image: *pythonImage
            command: ["/bin/sh", "-c"]
            args:
              - |
                rc=0
                for v in /vaults/*/; do
                  echo "== $v describe"
                  python3 -I /scripts/describe.py "$v" || rc=1
                  echo "== $v health"
                  python3 -I /scripts/health.py "$v" || rc=1
                done
                exit $rc
            env:
              <<: *jobEnv
              MAX_NOTES: "40"
              MIN_AGE_HOURS: "6"
              SYNCTHING_URL: http://obsidian-vault-syncthing:8384
              SYNCTHING_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: obsidian-vault-secret
                    key: SYNCTHING_API_KEY
            resources: *jobResources
            securityContext: *jobSecurityContext
        pod:
          <<: *jobPod
          automountServiceAccountToken: true

      # Sunday morning: Journal/<YYYY>/Weekly/<YYYY>-W<ww> Weekly Review.md for the past week.
      vault-weekly-review:
        type: cronjob
        cronjob:
          schedule: "0 7 * * 0"
          timeZone: *timeZone
          concurrencyPolicy: Forbid
          activeDeadlineSeconds: 1800
          successfulJobsHistory: 1
          failedJobsHistory: 2
        containers:
          app:
            image: *pythonImage
            command: ["/bin/sh", "-c"]
            args:
              - |
                rc=0
                for v in /vaults/*/; do
                  echo "== $v"
                  python3 -I /scripts/weekly-review.py "$v" || rc=1
                done
                exit $rc
            env: *jobEnv
            resources: *jobResources
            securityContext: *jobSecurityContext
        pod: *jobPod

      # Voice drop folder: audio saved anywhere under <vault>/Inbox/Voice/ is transcribed
      # (Speaches), summarized (Ollama) into a note, and moved to Attachments/Voice/.
      # 04:30: Night Shift morning brief on the Claude subscription -> Agents/Briefings/Morning/<date>.md
      # (Security and Feeds sections from the security-brief and feeds-digest agents, sections
      # from System/Morning Brief Topics.md, plus vault gap suggestions).
      night-shift:
        type: cronjob
        cronjob:
          schedule: "30 4 * * *"
          timeZone: *timeZone
          concurrencyPolicy: Forbid
          activeDeadlineSeconds: 5400
          successfulJobsHistory: 1
          failedJobsHistory: 2
        containers:
          app:
            image: *pythonImage
            command: ["/bin/sh", "-c"]
            args:
              - |
                rc=0
                for v in /vaults/*/; do
                  python3 -I /scripts/night-shift.py "$v" || rc=1
                done
                exit $rc
            env:
              <<: *jobEnv
              CLAUDE_AGENT_URL: http://kagent-controller.kagent.svc.cluster.local:8083/agents/kagent/night-editor
              # Optional sections: without its URL a section is skipped.
              SECURITY_AGENT_URL: http://kagent-controller.kagent.svc.cluster.local:8083/agents/kagent/security-brief
              FEEDS_AGENT_URL: http://kagent-controller.kagent.svc.cluster.local:8083/agents/kagent/feeds-digest
              GAPS_PER_NIGHT: "3"
              CURATED_PER_NIGHT: "2" # raise once the zettel quality has been reviewed
              BUDGET_MINUTES: "75"
              SYNCTHING_URL: http://obsidian-vault-syncthing:8384
              SYNCTHING_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: obsidian-vault-secret
                    key: SYNCTHING_API_KEY
            resources: *jobResources
            securityContext: *jobSecurityContext
        pod: *jobPod

      # 03:00: Night Watch cluster triage -> Agents/NightWatch/<date>.md (read-only cluster access;
      # new findings triaged by the kagent nightwatch agent on local Ollama). Runs before
      # night-shift (04:30), which links this report; activeDeadlineSeconds keeps it done by 04:00.
      nightwatch:
        type: cronjob
        serviceAccount:
          name: obsidian-vault-nightwatch # rbac.yaml: read-only, cluster-wide, no Secrets
        cronjob:
          schedule: "0 3 * * *"
          timeZone: *timeZone
          concurrencyPolicy: Forbid
          activeDeadlineSeconds: 3600
          successfulJobsHistory: 1
          failedJobsHistory: 2
        containers:
          app:
            image: *pythonImage
            command: ["/bin/sh", "-c"]
            args:
              - |
                rc=0
                for v in /vaults/*/; do
                  python3 -I /scripts/nightwatch.py "$v" || rc=1
                done
                exit $rc
            env:
              <<: *jobEnv
              NIGHTWATCH_AGENT_URL: http://kagent-controller.kagent.svc.cluster.local:8083/agents/kagent/nightwatch
              ALERTMANAGER_URL: http://kube-prometheus-stack-alertmanager.observability.svc.cluster.local:9093
              MAX_TRIAGE: "5"
              SYNCTHING_URL: http://obsidian-vault-syncthing:8384
              SYNCTHING_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: obsidian-vault-secret
                    key: SYNCTHING_API_KEY
            resources: *jobResources
            securityContext: *jobSecurityContext
        pod:
          <<: *jobPod
          automountServiceAccountToken: true

      voice-inbox:
        type: cronjob
        cronjob:
          schedule: "*/15 * * * *"
          timeZone: *timeZone
          concurrencyPolicy: Forbid
          activeDeadlineSeconds: 3000
          successfulJobsHistory: 1
          failedJobsHistory: 2
        containers:
          app:
            image: *pythonImage
            command: ["/bin/sh", "-c"]
            args:
              - |
                rc=0
                for v in /vaults/*/; do
                  python3 -I /scripts/voice-inbox.py "$v" || rc=1
                done
                exit $rc
            env:
              <<: *jobEnv
              STT_URL: http://speaches.ai.svc.cluster.local:8000
              STT_MODEL: deepdml/faster-whisper-large-v3-turbo-ct2
              # kagent `voice-processor` agent (Claude subscription) that processes each memo in one call:
              # summary, tasks with due dates, facts filed per folder, zettels. Unset to process
              # with the local model and the librarian only; they stay as the fallback.
              PROCESSOR_URL: http://kagent-controller.kagent.svc.cluster.local:8083/agents/kagent/voice-processor
              # Fallback: local kagent agent that suggests filing, related notes and zettels.
              LIBRARIAN_URL: http://kagent-controller.kagent.svc.cluster.local:8083/agents/kagent/voice-librarian
              BACKFILL_PER_RUN: "2"
              # Rescan right after writing: the hub's watcher misses these pods' writes.
              SYNCTHING_URL: &syncthingUrl http://obsidian-vault-syncthing:8384
              SYNCTHING_API_KEY: &syncthingKey
                valueFrom:
                  secretKeyRef:
                    name: obsidian-vault-secret
                    key: SYNCTHING_API_KEY
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 512Mi # whole recording is read into memory for the upload
            securityContext: *jobSecurityContext
        pod: *jobPod

      # Reading inbox: articles starred in Miniflux become notes under <vault>/Inbox/Reading/
      # (link, feed and article text). Reads Miniflux with GET requests only; a ledger beside
      # the notes stops a filed or deleted note being written again. Its own job, so a
      # failure here never holds up the voice pipeline.
      reading-inbox:
        type: cronjob
        cronjob:
          schedule: "*/15 * * * *"
          timeZone: *timeZone
          concurrencyPolicy: Forbid
          activeDeadlineSeconds: 600
          successfulJobsHistory: 1
          failedJobsHistory: 2
        containers:
          app:
            image: *pythonImage
            command: ["/bin/sh", "-c"]
            args:
              - |
                rc=0
                for v in /vaults/*/; do
                  python3 -I /scripts/reading-inbox.py "$v" || rc=1
                done
                exit $rc
            env:
              <<: *jobEnv
              MINIFLUX_URL: http://miniflux.selfhosted.svc.cluster.local:8080
              # The chart's schema rejects `optional` on a secretKeyRef: the secret must exist.
              MINIFLUX_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: obsidian-vault-miniflux-secret
                    key: MINIFLUX_API_KEY
              SYNCTHING_URL: *syncthingUrl
              SYNCTHING_API_KEY: *syncthingKey
            resources: *jobResources
            securityContext: *jobSecurityContext
        pod: *jobPod

      # Feed sorter: scores new entries in the Miniflux "Security firehose" category with the
      # local embedding model and marks the low half as read, so what stays unread is worth a
      # look. What counts as interesting (and a watchlist of names) lives in the vault note
      # System/Feed Interests.md, never in this public repo; without that note the job writes
      # a starter and does nothing else. It only ever marks entries read.
      feed-sorter:
        type: cronjob
        cronjob:
          schedule: "10,40 * * * *"
          timeZone: *timeZone
          concurrencyPolicy: Forbid
          activeDeadlineSeconds: 1500
          successfulJobsHistory: 1
          failedJobsHistory: 2
        containers:
          app:
            image: *pythonImage
            command: ["/bin/sh", "-c"]
            args:
              - |
                rc=0
                for v in /vaults/*/; do
                  python3 -I /scripts/feed-sorter.py "$v" || rc=1
                done
                exit $rc
            env:
              <<: *jobEnv
              EMBED_MODEL: embeddinggemma
              SORT_CATEGORY: Security firehose
              # Entries scoring below this percentile of a 30-day sample are marked read.
              READ_BELOW_PCT: "50"
              MINIFLUX_URL: http://miniflux.selfhosted.svc.cluster.local:8080
              MINIFLUX_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: obsidian-vault-miniflux-secret
                    key: MINIFLUX_API_KEY
              SYNCTHING_URL: *syncthingUrl
              SYNCTHING_API_KEY: *syncthingKey
            resources: *jobResources
            securityContext: *jobSecurityContext
        pod: *jobPod

      # Hourly: each new article note under Inbox/Reading gets a "Digest" section from the
      # kagent `reading-processor` agent (Claude subscription): summary, why it matters,
      # related notes, a filing folder and ideas worth keeping. The script validates the
      # answer and never edits a note touched in the last few minutes. At most five
      # articles a run; on a usage limit it stops and picks up next hour.
      reading-process:
        type: cronjob
        cronjob:
          schedule: "40 * * * *"
          timeZone: *timeZone
          concurrencyPolicy: Forbid
          activeDeadlineSeconds: 3300
          successfulJobsHistory: 1
          failedJobsHistory: 2
        containers:
          app:
            image: *pythonImage
            command: ["/bin/sh", "-c"]
            args:
              - |
                rc=0
                for v in /vaults/*/; do
                  python3 -I /scripts/reading-process.py "$v" || rc=1
                done
                exit $rc
            env:
              <<: *jobEnv
              READING_AGENT_URL: http://kagent-controller.kagent.svc.cluster.local:8083/agents/kagent/reading-processor
              SYNCTHING_URL: *syncthingUrl
              SYNCTHING_API_KEY: *syncthingKey
            resources: *jobResources
            securityContext: *jobSecurityContext
        pod: *jobPod

    service:
      syncthing:
        controller: syncthing
        ports:
          http:
            port: 8384
      syncthing-lb:
        controller: syncthing
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: ${OBSIDIAN_VAULT_VIP_GATEWAY}
        ports:
          sync:
            port: 22000
            protocol: TCP

    route:
      syncthing:
        hostnames: ["vault-sync.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: syncthing
                port: http

    persistence:
      config:
        existingClaim: obsidian-vault
        advancedMounts:
          syncthing:
            app:
              - path: /config
      # One entry per vault (PVC created by its own Flux Kustomization in ../ks.yaml)
      second-brain:
        existingClaim: obsidian-second-brain
        advancedMounts:
          syncthing:
            app:
              - path: /data/second-brain
          vault-snapshot: &vaultMount
            app:
              - path: /vaults/second-brain
          vault-nightly: *vaultMount
          vault-weekly-review: *vaultMount
          voice-inbox: *vaultMount
          reading-inbox: *vaultMount
          reading-process: *vaultMount
          feed-sorter: *vaultMount
          night-shift: *vaultMount
          nightwatch: *vaultMount
      scripts:
        type: configMap
        name: vault-scripts
        advancedMounts:
          vault-snapshot: &scriptsMount
            app:
              - path: /scripts
                readOnly: true
          vault-nightly: *scriptsMount
          vault-weekly-review: *scriptsMount
          voice-inbox: *scriptsMount
          reading-inbox: *scriptsMount
          reading-process: *scriptsMount
          feed-sorter: *scriptsMount
          night-shift: *scriptsMount
          nightwatch: *scriptsMount
      tmp:
        type: emptyDir
        advancedMounts:
          vault-snapshot: &tmpMount
            app:
              - path: /tmp
          vault-nightly: *tmpMount
          vault-weekly-review: *tmpMount
          voice-inbox: *tmpMount
          reading-inbox: *tmpMount
          reading-process: *tmpMount
          feed-sorter: *tmpMount
          night-shift: *tmpMount
          nightwatch: *tmpMount

    serviceAccount:
      vault-jobs: {}

    rbac:
      roles:
        vault-jobs:
          type: Role
          rules:
            - apiGroups: ["volsync.backube"]
              resources: ["replicationsources"]
              verbs: ["get", "list"]
      bindings:
        vault-jobs:
          type: RoleBinding
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            identifier: vault-jobs
          subjects:
            - kind: ServiceAccount
              identifier: vault-jobs
