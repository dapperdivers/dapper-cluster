---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: obsidian-vault
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: volsync
      namespace: storage
  values:
    controllers:
      syncthing:
        # The only controller left in this release (the jobs are in ../jobs); without this the
        # chart would rename the Deployment to plain `obsidian-vault`.
        forceRename: obsidian-vault-syncthing
        strategy: Recreate
        containers:
          app:
            image:
              repository: lscr.io/linuxserver/syncthing
              tag: 2.1.7@sha256:91e5a75d719b4f9919fc5332c7350d1477cf07bd62143506cec88694e94fbbc9
            env:
              PUID: "1000"
              PGID: "1000"
              TZ: ${TIME_ZONE}
              STGUIAPIKEY: # pinned so the health check's copy never drifts
                valueFrom:
                  secretKeyRef:
                    name: obsidian-vault-secret
                    key: SYNCTHING_API_KEY
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /rest/noauth/health
                    port: 8384
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probe
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
            securityContext:
              # linuxserver s6 init needs root, then drops to PUID/PGID 1000
              runAsUser: 0
              runAsGroup: 0
        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch

    service:
      syncthing:
        controller: syncthing
        ports:
          http:
            port: 8384
      syncthing-lb:
        controller: syncthing
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: ${OBSIDIAN_VAULT_VIP_GATEWAY}
        ports:
          sync:
            port: 22000
            protocol: TCP

    route:
      syncthing:
        hostnames: ["vault-sync.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: syncthing
                port: http

    persistence:
      config:
        existingClaim: obsidian-vault
        advancedMounts:
          syncthing:
            app:
              - path: /config
      # One entry per vault (PVC created by its own Flux Kustomization in ../ks.yaml)
      second-brain:
        existingClaim: obsidian-second-brain
        advancedMounts:
          syncthing:
            app:
              - path: /data/second-brain
