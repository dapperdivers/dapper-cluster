---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1beta1.json
# The owner's Miniflux API key, for the vault jobs that talk to the feed reader:
# reading-inbox (lists starred articles), feed-sorter (marks low-scoring entries read)
# and miniflux-export (nightly copy of the configuration). Same Infisical key the
# kagent/miniflux-mcp server uses.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: obsidian-vault-miniflux
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: obsidian-vault-miniflux-secret
    creationPolicy: Owner
  dataFrom:
    - find:
        name:
          regexp: ^MINIFLUX_API_KEY$
