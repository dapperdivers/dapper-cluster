---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./secret.sops.yaml
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./rbac.yaml
configMapGenerator:
  - name: vault-scripts
    files:
      - ./resources/vaultlib.py
      - ./resources/vault-snapshot.py
      - ./resources/describe.py
      - ./resources/health.py
      - ./resources/weekly-review.py
      - ./resources/voice-inbox.py
      - ./resources/librarian.py
      - ./resources/processor.py
      - ./resources/reading-inbox.py
      - ./resources/night-shift.py
      - ./resources/nightwatch.py
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
