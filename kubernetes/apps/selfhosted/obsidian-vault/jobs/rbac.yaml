---
# Night Watch reads cluster state for its nightly checks (nightwatch.py in the vault-jobs image).
# Read-only and cluster-wide; no Secrets. Declared here rather than in the
# HelmRelease so app-template keeps assigning its one service account to the
# other job controllers.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: obsidian-vault-nightwatch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: obsidian-vault-nightwatch
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list"]
  - apiGroups: ["volsync.backube"]
    resources: ["replicationsources"]
    verbs: ["get", "list"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list"]
  - apiGroups: ["api.kagent.dev"]
    resources: ["agents"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: obsidian-vault-nightwatch
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: obsidian-vault-nightwatch
subjects:
  - kind: ServiceAccount
    name: obsidian-vault-nightwatch
    namespace: selfhosted
