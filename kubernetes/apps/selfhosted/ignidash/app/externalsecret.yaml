---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ignidash
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: ignidash-secret
    template:
      engineVersion: v2
      data:
        # Convex identity: the admin key is deterministically derived from
        # INSTANCE_NAME + INSTANCE_SECRET (generate_admin_key.sh), so pinning
        # these here keeps backend, dashboard login, and the deploy Job in sync.
        INSTANCE_NAME: "ignidash"
        INSTANCE_SECRET: "{{ .IGNIDASH_INSTANCE_SECRET }}"
        BETTER_AUTH_SECRET: "{{ .IGNIDASH_BETTER_AUTH_SECRET }}"
        CONVEX_API_SECRET: "{{ .IGNIDASH_CONVEX_API_SECRET }}"
  dataFrom:
    - find:
        name:
          regexp: ^IGNIDASH_.*
