---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kromgo
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: kromgo
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    replicaCount: 2
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    # Endpoints are served at /badges/<id>; the README pulls them through
    # shields.io with ?format=shields so logos/styles stay on the shields side.
    config:
      prometheus: http://prometheus-operated.observability.svc.cluster.local:9090
      badges:
        - title: Talos
          id: talos_version
          query: label_replace(node_os_info{name="Talos"}, "version_id", "$1", "version_id", "v(.+)")
          valueExpr: labels[?"version_id"].orValue("unknown")
          colorExpr: '"blue"'

        - title: Kubernetes
          id: kubernetes_version
          query: label_replace(kubernetes_build_info{service="kubernetes"}, "git_version", "$1", "git_version", "v(.+)")
          valueExpr: labels[?"git_version"].orValue("unknown")
          colorExpr: '"blue"'

        - title: Flux
          id: flux_version
          query: label_replace(flux_instance_info, "revision", "$1", "revision", "v(.+)@sha256:.+")
          valueExpr: labels[?"revision"].orValue("unknown")
          colorExpr: '"blue"'

        - title: Nodes
          id: cluster_node_count
          query: count(count by (node) (kube_node_status_condition{condition="Ready"}))
          valueExpr: humanizeCommas(result)
          colorExpr: '"green"'

        - title: Pods
          id: cluster_pod_count
          query: sum(kube_pod_status_phase{phase="Running"})
          valueExpr: humanizeCommas(result)
          colorExpr: '"green"'

        - title: CPU
          id: cluster_cpu_usage
          query: round(avg(instance:node_cpu_utilisation:rate5m{kubernetes_node!=""}) * 100, 0.1)
          valueExpr: humanizeFloat(result) + "%"
          colorExpr: 'colorScale(result, [35.0, 75.0], ["green", "orange", "red"])'

        - title: Memory
          id: cluster_memory_usage
          query: round(sum(node_memory_MemTotal_bytes{kubernetes_node!=""} - node_memory_MemAvailable_bytes{kubernetes_node!=""}) / sum(node_memory_MemTotal_bytes{kubernetes_node!=""}) * 100, 0.1)
          valueExpr: humanizeFloat(result) + "%"
          colorExpr: 'colorScale(result, [35.0, 75.0], ["green", "orange", "red"])'

        # UPSes moved from SNMP to NUT, which has no watts var. Estimate the garage
        # rack draw from NUT load% x the 2200 VA rating of the two Smart-UPS 2200 RM
        # (VA ~= W for the server PSUs). Needs the per-UPS `ups` label from nut-exporter.
        - title: Power
          id: cluster_power_usage
          query: round(sum(network_ups_tools_ups_load{ups=~"garage-.*"}) / 100 * 2200, 1)
          valueExpr: humanizeCommas(math.round(result)) + "w"
          colorExpr: 'colorScale(result, [2500.0, 3500.0], ["green", "orange", "red"])'

        - title: Age
          id: cluster_age_days
          query: round(time() - min(kube_node_created))
          valueExpr: humanizeDurationDays(result)
          colorExpr: 'colorScale(result, [15552000.0, 31104000.0], ["green", "orange", "red"])'

        - title: Uptime
          id: cluster_uptime_days
          query: round(avg(node_time_seconds{kubernetes_node!=""} - node_boot_time_seconds{kubernetes_node!=""}))
          valueExpr: humanizeDurationDays(result)
          colorExpr: 'colorScale(result, [15552000.0, 31104000.0], ["green", "orange", "red"])'

        - title: Alerts
          id: cluster_alert_count
          query: alertmanager_alerts{state="active"} - 1 # Ignore Watchdog
          valueExpr: humanizeCommas(result)
          colorExpr: 'colorScale(result, [1.0], ["green", "red"])'

        # 0 when every node is Ready; >0 counts NotReady nodes
        - title: Cluster
          id: cluster_status
          query: count(kube_node_status_condition{condition="Ready",status="true"} == 0) or vector(0)
          valueExpr: 'result == 0.0 ? "up" : "degraded"'
          colorExpr: 'result == 0.0 ? "green" : "red"'

        # count of healthy Gatus endpoints (0/1 success gauge)
        - title: Services
          id: services_up
          query: sum(gatus_results_endpoint_success)
          valueExpr: humanizeCommas(result) + " up"
          colorExpr: 'result >= 1.0 ? "green" : "red"'
    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/endpoint: |-
          path: /badges/talos_version
      hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
      parentRefs:
        - name: external
          namespace: network
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 64Mi
