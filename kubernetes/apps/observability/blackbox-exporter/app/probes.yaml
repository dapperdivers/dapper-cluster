# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/probe_v1.json
---
kind: Probe
apiVersion: monitoring.coreos.com/v1
metadata:
  name: devices
spec:
  module: icmp
  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - proxmox-01.manor
        - proxmox-02.manor
        - proxmox-03.manor
        - proxmox-04.manor
        - firewall.manor
        # zigbee-controller.manor (house coordinator, 192.168.1.5) removed 2026-11-06: it
        # stayed at Valley Trail and is unreachable from Clayton. zigbee-controller-garage.manor
        # (192.168.1.9) removed 2026-06-26 and still unplugged (Brocade 1/1/47). Re-add the
        # one you plug in here AND as a target of the zigbee-controller ScrapeConfig
        # (deleted from kube-prometheus-stack/app the same day; see git history).
---
kind: Probe
apiVersion: monitoring.coreos.com/v1
metadata:
  name: services-tcp
spec:
  module: tcp_connect
  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - nut-upsd.kube-system.svc.cluster.local:3493
