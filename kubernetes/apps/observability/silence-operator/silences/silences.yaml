# Alertmanager silences kept in git (silence-operator `Silence` resources).
# Each one needs a comment saying why it exists, and should be temporary: a
# silence that has been here for months means the alert should be rewritten or
# deleted instead.
#
# None at the moment. Example:
#
# apiVersion: observability.giantswarm.io/v1alpha2
# kind: Silence
# metadata:
#   name: example
# spec:
#   matchers:
#     - name: alertname
#       value: SomeAlert
