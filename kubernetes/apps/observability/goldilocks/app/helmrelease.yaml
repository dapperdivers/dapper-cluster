---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app goldilocks
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: goldilocks
  driftDetection:
    mode: enabled
  # The bundled VPA subchart ships its CRDs in crds/; VPA chart >= 5 (VPA 1.7)
  # requires the updated CRDs before upgrading, which Helm skips by default.
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controller:
      resources:
        requests:
          memory: 256M
        limits:
          memory: 256M
    image:
      repository: us-docker.pkg.dev/fairwinds-ops/oss/goldilocks
      tag: v4.16.5@sha256:87bda72af34f87feae3a3c5893c17f486c7609576dd463f0f5034b7516374fc2
      pullPolicy: Always
    vpa:
      enabled: true
      recommender:
        # Advisory-only (all VPAs are updateMode: Off) — no need for minute-fresh
        # recommendations. An hourly loop alone cuts status + checkpoint writes to
        # ~0.1/s (171 objects/hour), so default checkpoint storage is fine; the
        # Prometheus history backend was dropped (its queries assume the old
        # cadvisor label schema and error against kube-prometheus-stack).
        extraArgs:
          recommender-interval: 1h
    dashboard:
      enabled: true
      resources:
        requests:
          memory: 105M
        limits:
          memory: 105M
