---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frigate
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: emqx
      namespace: database
    - name: volsync
      namespace: storage
  values:
    defaultPodOptions:
      # Frigate's s6-overlay init needs to start as root; it drops privileges
      # for the worker processes itself.
      securityContext:
        seccompProfile: { type: RuntimeDefault }

    controllers:
      frigate:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/blakeblackshear/frigate
              tag: 0.17.2@sha256:d4351369984d4a9e2a49ac59736f6490856a7ea11f7790040746d21496967010
            env:
              TZ: ${TIME_ZONE}
              FRIGATE_CAM_USER: admin
            envFrom:
              - secretRef:
                  name: frigate-secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/version
                    port: 5000
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness: *probe
            resources:
              requests:
                cpu: 1500m
                memory: 3Gi
              limits:
                # /tmp/cache and /dev/shm are memory-backed and count against
                # this limit — see the emptyDir sizeLimits below.
                memory: 8Gi

    service:
      app:
        controller: frigate
        ports:
          http:
            primary: true
            port: 8971
          # Unauthenticated API — cluster-internal only, never routed. This is
          # what the Home Assistant Frigate integration talks to.
          internal:
            port: 5000
          rtsp:
            port: 8554
          go2rtc:
            port: 1984

    route:
      app:
        annotations:
          authentik.home.arpa/forward-auth: "true"
        hostnames: ["frigate.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: http

    persistence:
      # Event database + model cache. VolSync-backed (see ks.yaml).
      config:
        existingClaim: frigate-config
        globalMounts:
          - path: /config
      # Mounted over the top of the config volume so the config itself stays
      # declarative in git.
      config-file:
        type: configMap
        name: frigate-config-file
        globalMounts:
          - path: /config/config.yml
            subPath: config.yml
            readOnly: true
      # Recordings and snapshots. Deliberately not backed up.
      media:
        existingClaim: frigate-media
        globalMounts:
          - path: /media/frigate
      # Recording segments are staged here before being muxed to /media.
      cache:
        type: emptyDir
        medium: Memory
        sizeLimit: 2Gi
        globalMounts:
          - path: /tmp/cache
      # Frame buffers shared between the decode and detect processes.
      dshm:
        type: emptyDir
        medium: Memory
        sizeLimit: 256Mi
        globalMounts:
          - path: /dev/shm
