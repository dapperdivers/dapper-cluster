---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app frigate
  namespace: &namespace home-automation
spec:
  targetNamespace: *namespace
  components:
    - ../../../../flux/components/volsync/repository
    - ../../../../flux/components/volsync/operations
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: emqx-cluster
      namespace: database
    - name: volsync
      namespace: storage
    - name: external-secrets-stores
      namespace: external-secrets
  path: ./kubernetes/apps/home-automation/frigate/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  # Matches the HelmRelease timeout: first boot includes the ~9Gi image pull and
  # the one-off ~15 minute model export before anything reports healthy.
  timeout: 30m
  postBuild:
    substitute:
      # VolSync protects the config volume only (frigate.db event metadata +
      # model cache). Recordings live on a separate cephfs PVC and are far too
      # large to back up — they are expendable by design.
      APP: frigate-config
      VOLSYNC_CAPACITY: 20Gi
