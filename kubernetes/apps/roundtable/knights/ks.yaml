# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app roundtable-knights
  namespace: &namespace roundtable
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: roundtable-infrastructure
      namespace: roundtable
    - name: roundtable-operator
      namespace: roundtable
    - name: external-secrets-stores
      namespace: external-secrets
  path: ./kubernetes/apps/roundtable/knights/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  # Knights take a while to become Ready (image pull, arsenal sync); don't block on it.
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
