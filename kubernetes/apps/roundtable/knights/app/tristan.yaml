# Sir Tristan: infrastructure persona on the personal table (claude-knight), read-only
# cluster access through ServiceAccount tristan. Restored 2026-11-25 (roundtable-k8s/roundtable#378, phase 1).
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/ai.roundtable.io/knight_v1alpha1.json
---
apiVersion: ai.roundtable.io/v1alpha1
kind: Knight
metadata:
  name: tristan
  namespace: roundtable
  labels:
    ai.roundtable.io/round-table: personal
    # legacy label: shared-workspace mount and the mission planner still read only this one
    ai.roundtable.io/table: personal
spec:
  image: ghcr.io/roundtable-k8s/claude-knight:b20bd5f3fd7f686788c63db9cd0570e79e2fd462
  domain: infra
  serviceAccountName: tristan
  # Claude plan (claude-knight, Claude Code CLI), like galahad. Decision 22, 2026-11-25.
  model: sonnet
  skills:
    - shared
    - infra
  tools:
    nix:
      - kubectl
      - kubectx # Fast context/namespace switching (Added 2026-04-06)
      - kubernetes-helm
      - stern
      - k9s
      - fluxcd
      - nmap
      - talosctl
      - cilium-cli
      - yq-go
      # Container & Cluster Analysis (Added 2026-03-23)
      - trivy # Vulnerability scanning for container images and IaC
      - popeye # Kubernetes cluster sanity checks
      - crane # Container image inspection and manipulation
      # Added 2026-03-09 - Fleet self-improvement assessment
      - procps # ps, top, free, vmstat - CRITICAL for process visibility
      - bind # dig, host, nslookup - CRITICAL for DNS debugging
      - iputils # ping - CRITICAL for network connectivity testing
      - traceroute # Network path debugging
      - htop # Interactive process monitor
      - iftop # Network bandwidth monitor
      - netcat-gnu # Network testing (nc)
      - go # Go compiler for operator development
      - gnumake # make for CRD generation
      - gh # GitHub CLI for PR creation
      - jq # JSON processing
      - tree
      - curl
      - python3 # runs the vault-jobs scripts (standard library only)
  # Isolated by default (whiteboard decision 8): gVisor plus default-deny egress.
  # The operator adds NATS, DNS, the Kubernetes API, the model provider and the
  # arsenal git host; tristan reads the cluster through the API and needs
  # nothing else yet. talosctl and the network tools cannot reach nodes under
  # this policy; add destinations here when a job needs them.
  runtimeClassName: gvisor
  egress:
    allowedHosts:
      - api.github.com
    allowedServices:
      # Firing alerts, read by nightwatch.py.
      - name: kube-prometheus-stack-alertmanager
        namespace: observability
        ports: [9093]
  # Scales to zero when idle and back up when a task arrives (KEDA on the
  # knight's JetStream consumer); the pod stays 15 minutes after its last task.
  lifecycle:
    suspendPolicy: auto
    idleTimeoutSeconds: 900
  nats:
    url: nats://nats.database.svc:4222
    subjects:
      - "personal.tasks.infra.>"
    stream: personal_tasks
    resultsStream: personal_results
    maxDeliver: 1
  vault:
    claimName: roundtable-vault
    readOnly: true
    # Each knight writes only its own folders and reads everyone else's
    # (whiteboard decision 10). Agents/Briefings/Morning/ belongs to the
    # vault-jobs night-shift brief and is read-only to every knight.
    writablePaths:
      - "Agents/Briefings/HomeLab/"
      # Native nightwatch writes here while it runs beside the vault-jobs CronJob
      # (which keeps Agents/NightWatch/ and its ledger).
      - "Agents/NightWatch-rt/"
      - "Agents/Briefings/Ledger/"
      - "Agents/Roundtable/"
  arsenals:
    - name: personal
      repo: https://github.com/dapperdivers/roundtable-arsenal
      ref: main
      periodSeconds: 300
    # The owner's job scripts, straight from the public vault-jobs image (the
    # repo stays private): mounted read-only at /arsenal-oci/vault-jobs/scripts.
    # Used by the native nightwatch (roundtable-k8s/roundtable#570).
    - name: vault-jobs
      oci:
        reference: ghcr.io/dapperdivers/vault-jobs:2026.11.25.17@sha256:34ba8df6c5a9829acfdc57793813d735ceca00d4051d9f9d1877bd85866f7ad6
        pullPolicy: IfNotPresent
  workspace:
    size: "10Gi"
  concurrency: 2
  taskTimeoutSeconds: 1800
  envFrom:
    - secretRef:
        name: claude-setup-token # CLAUDE_CODE_OAUTH_TOKEN
  env:
    # Settings nightwatch.py reads (same values the vault-jobs CronJob uses).
    - name: ALERTMANAGER_URL
      value: http://kube-prometheus-stack-alertmanager.observability.svc.cluster.local:9093
    - name: NIGHTWATCH_OUT_DIR
      value: Agents/NightWatch-rt
    - name: MAX_TRIAGE
      value: "5"
    - name: TZ
      value: America/Chicago
    - name: CLAUDE_AUTH_MODE
      value: subscription
    # Stop taking tasks once any plan window is 80% used, so the personal
    # table leaves room for the dev table on the shared plan.
    - name: CLAUDE_PLAN_RESERVE
      value: "0.8"
    - name: CLAUDE_EFFORT
      value: medium
    - name: TMPDIR
      value: "/data/scratch"
    - name: XDG_CACHE_HOME
      value: "/data/scratch/.cache"
  prompt:
    identity: |
      You are Sir Tristan, Knight of Infrastructure for the Round Table.
      You are the ranger — tireless, observant, and master of the wilds.
      Your domain is HomeLab, Kubernetes, and cluster operations.
