# Sir Lancelot: career persona on the personal table (claude-knight).
# Restored 2026-11-25 (roundtable-k8s/roundtable#379, phase 2; patsy is not included).
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/ai.roundtable.io/knight_v1alpha1.json
---
apiVersion: ai.roundtable.io/v1alpha1
kind: Knight
metadata:
  name: lancelot
  namespace: roundtable
  labels:
    ai.roundtable.io/round-table: personal
    # legacy label: shared-workspace mount and the mission planner still read only this one
    ai.roundtable.io/table: personal
spec:
  image: ghcr.io/roundtable-k8s/claude-knight:4292d0afdc25d0182cff1e514ad621f80891335d
  domain: career
  # Claude plan (claude-knight, Claude Code CLI), like galahad. Decision 22, 2026-11-25.
  model: sonnet
  skills:
    - shared
    - career
  tools:
    nix:
      - python3
      - lynx
      - pandoc
      - jq # JSON processing (Added 2026-04-06)
      - yq-go # YAML processing (Added 2026-04-06)
      - curl # HTTP requests (Added 2026-04-06)
  # Isolated by default (whiteboard decision 8): gVisor plus default-deny egress.
  # The operator adds NATS, DNS, the Kubernetes API, the model provider and the
  # arsenal git host. Web search goes through the cluster search service.
  runtimeClassName: gvisor
  egress:
    allowedHosts:
      - api.github.com
    allowedServices:
      - name: searxng
        namespace: selfhosted
        ports: [8080]
  # Scales to zero when idle and back up when a task arrives (KEDA on the
  # knight's JetStream consumer); the pod stays 15 minutes after its last task.
  lifecycle:
    suspendPolicy: auto
    idleTimeoutSeconds: 900
  nats:
    url: nats://nats.database.svc:4222
    subjects:
      - "personal.tasks.career.>"
    stream: personal_tasks
    resultsStream: personal_results
    maxDeliver: 1
  vault:
    claimName: roundtable-vault
    readOnly: true
    # Own folders only (whiteboard decision 10).
    writablePaths:
      - "Agents/Briefings/Career/"
      - "Agents/Briefings/Ledger/"
      - "Agents/Roundtable/"
  arsenals:
    - name: personal
      repo: https://github.com/dapperdivers/roundtable-arsenal
      ref: main
      periodSeconds: 300
  workspace:
    size: "10Gi"
  concurrency: 2
  taskTimeoutSeconds: 1800
  envFrom:
    - secretRef:
        name: claude-setup-token # CLAUDE_CODE_OAUTH_TOKEN
  env:
    - name: CLAUDE_AUTH_MODE
      value: subscription
    # Stop taking tasks once any plan window is 80% used, so the personal
    # table leaves room for the dev table on the shared plan.
    - name: CLAUDE_PLAN_RESERVE
      value: "0.8"
    - name: CLAUDE_EFFORT
      value: medium
    - name: TMPDIR
      value: "/data/scratch"
    - name: XDG_CACHE_HOME
      value: "/data/scratch/.cache"
  prompt:
    identity: |
      You are Sir Lancelot, Knight of Career for the Round Table.
      You are the champion — bold, strategic, and relentless in pursuit
      of excellence. Your domain is career development, interview prep,
      and professional growth.
