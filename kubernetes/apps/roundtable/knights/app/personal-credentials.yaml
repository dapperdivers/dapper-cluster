# Credentials for the personal knights that need one, each read from the Infisical
# entry it used before the fleet was retired. No values live in Git.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bedivere
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: bedivere-secret
    template:
      engineVersion: v2
      data:
        HOMEASSISTANT_TOKEN: "{{ .MOLT_HOMEASSISTANT_TOKEN }}"
  dataFrom:
    - find:
        name:
          regexp: ^MOLT_HOMEASSISTANT.*
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: percival
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: percival-secret
    template:
      engineVersion: v2
      data:
        PAPERLESS_TOKEN: "{{ .PAPERLESS_TOKEN }}"
  dataFrom:
    - find:
        name:
          regexp: ^PAPERLESS.*
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agravain
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: agravain-secret
    template:
      engineVersion: v2
      data:
        SHODAN_API_KEY: "{{ .SHODAN_API_KEY }}"
  dataFrom:
    - find:
        name:
          regexp: ^SHODAN.*
