# Sir Agravain: pentest persona on the personal table (claude-knight). The allowlist holds only
# Shodan; an engagement adds its named targets here, in Git, and removes them afterwards.
# Restored 2026-11-25 on the owner's instruction to bring the whole roster back.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/ai.roundtable.io/knight_v1alpha1.json
---
apiVersion: ai.roundtable.io/v1alpha1
kind: Knight
metadata:
  name: agravain
  namespace: roundtable
  labels:
    ai.roundtable.io/round-table: personal
    # legacy label: shared-workspace mount and the mission planner still read only this one
    ai.roundtable.io/table: personal
spec:
  image: ghcr.io/roundtable-k8s/claude-knight:7a417e9397310f8bb41d69c4ecc15478eb586b9f
  domain: pentest
  # Kimi K2.6 (was openrouter/google/gemini-2.5-flash).
  model: sonnet
  # capabilities:
  #   browser: true  # Disabled until browser sidecar is configured
  skills:
    - shared
    - pentest
    - research # For autoresearch skill optimization
  tools:
    nix:
      - nmap
      - whois
      - dnsutils
      - nikto
      - gobuster
      - ffuf
      - masscan
      - testssl
      - sqlmap
      - nuclei
      - katana
      - naabu
      - dalfox
      - gowitness
      # - zaproxy  # Package broken/missing in nixpkgs
      - feroxbuster
      - socat
      - tcpdump
      - curl # For autoresearch API calls
      - jq # For JSON processing
      # Expanded Pentest Tools (Added 2026-04-06)
      - wpscan # WordPress security scanner
      - rustscan # Fast port scanner
      - thc-hydra # Credential brute-forcing
      - john # Password cracking
      - hashcat # GPU-accelerated password cracking
      - amass # Subdomain enumeration
      - subfinder # Passive subdomain discovery
      - whatweb # Web technology fingerprinting
      - netexec # Network service exploitation (crackmapexec successor; renamed in nixpkgs)
  # Isolated by default (whiteboard decision 8): gVisor plus default-deny egress.
  # The operator adds NATS, DNS, the Kubernetes API, the model provider and the
  # arsenal git host. No scan targets are allowed until an engagement lists them.
  runtimeClassName: gvisor
  egress:
    allowedHosts:
      - api.github.com
      - api.shodan.io
      - internetdb.shodan.io
  # Scales to zero when idle and back up when a task arrives.
  lifecycle:
    suspendPolicy: auto
    idleTimeoutSeconds: 900
  nats:
    url: nats://nats.database.svc:4222
    subjects:
      - "personal.tasks.pentest.>"
    stream: personal_tasks
    resultsStream: personal_results
    maxDeliver: 1
  vault:
    claimName: roundtable-vault
    readOnly: true
    # Own folders only (whiteboard decision 10).
    writablePaths:
      - "Agents/Briefings/Pentest/"
      - "Agents/Briefings/Ledger/"
      - "Agents/Roundtable/"
  arsenals:
    - name: personal
      repo: https://github.com/dapperdivers/roundtable-arsenal
      ref: main
      periodSeconds: 300
  workspace:
    size: "10Gi"
  concurrency: 1
  taskTimeoutSeconds: 1800
  envFrom:
    - secretRef:
        name: claude-setup-token # CLAUDE_CODE_OAUTH_TOKEN
    - secretRef:
        name: agravain-secret
  env:
    - name: CLAUDE_AUTH_MODE
      value: subscription
    - name: CLAUDE_PLAN_RESERVE
      value: "0.8"
    - name: CLAUDE_EFFORT
      value: medium
    - name: TMPDIR
      value: "/data/scratch"
    - name: XDG_CACHE_HOME
      value: "/data/scratch/.cache"
  prompt:
    identity: |
      You are Sir Agravain, Knight of Pentesting and Research for the Round Table.
      You are the shadow — cunning, thorough, and unrelenting in finding weakness.
      Your domains are offensive security, penetration testing, and autonomous
      research optimization (autoresearch).
