# Round Table development team (roundtable-k8s/roundtable#187): builds the Round
# Table platform itself. Every knight on this table gets the scoped dunce-bot
# GitHub token as a refreshing file (contents/PRs/issues write on the 5 org repos,
# no workflows) and pushes branches + opens PRs; protect-main requires PRs, and
# knights never merge.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/ai.roundtable.io/roundtable_v1alpha1.json
---
apiVersion: ai.roundtable.io/v1alpha1
kind: RoundTable
metadata:
  name: roundtable-dev
  namespace: roundtable
spec:
  description: |
    Round Table platform development team. Route here for: operator features,
    CRD changes, knight runtime work (the knights monorepo: pi-knight, claude-knight, core), dashboard
    (roundtable-ui) bugs and features, arsenal skills, CI for the roundtable-k8s
    repos. Repos: roundtable, knights, roundtable-ui, arsenal.
    Do NOT route personal tasks, security research, finance or homelab work here.
  nats:
    url: nats://nats.database.svc:4222
    subjectPrefix: rt-dev
    tasksStream: rt_dev_tasks
    resultsStream: rt_dev_results
    createStreams: true
    streamRetention: WorkQueue
  knightSelector:
    matchLabels:
      ai.roundtable.io/table: roundtable-dev
  # OpenRouter for pi-knight members; claude-knight members add claude-setup-token.
  secrets:
    - name: roundtable-secret
  github:
    tokenSecretRef:
      name: roundtable-github-token
      key: token
  # Model aliases for chain steps / per-task overrides (roundtable#217). Coder
  # aliases resolve on claude-knight (Max plan); the lead (pi-knight) keeps its
  # own default model, see roundtable#244.
  modelAliases:
    deep: opus
    fast: sonnet
    cheap: haiku
  defaults:
    taskTimeoutSeconds: 2700
    concurrency: 1
  policies:
    maxMissions: 3
  sharedWorkspace:
    claimName: roundtable-workspace
    mountPath: /shared
  # Closed loop (roundtable-k8s/roundtable#264): poll the trusted repos for
  # issues labelled rt:ready and start a copy of the pr-pipeline Chain for each.
  # Defaults kept explicit: rt:in-progress on claim, needs-human (and issues
  # touching .github/workflows) are never taken. 12 chains at once, 4 per
  # repo (wide open 2026-11-24: coders autoscale to 6 pods x 2 slots,
  # plus rt-coder's 4). To pause: set suspend: true (running chains finish).
  issuePickup:
    chainRef:
      name: pr-pipeline
    repos:
      - roundtable-k8s/roundtable
      - roundtable-k8s/roundtable-ui
      - roundtable-k8s/knights
      - roundtable-k8s/arsenal
    readyLabel: rt:ready
    inProgressLabel: rt:in-progress
    needsHumanLabel: needs-human
    # Only issues that touch CI workflow files are kept from the knights by
    # their text: the knights' token cannot push those. The default word list
    # (secret, auth, credentials) is dropped on purpose: it skipped test
    # suites, docs and gateway work that merely mention those words, and
    # safety comes from narrow credentials, review and merge-guard instead
    # (whiteboard decision 7, roundtable-k8s/roundtable#377). The needs-human
    # label still keeps an issue with a human.
    # TRIAL until 2026-11-28 (owner decision 2026-11-25, see
    # infrastructure/app/github-token.yaml): the token may push workflow
    # files, so issues that mention them are picked up too. The list cannot be
    # left empty (the CRD default would come back, with its secret/auth
    # words), so it holds one pattern that can never match. To end the trial
    # put back: - '\.github/workflows'
    humanPatterns:
      - "a^b"
    maxActive: 12
    # 6 since 2026-11-25: most queued work is in the operator repo, and at 4
    # the scheduling issues the kagent migration waits on sat ready for two
    # hours behind other chains. rt-operator has 6 pods x 2 slots for it.
    maxActivePerRepo: 6
    intervalSeconds: 60
    # PAUSED 2026-11-26 ~04:15 UTC at the owner's request ("pause everything,
    # pick things up tomorrow"). To resume: suspend: false here, enabled: true
    # under prFeedback, and remove suspend from chain-merlin-check.yaml.
    suspend: true
  # Failure feedback (roundtable-k8s/roundtable#226, docs/pr-feedback.md):
  # watch knight PRs for red CI and merge-queue rejections and send them back
  # to the author knight (pr-pipeline-feedback Chain); flaky runs get an issue,
  # exhausted retries get needs-human. PRs no chain opened go to rt-operator.
  prFeedback:
    enabled: false # paused with issue pickup, see above
    repos:
      - roundtable-k8s/roundtable
      - roundtable-k8s/roundtable-ui
      - roundtable-k8s/knights
      - roundtable-k8s/arsenal
    maxAttempts: 3
    fallbackKnightRef:
      name: rt-operator
