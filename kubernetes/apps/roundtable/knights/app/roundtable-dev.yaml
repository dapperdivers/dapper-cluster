# Round Table development team (roundtable-k8s/roundtable#187): builds the Round
# Table platform itself. Every knight on this table gets the scoped dunce-bot
# GitHub token as a refreshing file (contents/PRs/issues write on the 5 org repos,
# no workflows) and pushes branches + opens PRs; protect-main requires PRs, and
# knights never merge.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/ai.roundtable.io/roundtable_v1alpha1.json
---
apiVersion: ai.roundtable.io/v1alpha1
kind: RoundTable
metadata:
  name: roundtable-dev
  namespace: roundtable
spec:
  description: |
    Round Table platform development team. Route here for: operator features,
    CRD changes, knight runtime work (pi-knight, claude-knight), dashboard
    (roundtable-ui) bugs and features, arsenal skills, CI for the roundtable-k8s
    repos. Repos: roundtable, pi-knight, claude-knight, roundtable-ui, arsenal.
    Do NOT route personal tasks, security research, finance or homelab work here.
  nats:
    url: nats://nats.database.svc:4222
    subjectPrefix: rt-dev
    tasksStream: rt_dev_tasks
    resultsStream: rt_dev_results
    createStreams: true
    streamRetention: WorkQueue
  knightSelector:
    matchLabels:
      ai.roundtable.io/table: roundtable-dev
  # OpenRouter for pi-knight members; claude-knight members add claude-setup-token.
  secrets:
    - name: roundtable-secret
  github:
    tokenSecretRef:
      name: roundtable-github-token
      key: token
  # Model aliases for chain steps / per-task overrides (roundtable#217). Coder
  # aliases resolve on claude-knight (Max plan); the lead (pi-knight) keeps its
  # own default model, see roundtable#244.
  modelAliases:
    deep: opus
    fast: sonnet
    cheap: haiku
  defaults:
    taskTimeoutSeconds: 2700
    concurrency: 1
  policies:
    maxKnights: 10
    maxMissions: 3
  sharedWorkspace:
    claimName: roundtable-workspace
    mountPath: /shared
  # Closed loop (roundtable-k8s/roundtable#264): poll the trusted repos for
  # issues labelled rt:ready and start a copy of the pr-pipeline Chain for each.
  # Defaults kept explicit: rt:in-progress on claim, needs-human (and issues
  # mentioning workflows/secrets/auth) are never taken. Start small: 2 chains
  # at once, 1 per repo. To pause: set suspend: true (running chains finish).
  issuePickup:
    chainRef:
      name: pr-pipeline
    repos:
      - roundtable-k8s/roundtable
      - roundtable-k8s/roundtable-ui
      - roundtable-k8s/pi-knight
      - roundtable-k8s/claude-knight
      - roundtable-k8s/arsenal
    readyLabel: rt:ready
    inProgressLabel: rt:in-progress
    needsHumanLabel: needs-human
    maxActive: 2
    maxActivePerRepo: 1
    intervalSeconds: 300
    suspend: false
  # Failure feedback (roundtable-k8s/roundtable#226, docs/pr-feedback.md):
  # watch knight PRs for red CI and merge-queue rejections and send them back
  # to the author knight (pr-pipeline-feedback Chain); flaky runs get an issue,
  # exhausted retries get needs-human. PRs no chain opened go to rt-operator.
  prFeedback:
    enabled: true
    repos:
      - roundtable-k8s/roundtable
      - roundtable-k8s/roundtable-ui
      - roundtable-k8s/pi-knight
      - roundtable-k8s/claude-knight
      - roundtable-k8s/arsenal
    maxAttempts: 3
    fallbackKnightRef:
      name: rt-operator
  # Post-deploy smoke (#228): when a new operator/knight version has settled,
  # run rollout-smoke. Pass: recorded as known-good. Fail: a needs-human issue
  # in roundtable, status.smoke.held, and the `hold` label on the
  # autodeploy/roundtable PR (stops further autodeploys; remove the label to
  # resume). Token: roundtable-smoke-hold-token (dapper-cluster PRs only).
  smoke:
    enabled: true
    chainRef:
      name: rollout-smoke
    issueRepo: roundtable-k8s/roundtable
    needsHumanLabel: needs-human
    hold:
      repo: dapperdivers/dapper-cluster
      branch: autodeploy/roundtable
      label: hold
      tokenSecretRef:
        name: roundtable-smoke-hold-token
        key: token
