# Reusable "implement a roundtable-ui issue → PR → review" chain for the dev
# table. Chains only run when triggered: set spec.input to the target issue, then
# start a run by patching status.phase to Running (see roundtable-k8s/roundtable#188).
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/ai.roundtable.io/chain_v1alpha1.json
---
apiVersion: ai.roundtable.io/v1alpha1
kind: Chain
metadata:
  name: rt-ui-implement-issue
  namespace: roundtable
spec:
  roundTableRef: roundtable-dev
  description: rt-ui implements a roundtable-ui issue and opens a PR; rt-lead reviews it.
  # First target: the M0 acceptance test (roundtable-k8s/roundtable#188).
  input: '{"repo": "roundtable-k8s/roundtable-ui", "issue": 122}'
  timeout: 3600
  steps:
    - name: implement
      knightRef: rt-ui
      timeout: 2700
      task: |
        Implement this GitHub issue end to end: {{ .Input }}
        Read it with `gh issue view <issue> -R <repo> --comments`, then follow
        your working rules: fresh clone, branch rt/<issue>-<slug>, minimal fix
        with tests, build and test, push, and open a PR that says "Closes #<issue>".
        Do not merge. Answer with the PR URL first, then a short summary.
    - name: review
      knightRef: rt-lead
      dependsOn:
        - implement
      timeout: 600
      task: |
        rt-ui reports on {{ .Input }}:

        {{ .Steps.implement.Output }}

        Review that PR as described in your instructions and post one
        `gh pr review --comment`. Answer with your verdict and key points.
