# Sir Gawain: project and briefing-editor persona on the personal table (claude-knight).
# Restored 2026-11-25 (roundtable-k8s/roundtable#378, phase 1).
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/ai.roundtable.io/knight_v1alpha1.json
---
apiVersion: ai.roundtable.io/v1alpha1
kind: Knight
metadata:
  name: gawain
  namespace: roundtable
  labels:
    ai.roundtable.io/round-table: personal
    # legacy label: shared-workspace mount and the mission planner still read only this one
    ai.roundtable.io/table: personal
spec:
  image: ghcr.io/roundtable-k8s/claude-knight:576abbdf1f2694efa2d3594d777dd761f5112fbc
  domain: project
  # Kimi K2.6 — gawain is the briefing SYNTHESIS knight, the one step where
  # output quality matters most, so it runs on the strongest cheap cloud model
  # while the 7 domain knights stay on the free local pool (ollama/qwen3.5:9b).
  # History: openrouter/deepseek/deepseek-v3.2 -> ollama/qwen3.5:9b -> kimi.
  # Claude plan (claude-knight, Claude Code CLI), like galahad. Decision 22, 2026-11-25.
  model: sonnet
  skills:
    - shared
    - project # includes project/briefing-synthesis (was its own category in the old arsenal layout)
  tools:
    nix:
      - gh
      - yq-go
      - python3
      - go
      - gnumake
      - jq
      - tree
      - curl
      - fd
      - ripgrep
  # Isolated by default (whiteboard decision 8): gVisor plus default-deny egress.
  # The operator adds NATS, DNS, the Kubernetes API, the model provider and the
  # arsenal git hosts; gawain also uses the GitHub API (dunce-bot token file).
  runtimeClassName: gvisor
  egress:
    allowedHosts:
      - api.github.com
  # Scales to zero when idle and back up when a task arrives (KEDA on the
  # knight's JetStream consumer); the pod stays 15 minutes after its last task.
  lifecycle:
    suspendPolicy: auto
    idleTimeoutSeconds: 900
  nats:
    url: nats://nats.database.svc:4222
    subjects:
      - "personal.tasks.project.>"
      - "personal.tasks.management.>"
      - "personal.tasks.orchestration.>"
    stream: personal_tasks
    resultsStream: personal_results
    maxDeliver: 1
  vault:
    claimName: roundtable-vault
    readOnly: true
    # Each knight writes only its own folders and reads everyone else's
    # (whiteboard decision 10). Agents/Briefings/Morning/ belongs to the
    # vault-jobs night-shift brief and is read-only to every knight.
    writablePaths:
      - "Agents/Briefings/Daily/"
      - "Agents/Briefings/Ledger/"
      - "Agents/Roundtable/"
  arsenals:
    - name: personal
      repo: https://github.com/dapperdivers/roundtable-arsenal
      ref: main
      periodSeconds: 300
    # project/* skills (briefing-synthesis, chain-orchestration, fleet-status, github-pm) live in the org arsenal
    - name: platform
      repo: https://github.com/roundtable-k8s/arsenal
      ref: main
      periodSeconds: 300
  # Was GH_TOKEN from gawain-secret (GAWAIN_GITHUB_TOKEN PAT, since retired). The dunce-bot
  # token file only covers the five roundtable-k8s repos: no dapper-cluster access (roundtable#288).
  github:
    tokenSecretRef:
      name: roundtable-github-token
      key: token
  workspace:
    size: "10Gi"
  concurrency: 2
  taskTimeoutSeconds: 1800
  envFrom:
    - secretRef:
        name: claude-setup-token # CLAUDE_CODE_OAUTH_TOKEN
  env:
    - name: CLAUDE_AUTH_MODE
      value: subscription
    # Stop taking tasks once any plan window is 80% used, so the personal
    # table leaves room for the dev table on the shared plan.
    - name: CLAUDE_PLAN_RESERVE
      value: "0.8"
    - name: CLAUDE_EFFORT
      value: medium
    - name: TMPDIR
      value: "/data/scratch"
    - name: XDG_CACHE_HOME
      value: "/data/scratch/.cache"
    # Local-pool fallback wiring (unused while model is openrouter/...; these
    # envs only apply when an "ollama/..." model misses pi's registry and
    # pi-knight builds an openai-completions model from them). Kept so
    # flipping back to ollama/qwen3.5:9b is a one-line change.
    # MODEL_CONTEXT_WINDOW must match the pool's OLLAMA_CONTEXT_LENGTH.
  prompt:
    identity: |
      You are Sir Gawain, Knight of the Sun — Orchestrator, Project Manager, and Morning Briefing Editor of the Round Table.
      Your vision illuminates every corner of the realm. You see the full picture where others see only their domain.

      You have THREE roles:

      **1. Project Manager** — Track and manage the Round Table roadmap
      - GitHub issues, milestones, and PRs via `gh` CLI
      - Repos: roundtable (operator), dapper-cluster (GitOps), roundtable-arsenal (skills), pi-knight (runtime)
      - Create/update/close issues based on completed work
      - Review knight output and ensure quality

      **2. Chain Orchestrator** — Coordinate multi-knight missions
      - Dispatch tasks to knights via `nats_request` (see chain-orchestration skill)
      - Aggregate results from multiple knights into unified reports
      - Run fleet health checks (see fleet-status skill)
      - Cross-reference findings across domains
      - Lead with ACTION ITEMS, not information dumps

      **3. Morning Briefing Editor** — Compile the Daily Briefing
      - When synthesizing knight reports into a daily briefing, your OUTPUT IS THE FILE
      - Follow the briefing-synthesis skill exactly for format and quality
      - NEVER describe what you would write — WRITE the actual briefing document
      - Target 90-110 lines, 8-12KB — if your output is under 4KB, you compressed too much
      - If summaries are thin, read full domain reports from /vault/Agents/Briefings/

      Chain patterns you orchestrate:
      - **Parallel Fan-Out**: multiple knights work simultaneously
      - **Sequential Pipeline**: output chains through knights
      - **Fan-Out → Synthesize**: parallel work then you unify

      You have the gh CLI and nats_request tool. Use both freely.
      Your GitHub token is the file named by GITHUB_TOKEN_FILE (roundtable-k8s repos only).
