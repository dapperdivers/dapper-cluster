# Sir Gareth: wellness persona on the personal table (claude-knight). NOTE: the persona prompt still
# refers to dates from early 2026; the owner should update it.
# Restored 2026-11-25 (roundtable-k8s/roundtable#379, phase 2; patsy is not included).
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/ai.roundtable.io/knight_v1alpha1.json
---
apiVersion: ai.roundtable.io/v1alpha1
kind: Knight
metadata:
  name: gareth
  namespace: roundtable
  labels:
    ai.roundtable.io/round-table: personal
    # legacy label: shared-workspace mount and the mission planner still read only this one
    ai.roundtable.io/table: personal
spec:
  image: ghcr.io/roundtable-k8s/claude-knight:b766207d86274bb14cec60a9826c37cbade66bb9
  domain: wellness
  # Claude plan (claude-knight, Claude Code CLI), like galahad. Decision 22, 2026-11-25.
  model: sonnet
  skills:
    - shared
    - wellness
  tools:
    nix:
      - python3
      - sqlite
      - bc
      - units
      - pandoc
  # Isolated by default (whiteboard decision 8): gVisor plus default-deny egress.
  # The operator adds NATS, DNS, the Kubernetes API, the model provider and the
  # arsenal git host.
  runtimeClassName: gvisor
  egress:
    allowedHosts:
      - api.github.com
  # Scales to zero when idle and back up when a task arrives (KEDA on the
  # knight's JetStream consumer); the pod stays 15 minutes after its last task.
  lifecycle:
    suspendPolicy: auto
    idleTimeoutSeconds: 900
  nats:
    url: nats://nats.database.svc:4222
    subjects:
      - "personal.tasks.wellness.>"
    stream: personal_tasks
    resultsStream: personal_results
    maxDeliver: 1
  vault:
    claimName: roundtable-vault
    readOnly: true
    # Own folders only (whiteboard decision 10).
    writablePaths:
      - "Agents/Briefings/Wellness/"
      - "Agents/Briefings/Ledger/"
      - "Agents/Roundtable/"
  arsenals:
    - name: personal
      repo: https://github.com/dapperdivers/roundtable-arsenal
      ref: main
      periodSeconds: 300
  workspace:
    size: "10Gi"
  concurrency: 2
  # Raised 600 → 1800 with the move to the local pool: knight requests queue
  # FIFO behind each other on two P100s, so wall time includes queue wait.
  taskTimeoutSeconds: 1800
  envFrom:
    - secretRef:
        name: claude-setup-token # CLAUDE_CODE_OAUTH_TOKEN
  env:
    - name: CLAUDE_AUTH_MODE
      value: subscription
    # Stop taking tasks once any plan window is 80% used, so the personal
    # table leaves room for the dev table on the shared plan.
    - name: CLAUDE_PLAN_RESERVE
      value: "0.8"
    - name: CLAUDE_EFFORT
      value: medium
    - name: TMPDIR
      value: "/data/scratch"
    - name: XDG_CACHE_HOME
      value: "/data/scratch/.cache"
  prompt:
    identity: |
      You are Sir Gareth, Knight of Health & Wellness for the Round Table.
      You are the Kitchen Knight — humble, practical, and tireless in
      service. You arrived at Camelot unrecognized and proved your worth
      through deeds, not titles. Your domain is health, wellness, meal
      planning, nutrition, exercise, and family wellbeing. You track
      pregnancy milestones, plan meals, suggest recipes, build grocery
      lists, and keep the household healthy. With baby Emma arriving
      April 2026, your service has never been more vital.
