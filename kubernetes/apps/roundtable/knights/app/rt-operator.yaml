# Round Table dev team: roundtable specialist on claude-knight (Claude Code CLI,
# subscription). GitHub token comes from the roundtable-dev table (spec.github).
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/ai.roundtable.io/knight_v1alpha1.json
---
apiVersion: ai.roundtable.io/v1alpha1
kind: Knight
metadata:
  name: rt-operator
  namespace: roundtable
  labels:
    ai.roundtable.io/table: roundtable-dev
    ai.roundtable.io/round-table: roundtable-dev
spec:
  # claude-knight main @ 2365a3a (CLI runtime, GITHUB_TOKEN_FILE, no Claude attribution #6).
  image: ghcr.io/roundtable-k8s/claude-knight:480059e2200ddf01a454133c36d8d54996f666cb
  domain: operator
  # Opus for operator design work (fan-out, scaled knights) until per-task model overrides land.
  model: opus
  skills:
    - shared
    - coding
  tools:
    nix:
      - gh
      - go
      - gnumake
      - yq-go
      - jq
      - ripgrep
      - fd
  nats:
    url: nats://nats.database.svc:4222
    subjects:
      - "rt-dev.tasks.operator.>"
    stream: rt_dev_tasks
    resultsStream: rt_dev_results
    maxDeliver: 1
  # Personal arsenal first (shared + generic coding skills), then the org
  # arsenal on top: it holds the Round Table platform skills (coding/
  # roundtable-operator, roundtable-ui, pi-knight-runtime, project/*), which
  # moved there in the arsenal split. Later arsenals win per skill.
  arsenal:
    name: personal
    repo: https://github.com/dapperdivers/roundtable-arsenal
    ref: main
    periodSeconds: 300
  arsenals:
    - name: platform
      repo: https://github.com/roundtable-k8s/arsenal
      ref: main
      periodSeconds: 300
  workspace:
    size: 10Gi
  # Parallel tasks in one pod (per-task workdir, claude-knight#10; pull-when-free, #13).
  concurrency: 3
  # 3 parallel tasks of Go builds + envtest: request more than a small node
  # (5950m allocatable) so the scheduler places coders on the 16-core nodes.
  resources:
    requests:
      cpu: "6"
      memory: 6Gi
    limits:
      cpu: "12"
      memory: 16Gi
  taskTimeoutSeconds: 3600 # CRD max
  envFrom:
    - secretRef:
        name: claude-setup-token # CLAUDE_CODE_OAUTH_TOKEN
  env:
    - name: CLAUDE_AUTH_MODE
      value: subscription
    - name: CLAUDE_PLAN_RESERVE
      value: "0.8"
    - name: CLAUDE_EFFORT
      value: medium
    - name: TMPDIR
      value: /data/scratch
    - name: XDG_CACHE_HOME
      value: /data/scratch/.cache
    # Keep Go module + lint caches on the PVC (shared across parallel tasks,
    # survives restarts, off the 4Gi ephemeral-storage limit).
    - name: GOMODCACHE
      value: /data/scratch/go/mod
    - name: GOLANGCI_LINT_CACHE
      value: /data/scratch/.cache/golangci-lint
    - name: GOFLAGS
      value: -modcacherw
  prompt:
    identity: |
      You are rt-operator, the operator specialist of the Round Table dev team.
      You own **roundtable-k8s/roundtable**: the Go kubebuilder operator (CRDs
      Knight, Chain, Mission, RoundTable; internal/controller, pkg/nats,
      pkg/runtime) and its Helm chart (charts/roundtable-operator). Use
      GOTOOLCHAIN=go1.26.1 for make test / make lint (#193).

      Working rules (all repos):
      - Read the repo's AGENTS.md / README first and follow its build and test commands.
      - Work in a fresh clone under /data/work. Branch from origin/main as
        rt/<issue-number>-<short-slug>. Never push to main (it is protected anyway).
      - Keep the change small and focused on the issue. Add or update tests.
      - Build and test before every push. If tests fail and you can't fix them, say so.
      - Conventional commits matching `git log --oneline -5`.
      - Open the PR with `gh pr create`, body ending "Closes #<n>". NEVER merge.
      - NEVER add Co-Authored-By trailers, "Generated with" footers or any AI
        attribution to commits or PRs.
      - Your final answer: the PR URL, what changed, test results, and anything
        you were unsure about.

      Git identity (set in each clone):
        git config user.name "Round Table"
        git config user.email "186783191+dunce-bot[bot]@users.noreply.github.com"
