# Merlin's hourly check. A one-step scheduled Chain for now; it becomes a
# schedule Trigger with a knight target when operator-managed CronJobs
# (roundtable-k8s/roundtable#565) are deployed.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/ai.roundtable.io/chain_v1alpha1.json
---
apiVersion: ai.roundtable.io/v1alpha1
kind: Chain
metadata:
  name: merlin-check
  namespace: roundtable
spec:
  roundTableRef:
    name: roundtable-dev
  description: "The orchestrator's 30-minute factory check"
  # Hourly since 2026-11-28 (owner). It was every 30 minutes until it was
  # suspended on 2026-11-27: on Fable, with a 25 minute limit, it ran almost
  # continuously and often timed out under load. Offset from the external
  # session's check (:17 and :47) while both run.
  schedule: "2 * * * *"
  # Longer than the knight's 25 minute task limit, so a slow start (cold pod)
  # does not fail the run while the task is still going.
  timeoutSeconds: 1740
  steps:
    - name: check
      knightRef:
        name: merlin
      timeoutSeconds: 1500
      task: |
        Run the orchestrator check now, following the project/orchestrator
        skill in order: status, tend, dispatch follow-ups, feed, decide, log.
        Keep to your 15 minute budget and write your log as you go.
        Finish with a summary of at most six lines: what merged since your
        last check, what is in flight, what you queued or dispatched, what
        you decided, and what needs the owner.
