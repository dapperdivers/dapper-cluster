# Round Table dev team lead on claude-knight (Claude Opus 5.5, subscription):
# plans the PR pipeline, reviews and merges (via rt-review + the merge queue),
# doesn't write code. Moved off GLM-5.3/OpenRouter on 2026-11-24: GLM's review
# judgement was fine, but it often skipped rt-review (verdicts never reached
# GitHub), claimed merges that never happened, returned unparseable plans, and
# stalled the whole factory twice on OpenRouter credit. Every PR goes through
# rt-lead, so it has to be the most reliable step.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/ai.roundtable.io/knight_v1alpha1.json
---
apiVersion: ai.roundtable.io/v1alpha1
kind: Knight
metadata:
  name: rt-lead
  namespace: roundtable
  labels:
    ai.roundtable.io/table: roundtable-dev
    ai.roundtable.io/round-table: roundtable-dev
spec:
  # Same claude-knight pin as rt-operator / rt-ui: the monorepo image
  # (roundtable-k8s/knights @ 640a55f). Previous image: 299448cd.
  image: ghcr.io/roundtable-k8s/claude-knight:3b2ff5bb675deb45c72acf25cca5684937041dcf
  domain: lead
  # Isolated (roundtable-k8s/roundtable#387): gVisor sandbox plus default-deny
  # egress, like the coders. rt-lead plans, reviews and merges, so it needs
  # GitHub and, for checking a branch during review, the package hosts. The
  # operator adds NATS, DNS, the Kubernetes API, the model providers and the
  # arsenal git hosts.
  runtimeClassName: gvisor
  egress:
    allowedHosts:
      - github.com
      - api.github.com
      - codeload.github.com
      - "*.githubusercontent.com"
      - registry.npmjs.org
      - proxy.golang.org
      - sum.golang.org
      - storage.googleapis.com
  # Opus (latest, 5.5) for planning and review: the quality gate for every PR.
  model: opus
  skills:
    - shared
    - coding
    - project
  tools:
    # Reviews build and test PRs with CI's exact toolchain: roundtable's
    # knight-tools (go, golangci-lint, controller-gen, helm, envtest, gh, jq),
    # same pin as rt-operator. One flake at most (roundtable#248); Node 22
    # comes from the claude-knight image.
    flakes:
      - ref: github:roundtable-k8s/roundtable/9ce25f07505cf6bb5503188fe90e391eea5c4133
        packages:
          - knight-tools
    nix:
      - ripgrep
      - fd
  nats:
    url: nats://nats.database.svc:4222
    subjects:
      - "rt-dev.tasks.lead.>"
    stream: rt_dev_tasks
    resultsStream: rt_dev_results
    maxDeliver: 1
  # Personal arsenal first (shared + generic coding skills), then the org
  # arsenal on top: it holds the Round Table platform skills (coding/
  # roundtable-operator, roundtable-ui, pi-knight-runtime, project/*), which
  # moved there in the arsenal split. Later arsenals win per skill.
  arsenals:
    - name: personal
      repo: https://github.com/dapperdivers/roundtable-arsenal
      ref: main
      periodSeconds: 300
    - name: platform
      repo: https://github.com/roundtable-k8s/arsenal
      ref: main
      periodSeconds: 300
  workspace:
    # Reviews clone + build + test PRs (Go caches, envtest): 5Gi filled up
    # on 2026-11-23. PVC expanded online to match.
    size: 30Gi
  # Each slot is a Claude Code CLI process: 4 parallel plans/reviews.
  concurrency: 8
  # 30 minutes, the same as the pipeline's review step. At 15 minutes two
  # reviews were cut off on 2026-11-25 (roundtable#548, knights#89) while
  # re-running tests: builds and tests take about twice as long under gVisor.
  # The prompt below now tells rt-lead to read CI results instead of
  # re-running suites (owner decision, 2026-11-25: keep the sandbox on the
  # reviewer, change how reviews work).
  taskTimeoutSeconds: 1800
  envFrom:
    - secretRef:
        name: claude-setup-token # CLAUDE_CODE_OAUTH_TOKEN
  env:
    - name: CLAUDE_AUTH_MODE
      value: subscription
    # Wide open (2026-11-24): no knight-side reserve. The plan's own limit still
    # applies; a limit refusal defers the step until reset (roundtable#321).
    - name: CLAUDE_PLAN_RESERVE
      value: "1"
    # Reviews are the quality gate: think harder than the coders (medium).
    - name: CLAUDE_EFFORT
      value: high
    - name: KUBEBUILDER_ASSETS
      value: /nix/profile/share/envtest
    - name: TMPDIR
      value: /data/scratch
    - name: XDG_CACHE_HOME
      value: /data/scratch/.cache
    - name: GOMODCACHE
      value: /data/scratch/go/mod
    - name: GOLANGCI_LINT_CACHE
      value: /data/scratch/.cache/golangci-lint
    - name: GOFLAGS
      value: -modcacherw
  prompt:
    identity: |
      You are rt-lead, the technical lead of the Round Table dev team. You know
      the whole platform: roundtable (Go operator + Helm chart), knights (the
      TypeScript knight runtimes monorepo: packages/pi-knight,
      packages/claude-knight and the shared packages/core), roundtable-ui (Go API + React
      dashboard) and arsenal (skills), all under github.com/roundtable-k8s.

      You plan and review; you do not write code.
      - Reviewing a PR: read the linked issue and the diff (`gh pr view`,
        `gh pr diff`, `gh pr checks`). Check it solves the issue, has tests,
        stays in scope and matches the repo's conventions.
        CI is the test run, not you. Every PR's full build, lint and tests run
        in CI and again in the merge queue. Read their results
        (`gh pr checks <url>`, and `gh run view <id> --log-failed` for a red
        check) instead of repeating them. Do NOT run a repository's whole test
        suite, `make test`, `go test ./...`, `npm test` or a full build during
        a review. Run something yourself only to settle one specific doubt the
        diff raises (one package, one test by name, one `helm template`), and
        at most once. If CI has not finished, review the diff and say in the
        review which checks were still running; the merge queue will not merge
        a PR whose checks fail. If CI is red, that is needs_changes with the
        failing check and the relevant log lines quoted. Write your review
        (Markdown, no verdict line) to a file and post it ONLY with the
        pr-review skill:
        `bash /skills/project/pr-review/scripts/rt-review <url> ship_it|needs_changes <file>`.
        Never post reviews with `gh pr review` or queue with `gh pr merge`
        yourself: rt-review writes the exact verdict line the merge-guard check
        requires, verifies the review landed, and queues the PR on ship_it.
      - You own merging; rt-review does the queueing. Use `--no-queue` (and say
        why in the review) when the PR deletes data or touches secrets or auth:
        those are left for the human. rt-review already skips drafts and `hold`
        PRs. CRD, API and task-contract changes are yours to merge: the Round
        Table builds itself. For a change that breaks existing resources or
        the task contract, the PR must carry a migration note (what changes,
        what has to be updated in dapper-cluster or the knights, in what
        order); a missing note is needs_changes.
      - Non-blocking findings must not evaporate: when you merge or queue a PR
        that still has nits or follow-ups, add them as checkboxes to that repo's
        open issue titled exactly "chore: review follow-ups" (find it with
        `gh issue list -R <repo> --state open --search 'in:title "chore: review follow-ups"'`;
        create it only if none exists), each with a PR link and a severity
        (bug-risk / hardening / docs / polish). A bug-risk item that is not
        trivial gets its own issue instead.
      - Review checklist (each is blocking unless noted):
        * Go `go`/`toolchain` directive bumps in go.mod: the Dockerfile base
          image and the CI Go version must match, or it is needs changes.
        * Dockerfile/CI parity: anything CI builds or tests with (Go, Node,
          tool versions) must match what the image builds with.
        * Never wait on CI or the merge queue: no `gh pr checks --watch`, no
          polling loops, no re-checking whether a queued PR merged. Once the
          review is posted and the PR is queued, your task is done.
        * Exactly one "chore: review follow-ups" issue per repo; never open
          a second one.
      - Never add AI attribution lines to anything you post.
      - Final answer: rt-review's last output line (verdict and whether it
        queued), then the key points.
  resources:
    # Reviews run the PR's tests (go test + envtest, npm test); 1 CPU starved
    # 3 parallel reviews to 10x their normal time on 2026-11-23.
    requests:
      cpu: "2"
      memory: 2Gi
      ephemeral-storage: 10Gi
    limits:
      # 4 parallel reviews, each a Claude Code CLI plus test runs.
      cpu: "6"
      memory: 12Gi
      # Review test runs write to /tmp; the namespace default (4Gi) evicted
      # rt-lead mid-review on 2026-11-23.
      ephemeral-storage: 40Gi
