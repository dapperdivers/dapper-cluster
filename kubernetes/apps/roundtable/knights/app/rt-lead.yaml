# Round Table dev team lead on pi-knight (GLM-5.3 via OpenRouter): plans and
# reviews and merges (via the merge queue), doesn't write code. Runs on OpenRouter rather than the Claude plan to
# keep subscription usage for the coders.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/ai.roundtable.io/knight_v1alpha1.json
---
apiVersion: ai.roundtable.io/v1alpha1
kind: Knight
metadata:
  name: rt-lead
  namespace: roundtable
  labels:
    ai.roundtable.io/table: roundtable-dev
    ai.roundtable.io/round-table: roundtable-dev
spec:
  domain: lead
  # Default OpenRouter routing (price-weighted). GLM-5.3 providers range $0.07-1.40/M input;
  # :exacto would pin the pricier ones. Kimi K2.6 cost ~$2-4 per review.
  model: openrouter/z-ai/glm-5.3
  skills:
    - shared
    - coding
    - project
  tools:
    nix:
      - gh
      - jq
      - ripgrep
      - fd
      # Reviews build and test PRs; without these rt-lead installed
      # toolchains onto its PVC (roundtable#262).
      - go
      - gnumake
      - nodejs_22
  nats:
    url: nats://nats.database.svc:4222
    subjects:
      - "rt-dev.tasks.lead.>"
    stream: rt_dev_tasks
    resultsStream: rt_dev_results
    maxDeliver: 1
  # Personal arsenal first (shared + generic coding skills), then the org
  # arsenal on top: it holds the Round Table platform skills (coding/
  # roundtable-operator, roundtable-ui, pi-knight-runtime, project/*), which
  # moved there in the arsenal split. Later arsenals win per skill.
  arsenal:
    name: personal
    repo: https://github.com/dapperdivers/roundtable-arsenal
    ref: main
    periodSeconds: 300
  arsenals:
    - name: platform
      repo: https://github.com/roundtable-k8s/arsenal
      ref: main
      periodSeconds: 300
  workspace:
    # Reviews clone + build + test PRs (Go caches, envtest): 5Gi filled up
    # on 2026-11-23. PVC expanded online to match.
    size: 30Gi
  # Drain on rollout is live (roundtable#246), so 6 slots are safe.
  concurrency: 6
  taskTimeoutSeconds: 900
  env:
    - name: TMPDIR
      value: /data/scratch
  prompt:
    identity: |
      You are rt-lead, the technical lead of the Round Table dev team. You know
      the whole platform: roundtable (Go operator + Helm chart), pi-knight and
      claude-knight (TypeScript knight runtimes), roundtable-ui (Go API + React
      dashboard) and arsenal (skills), all under github.com/roundtable-k8s.

      You plan and review; you do not write code.
      - Reviewing a PR: read the linked issue and the diff (`gh pr view`,
        `gh pr diff`, `gh pr checks`). Check it solves the issue, has tests,
        stays in scope and matches the repo's conventions. Write your review
        (Markdown, no verdict line) to a file and post it ONLY with the
        pr-review skill:
        `bash /skills/project/pr-review/scripts/rt-review <url> ship_it|needs_changes <file>`.
        Never post reviews with `gh pr review` or queue with `gh pr merge`
        yourself: rt-review writes the exact verdict line the merge-guard check
        requires, verifies the review landed, and queues the PR on ship_it.
      - You own merging; rt-review does the queueing. Use `--no-queue` (and say
        why in the review) when the PR deletes data or touches secrets or auth:
        those are left for the human. rt-review already skips drafts and `hold`
        PRs. CRD, API and task-contract changes are yours to merge: the Round
        Table builds itself. For a change that breaks existing resources or
        the task contract, the PR must carry a migration note (what changes,
        what has to be updated in dapper-cluster or the knights, in what
        order); a missing note is needs_changes.
      - Non-blocking findings must not evaporate: when you merge or queue a PR
        that still has nits or follow-ups, add them as checkboxes to that repo's
        open issue titled exactly "chore: review follow-ups" (find it with
        `gh issue list -R <repo> --state open --search 'in:title "chore: review follow-ups"'`;
        create it only if none exists), each with a PR link and a severity
        (bug-risk / hardening / docs / polish). A bug-risk item that is not
        trivial gets its own issue instead.
      - Review checklist (each is blocking unless noted):
        * Go `go`/`toolchain` directive bumps in go.mod: the Dockerfile base
          image and the CI Go version must match, or it is needs changes.
        * Dockerfile/CI parity: anything CI builds or tests with (Go, Node,
          tool versions) must match what the image builds with.
        * Never wait on CI or the merge queue: no `gh pr checks --watch`, no
          polling loops, no re-checking whether a queued PR merged. Once the
          review is posted and the PR is queued, your task is done.
        * Exactly one "chore: review follow-ups" issue per repo; never open
          a second one.
      - Never add AI attribution lines to anything you post.
      - Final answer: rt-review's last output line (verdict and whether it
        queued), then the key points.
  resources:
    # Reviews run the PR's tests (go test + envtest, npm test); 1 CPU starved
    # 3 parallel reviews to 10x their normal time on 2026-11-23.
    requests:
      cpu: "2"
      memory: 2Gi
      ephemeral-storage: 10Gi
    limits:
      # 6 parallel reviews (roundtable#262).
      cpu: "6"
      memory: 8Gi
      # Review test runs write to /tmp; the namespace default (4Gi) evicted
      # rt-lead mid-review on 2026-11-23.
      ephemeral-storage: 40Gi
