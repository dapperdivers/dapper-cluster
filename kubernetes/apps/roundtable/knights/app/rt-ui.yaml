# Round Table dev team: roundtable-ui specialist on claude-knight (Claude Code CLI,
# subscription). GitHub token comes from the roundtable-dev table (spec.github).
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/ai.roundtable.io/knight_v1alpha1.json
---
apiVersion: ai.roundtable.io/v1alpha1
kind: Knight
metadata:
  name: rt-ui
  namespace: roundtable
  labels:
    ai.roundtable.io/table: roundtable-dev
    ai.roundtable.io/round-table: roundtable-dev
spec:
  # claude-knight built from the roundtable-k8s/knights monorepo @ 640a55f (shared
  # knight-core). First claude-knight on the monorepo image; rt-operator and
  # rt-lead follow one at a time. Previous image: 299448cd (old claude-knight repo).
  image: ghcr.io/roundtable-k8s/claude-knight:56e5f552c9d67817abc23a3430cf2b9309d2c1a9
  domain: frontend
  # Isolated (roundtable-k8s/roundtable#387): gVisor sandbox plus default-deny
  # egress. The operator adds NATS, DNS, the Kubernetes API, the model
  # providers and the arsenal git hosts; these are the extra hosts for GitHub,
  # npm and Go modules (same list as rt-coder). Third attempt: the two runtime
  # bugs that made the first two fail are fixed in the image
  # (roundtable-k8s/knights#76 lost-task report, #78 start-up mise install).
  runtimeClassName: gvisor
  egress:
    allowedHosts:
      - github.com
      - api.github.com
      - codeload.github.com
      - "*.githubusercontent.com"
      - registry.npmjs.org
      - proxy.golang.org
      - sum.golang.org
      - storage.googleapis.com
  model: sonnet
  skills:
    - shared
    - coding
  tools:
    nix:
      - gh
      - go
      - gnumake
      - nodejs_22
      - jq
      - ripgrep
      - fd
  nats:
    url: nats://nats.database.svc:4222
    subjects:
      - "rt-dev.tasks.frontend.>"
    stream: rt_dev_tasks
    resultsStream: rt_dev_results
    maxDeliver: 1
  # Personal arsenal first (shared + generic coding skills), then the org
  # arsenal on top: it holds the Round Table platform skills (coding/
  # roundtable-operator, roundtable-ui, pi-knight-runtime, project/*), which
  # moved there in the arsenal split. Later arsenals win per skill.
  arsenals:
    - name: personal
      repo: https://github.com/dapperdivers/roundtable-arsenal
      ref: main
      periodSeconds: 300
    - name: platform
      repo: https://github.com/roundtable-k8s/arsenal
      ref: main
      periodSeconds: 300
  workspace:
    mode: ephemeral
    size: 20Gi
  # Parallel tasks in one pod (per-task workdir, claude-knight#10; pull-when-free, #13).
  concurrency: 2
  # KEDA scales 1..3 pods on JetStream lag (roundtable#221); pods pull only
  # into free slots, so lag is real backlog. Ephemeral per-pod workspace
  # (fresh clone per task anyway).
  replicas: 1
  maxReplicas: 6
  # 3 parallel tasks of Go builds + envtest: request more than a small node
  # (5950m allocatable) so the scheduler places coders on the 16-core nodes.
  resources:
    # ephemeral-storage covers the emptyDir workspace + /tmp: the namespace
    # LimitRange default (4Gi) evicted rt-operator mid-envtest on 2026-11-23.
    requests:
      # 1 CPU each. Coders idle under half a CPU and burst to the limit. Since
      # isolation they only fit on the three gVisor nodes (large-1/2/3), and at
      # 2 CPU each three of six rt-ui pods sat Pending on 2026-11-25. Placement
      # on the large nodes now comes from the gvisor RuntimeClass, not from a
      # big request.
      cpu: "1"
      memory: 6Gi
      ephemeral-storage: 10Gi
    limits:
      cpu: "12"
      memory: 16Gi
      ephemeral-storage: 40Gi
  taskTimeoutSeconds: 2700
  envFrom:
    - secretRef:
        name: claude-setup-token # CLAUDE_CODE_OAUTH_TOKEN
  env:
    - name: CLAUDE_AUTH_MODE
      value: subscription
    # Wide open (2026-11-24): no knight-side reserve. The plan's own limit still
    # applies; a limit refusal defers the step until reset (roundtable#321).
    - name: CLAUDE_PLAN_RESERVE
      value: "1"
    - name: CLAUDE_EFFORT
      value: medium
    - name: TMPDIR
      value: /data/scratch
    - name: XDG_CACHE_HOME
      value: /data/scratch/.cache
    # Keep Go module + lint caches on the PVC (shared across parallel tasks,
    # survives restarts, off the 4Gi ephemeral-storage limit).
    - name: GOMODCACHE
      value: /data/scratch/go/mod
    - name: GOLANGCI_LINT_CACHE
      value: /data/scratch/.cache/golangci-lint
    - name: GOFLAGS
      value: -modcacherw
  prompt:
    identity: |
      You are rt-ui, the dashboard specialist of the Round Table dev team.
      You own **roundtable-k8s/roundtable-ui**: a Go API server (api/) and a
      React + TypeScript + Vite + Tailwind frontend (ui/) that shows the knight
      fleet, chains and missions over REST and WebSocket.

      Working rules (all repos):
      - Read the repo's AGENTS.md / README first and follow its build and test commands.
      - Work in a fresh partial clone under your task's working directory
        (`git clone --filter=blob:none https://github.com/<owner>/<repo>`; fast,
        blobs are fetched on demand). Branch from origin/main as
        rt/<issue-number>-<short-slug>. Never push to main (it is protected anyway).
      - Keep the change small and focused on the issue. Add or update tests.
      - Build and test before every push. If tests fail and you can't fix them, say so.
      - Conventional commits matching `git log --oneline -5`.
      - Open the PR with `gh pr create`, body ending "Closes #<n>". NEVER merge.
      - NEVER add Co-Authored-By trailers, "Generated with" footers or any AI
        attribution to commits or PRs.
      - Your final answer: the PR URL, what changed, test results, and anything
        you were unsure about.

      Git identity (set in each clone):
        git config user.name "Round Table"
        git config user.email "186783191+dunce-bot[bot]@users.noreply.github.com"
