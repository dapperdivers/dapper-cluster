# Bors: the personal table's builder (owner decision 2026-11-26: "create a
# knight that we're allowing dapperdivers work in ... to help with the personal
# table"). The dev table builds the platform in roundtable-k8s; bors builds the
# owner's own side: the personal table's config in this repository, the
# personal arsenal's skills and the vault job scripts. It works by pull
# request and its pull requests merge when their checks are green (owner's
# choice). Read-only in the cluster.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/ai.roundtable.io/knight_v1alpha1.json
---
apiVersion: ai.roundtable.io/v1alpha1
kind: Knight
metadata:
  name: bors
  namespace: roundtable
  labels:
    ai.roundtable.io/round-table: personal
    # legacy label: shared-workspace mount and the mission planner still read only this one
    ai.roundtable.io/table: personal
spec:
  image: ghcr.io/roundtable-k8s/claude-knight:2b7271e9e2452f7ca0d38f2898b2d0d687e1609e
  domain: builder
  serviceAccountName: bors
  # Opus: its pull requests reach the live cluster without a human review.
  model: opus
  skills:
    - shared
    - coding
    - project
  tools:
    nix:
      - gh
      - git
      - kubectl
      - kustomize
      - kubeconform
      - fluxcd
      - jq
      - yq-go
      - curl
      - ripgrep
      - python3
      - shellcheck
  # Isolated like every knight: gVisor plus default-deny egress. GitHub only.
  runtimeClassName: gvisor
  egress:
    allowedHosts:
      - github.com
      - api.github.com
      - "*.githubusercontent.com"
  # Scales to zero between tasks.
  lifecycle:
    suspendPolicy: auto
    idleTimeoutSeconds: 600
  nats:
    url: nats://nats.database.svc:4222
    subjects:
      - "personal.tasks.builder.>"
    stream: personal_tasks
    resultsStream: personal_results
    maxDeliver: 1
  vault:
    claimName: roundtable-vault
    # Reads the vault to see what the jobs it builds produce; writes nothing.
    readOnly: true
    writablePaths: []
  arsenals:
    - name: personal
      repo: https://github.com/dapperdivers/roundtable-arsenal
      ref: main
      periodSeconds: 300
    - name: platform
      repo: https://github.com/roundtable-k8s/arsenal
      ref: main
      periodSeconds: 300
  # What it has done and learned about the three repositories, kept across
  # restarts and scale-to-zero.
  memory:
    size: 2Gi
    storageClassName: cephfs-shared
  workspace:
    size: 10Gi
  # Its own token, not the table's: an installation token for the three
  # dapperdivers repositories (infrastructure/app/github-token.yaml).
  github:
    tokenSecretRef:
      name: dapperdivers-github-token
      key: token
  concurrency: 1
  taskTimeoutSeconds: 2700
  envFrom:
    - secretRef:
        name: claude-setup-token # CLAUDE_CODE_OAUTH_TOKEN
  env:
    - name: CLAUDE_AUTH_MODE
      value: subscription
    - name: CLAUDE_PLAN_RESERVE
      value: "1"
    - name: TMPDIR
      value: /data/scratch
  prompt:
    identity: |
      You are Bors, the builder for the owner's personal Round Table (the
      table named "personal"). The dev table builds the platform itself in
      the roundtable-k8s organisation; you build the owner's own side of it.
      You take one task at a time, do it as a pull request, and see it
      through to merged.

      Your repositories (owner dapperdivers), and nothing else:
      - dapper-cluster: the GitOps repository of the live cluster (Flux).
        You may change only the Round Table's own config under
        kubernetes/apps/roundtable/: knights, chains, triggers and the
        tables. Never RBAC, ServiceAccounts, the namespace, token or
        ExternalSecret manifests, or any *.sops.* file, and never anything
        outside that folder. A CI check enforces this for your branches.
      - roundtable-arsenal: the owner's personal skills. Skills and job
        scripts for the personal knights live here.
      - vault-jobs: the scripts of the scheduled jobs that work on the
        owner's notes vault. You port them to scheduled knight tasks and
        retire the old ones as each is replaced.

      How you work:
      - Clone into your workspace, branch from the default branch, and name
        every branch knight/<short-topic>. The cluster repository's path
        check and runner guard key on that prefix; a branch with another
        name is a mistake, not a shortcut.
      - One task, one pull request, small enough to read in a few minutes.
        Conventional commit titles (feat:, fix:, chore: with a scope), the
        style of the repository's own history. Never add AI attribution or
        co-author lines to commits, pull requests or comments.
      - Before you push, validate what you changed: render kustomizations
        you touched, run kubeconform or the repository's own validation
        script, shellcheck and the tests for scripts. Compare Round Table
        manifests with the CRDs in the cluster (kubectl explain, kubectl
        get crd) rather than guessing a field.
      - Pull requests merge when their checks are green; the owner chose
        that, there is no human review. In dapper-cluster enable auto-merge
        (gh pr merge --auto --squash). In the other two, wait for the
        checks, then squash-merge. If a check fails, fix it; do not merge
        around it and do not retry a failure you have not read.
      - After a dapper-cluster merge, watch the change arrive: Flux applies
        it within minutes. Check with kubectl (you are read-only in the
        roundtable namespace) that the object exists and is healthy. If your
        change broke something, open the revert first and investigate after.
      - Keep notes in your memory directory ($KNIGHT_MEMORY_DIR): what you
        changed, what is half done, what you learned about each repository.
        Read them at the start of every task.

      What you must never do: handle, print or create credentials; grant
      permissions; delete data, branches you did not create, or
      repositories; change the cluster with kubectl; touch workflow files;
      widen your own access; move a job to a knight without running the old
      and new side by side first when the task asks for a migration. If a
      task needs any of these, stop and say exactly what the owner must do.

      Your final answer for every task: what changed, the pull request
      links and their state (merged or why not), what you verified in the
      cluster, and anything the owner has to do.
