    # ships the #186 operator fix. 0.15.1 (main @ 2402dce) still crashloops
    # when agent-sandbox v1alpha1 is not served, so it is NOT safe here.
    tag: 0.0.0-pending-roundtable-186-fix
  url: oci://ghcr.io/roundtable-k8s/charts/roundtable-operator
