# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: roundtable-operator
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: roundtable-operator
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      strategy: rollback
      retries: 3
  values:
    # Images are pinned by full git SHA (immutable tags) from the
    # roundtable-k8s org registry.
    # Operator = main @ c379524 (roundtable-k8s/roundtable#206: tools image
    # builds use the prebuilt ghcr.io/roundtable-k8s/tools-builder image; #204
    # chain run-now/retry-failed annotations; #203: shared Nix store
    # removed; #202: rebuild a tools image the registry lost; #201: RoundTable
    # spec.secrets for standing knights; includes #200, #196 per-knight tools
    # images, #195 GitHub token file and #190): the Knight
    # controller only watches Sandbox when discovery shows the kind is
    # served. Earlier builds crashloop without agent-sandbox v1alpha1 (#186).
    image:
      repository: ghcr.io/roundtable-k8s/roundtable
      tag: 99a266898ae6faf9fc5d5533198bf696a63c597b
      pullPolicy: IfNotPresent
    # agent-sandbox is not installed here (returns in M2, #163): run
    # Deployment-only and skip discovery.
    sandboxBackend: "false"
    # KEDA's JetStream scaler reads /jsz on the monitoring port; the `nats`
    # Service only exposes 4222, so point it at the headless service.
    natsMonitoringEndpoint: nats-headless.database.svc:8222
    images:
      piKnight:
        repository: ghcr.io/roundtable-k8s/pi-knight
        tag: 9dd65f564517d0fb140e528cb4192718a264ec32
      dashboard:
        repository: ghcr.io/roundtable-k8s/roundtable-ui
        tag: 758a2388681dbbb86105e389d3defa90cab83af9

    # Operator manager. The chart default memory limit is 128Mi; the old
    # deployment ran with 256Mi. Pending the crashloop investigation
    # (roundtable-k8s/roundtable#186), tune here.
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

    # Completion webhooks (spec.notify) stay disabled: the OpenClaw (molt)
    # receiver was dropped in #4736. An empty list rejects every notify URL.
    notify:
      allowedURLPrefixes: []

    # Per-knight tools images: for each unique spec.tools.nix list the operator
    # runs a one-off Job that builds an OCI image with nix2container and pushes
    # it to the in-cluster zot registry (../../registry); the knight mounts it
    # read-only at /nix as an image volume. Nodes pull through the internal
    # gateway (TLS); the build Job pushes to the Service over plain HTTP.
    toolsImage:
      repository: registry.${SECRET_DOMAIN}/knight-tools
      pushRepository: roundtable-registry.roundtable.svc.cluster.local:5000/knight-tools
      pushInsecure: true

    # Closed loop (roundtable-k8s/roundtable#264): the PR pipeline Chain that
    # issue pickup on roundtable-dev copies for every rt:ready issue. rt-lead
    # plans, reviews and merges; the planner picks a coder and a model tier.
    # Model tiering per #263: cheap drafts first, escalate to fast/deep.
    prPipeline:
      enabled: true
      roundTableRef:
        name: roundtable-dev
      lead: rt-lead
      coders:
        - rt-operator
        - rt-ui
      implementModels:
        - cheap
        - fast
        - deep
      # Fix rounds on Sonnet: stronger than a Haiku draft, cheaper than Opus.
      fixModel: fast
      maxIterations: 3
      # Failure feedback (#226): a red CI run or a merge-queue rejection of a
      # knight PR goes back to its author knight; RoundTable spec.prFeedback
      # switches the watcher on.
      feedback:
        enabled: true

    # Built-in planner knight (Deployment runtime backend, the operator default).
    planner:
      enabled: true
      domain: operator
      model: openrouter/z-ai/glm-5.3
      skills:
        - operator
        - shared
      natsPrefix: fleet-a
      concurrency: 1
      taskTimeoutSeconds: 600
      arsenal:
        repo: https://github.com/roundtable-k8s/arsenal.git
        ref: main
        periodSeconds: 300
      # dunce-bot installation token (narrowed scopes), mounted as a refreshing
      # file; see infrastructure/app/github-token.yaml (roundtable-k8s/roundtable#194).
      github:
        tokenSecretRef:
          name: roundtable-github-token
          key: token
      envFrom:
        - secretRef:
            name: roundtable-secret

    # Round Table UI, exposed on the internal gateway by httproute.yaml.
    dashboard:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
      vault:
        enabled: true
        claimName: roundtable-vault
