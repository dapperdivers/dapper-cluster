# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: roundtable-operator
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: roundtable-operator
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      strategy: rollback
      retries: 3
  values:
    # Images are pinned by full git SHA (immutable tags) from the
    # roundtable-k8s org registry.
    # Operator = main @ 0167ba9 (roundtable-k8s/roundtable#196: per-knight tools
    # images; includes #195 GitHub token file and #190): the Knight
    # controller only watches Sandbox when discovery shows the kind is
    # served. Earlier builds crashloop without agent-sandbox v1alpha1 (#186).
    image:
      repository: ghcr.io/roundtable-k8s/roundtable
      tag: 0167ba9ce960267722cf89d80837f5ce55dd5503
      pullPolicy: IfNotPresent
    # agent-sandbox is not installed here (returns in M2, #163): run
    # Deployment-only and skip discovery.
    sandboxBackend: "false"
    images:
      # pi-knight main @ 445d8d8 (pi-knight#49: GITHUB_TOKEN_FILE credential helper + gh shim).
      piKnight:
        repository: ghcr.io/roundtable-k8s/pi-knight
        tag: 445d8d890c24b1964dd30a237a7bc84dbccdb549
      dashboard:
        repository: ghcr.io/roundtable-k8s/roundtable-ui
        tag: 24615ccda6af6136eb81ee07e535c00bd73095a5

    # Operator manager. The chart default memory limit is 128Mi; the old
    # deployment ran with 256Mi. Pending the crashloop investigation
    # (roundtable-k8s/roundtable#186), tune here.
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

    # Completion webhooks (spec.notify) stay disabled: the OpenClaw (molt)
    # receiver was dropped in #4736. An empty list rejects every notify URL.
    notify:
      allowedURLPrefixes: []

    # Per-knight tools images: for each unique spec.tools.nix list the operator
    # runs a one-off Job that builds an OCI image with nix2container and pushes
    # it to the in-cluster zot registry (../../registry); the knight mounts it
    # read-only at /nix as an image volume. Nodes pull through the internal
    # gateway (TLS); the build Job pushes to the Service over plain HTTP.
    toolsImage:
      repository: registry.${SECRET_DOMAIN}/knight-tools
      pushRepository: roundtable-registry.roundtable.svc.cluster.local:5000/knight-tools
      pushInsecure: true

    # The shared-store nix-daemon builder is superseded by toolsImage. Its two
    # PVCs (nix-store, nix-buildqueue) are still declared next to this file and
    # go away in a follow-up once tools images are proven here.
    nixBuilder:
      enabled: false

    # Built-in planner knight (Deployment runtime backend, the operator default).
    planner:
      enabled: true
      domain: operator
      model: openrouter/moonshotai/kimi-k2.6:exacto
      skills:
        - operator
        - shared
      natsPrefix: fleet-a
      concurrency: 1
      taskTimeout: 600
      arsenal:
        repo: https://github.com/roundtable-k8s/arsenal.git
        ref: main
        period: 5m
      # dunce-bot installation token (narrowed scopes), mounted as a refreshing
      # file; see infrastructure/app/github-token.yaml (roundtable-k8s/roundtable#194).
      github:
        tokenSecretRef:
          name: roundtable-github-token
          key: token
      envFrom:
        - secretRef:
            name: roundtable-secret

    # Round Table UI, exposed on the internal gateway by httproute.yaml.
    dashboard:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
      vault:
        enabled: true
        claimName: roundtable-vault
