---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: roundtable
components:
  - ../../flux/components/common
resources:
  - ./namespace.yaml
  - ./infrastructure/ks.yaml # RBAC, secret, limitrange, monitoring, vault PV/PVC, workspace PVC
  - ./registry/ks.yaml # zot: in-cluster OCI registry for per-knight tools images
  - ./operator/ks.yaml # Round Table operator + dashboard (Deployment backend only)
  # agent-sandbox comes back in M2 (roundtable-k8s/roundtable#95, #163).
  - ./knights/ks.yaml # Knights (first: galahad on claude-knight, #187)
