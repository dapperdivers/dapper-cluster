---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
# Metric names follow the roundtable_knight_* scheme (roundtable-k8s/knights#33):
# every series carries table, knight and runtime. Subscription-billed (Claude
# plan) cost is notional, so the spend alert counts API-billed models only.
# Night Watch alert surface: these rules double as the watchman knight's
# query menu — it reads ALERTS{namespace="roundtable"} during the nightly sweep.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: roundtable
  namespace: roundtable
spec:
  groups:
    - name: roundtable.knights
      rules:
        - alert: KnightTaskFailures
          annotations:
            summary: >-
              Knight {{ $labels.knight }} failed {{ $value }} tasks in the last hour.
          expr: |
            sum by (namespace, knight) (increase(roundtable_knight_tasks_total{status=~"error|timeout"}[1h])) > 2
          for: 5m
          labels:
            severity: warning
        - alert: KnightNatsDisconnected
          annotations:
            summary: >-
              Knight {{ $labels.knight }} has lost its NATS connection.
          expr: |
            roundtable_knight_nats_connected == 0
          for: 10m
          labels:
            severity: warning
        - alert: KnightMetricsAbsent
          annotations:
            summary: >-
              No knight metrics are being scraped — PodMonitor or knights are down.
          expr: |
            absent(roundtable_knight_nats_connected)
          for: 30m
          labels:
            severity: warning
        - alert: KnightTaskLost
          annotations:
            summary: >-
              Knight {{ $labels.knight }} lost {{ $value }} tasks in the last hour
              (delivered to a knight that stopped before finishing).
          expr: |
            sum by (namespace, knight) (increase(roundtable_knight_tasks_total{status="lost"}[1h])) > 0
          labels:
            severity: warning
        - alert: KnightLLMCostSpike
          annotations:
            summary: >-
              Fleet LLM spend rose {{ $value | humanize }} USD in 24h — above
              the Night Watch budget envelope; possible runaway loop.
          expr: |
            sum(increase(roundtable_knight_llm_cost_usd_total{billing!="subscription"}[24h])) > 15
          for: 15m
          labels:
            # Spend overshoot is an act-today problem (review/suspend knights),
            # not a wake-up; hard budget enforcement belongs in Night Watch itself.
            severity: warning
    - name: roundtable.pods
      rules:
        - alert: RoundtablePodRestarting
          annotations:
            summary: >-
              {{ $labels.pod }} restarted {{ $value }} times in the last hour.
          expr: |
            sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total{namespace="roundtable"}[1h])) > 3
          for: 5m
          labels:
            severity: warning
        - alert: RoundtablePodOOMKilled
          annotations:
            summary: >-
              {{ $labels.pod }}/{{ $labels.container }} was OOMKilled in the last hour.
          expr: |
            max_over_time(kube_pod_container_status_last_terminated_reason{namespace="roundtable", reason="OOMKilled"}[1h]) == 1
          labels:
            severity: warning
        - alert: RoundtablePodEvicted
          annotations:
            summary: >-
              {{ $labels.pod }} was evicted (usually ephemeral-storage over its limit).
          expr: |
            max by (namespace, pod) (kube_pod_status_reason{namespace="roundtable", reason="Evicted"}) > 0
          labels:
            severity: warning
        - alert: RoundtablePVCAlmostFull
          annotations:
            summary: >-
              PVC {{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full.
          expr: |
            max by (namespace, persistentvolumeclaim) (
              kubelet_volume_stats_used_bytes{namespace="roundtable"}
              / kubelet_volume_stats_capacity_bytes{namespace="roundtable"}
            ) > 0.85
          for: 10m
          labels:
            severity: warning
    - name: roundtable.scaling
      rules:
        - alert: RoundtableKedaScalerErrors
          annotations:
            summary: >-
              KEDA ScaledObject {{ $labels.scaledObject }} reported {{ $value }} scaler errors in 15m.
          expr: |
            sum by (exported_namespace, scaledObject) (increase(keda_scaled_object_errors_total{exported_namespace="roundtable"}[15m])) > 0
          for: 5m
          labels:
            severity: warning
        - alert: RoundtableHPAScalingInactive
          annotations:
            summary: >-
              HPA {{ $labels.horizontalpodautoscaler }} cannot read its metric
              (ScalingActive=false, e.g. FailedGetExternalMetric) while it has
              pods. A knight scaled to zero by KEDA also reports
              ScalingActive=false (ScalingDisabled); that is expected and excluded.
          expr: |
            kube_horizontalpodautoscaler_status_condition{namespace="roundtable", condition="ScalingActive", status="false"} == 1
            and on (namespace, horizontalpodautoscaler)
            kube_horizontalpodautoscaler_status_current_replicas{namespace="roundtable"} > 0
          for: 15m
          labels:
            severity: warning
