# GitHub access for Round Table knights via the dunce-bot GitHub App
# (roundtable-k8s/roundtable#187). ESO mints short-lived installation tokens
# (1h) with permissions narrowed below the app's own: no `workflows` or
# `pages`, so a prompt-injected knight cannot push workflow changes that would
# run with repo secrets. Only the roundtable-k8s repos listed below.
#
# The token lands in its own Secret, refreshed every 30m. Knights must read it
# as a mounted FILE (which updates in place), not as env (env is frozen at pod
# start and the token expires after an hour); see roundtable-k8s/roundtable#194.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dunce-bot-key
  namespace: roundtable
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: dunce-bot-key
    template:
      engineVersion: v2
      data:
        privateKey: "{{ .DUNCE_BOT_APP_PRIVATE_KEY }}"
  dataFrom:
    - find:
        name:
          regexp: ^DUNCE_BOT_APP_PRIVATE_KEY$
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/generators.external-secrets.io/githubaccesstoken_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: dunce-bot-roundtable
  namespace: roundtable
spec:
  # dunce-bot app and its installation on the roundtable-k8s org (not secret).
  appID: "1040936"
  installID: "184814865"
  repositories:
    - roundtable
    # Knight runtimes monorepo (pi-knight, claude-knight, core). The two old
    # repos were archived on 2026-11-26 (roundtable-k8s/knights#1).
    - knights
    - roundtable-ui
    - arsenal
  permissions:
    contents: write
    pull_requests: write
    issues: write
    metadata: read
    # TRIAL, owner decision 2026-11-25: "Let the knights tinker with the
    # workflows for a limited time so we can iron things out." The knights
    # could not add or fix CI checks (a kind-based test, the real-NATS job),
    # so every such issue escalated to the owner. REMOVE this line again by
    # 2026-11-28 unless the owner extends it; the risk it reopens is the one
    # in the header: a workflow pushed to a branch runs with repo secrets.
    workflows: write
  auth:
    privateKey:
      secretRef:
        name: dunce-bot-key
        key: privateKey
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: roundtable-github-token
  namespace: roundtable
spec:
  refreshInterval: 30m
  target:
    name: roundtable-github-token
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: dunce-bot-roundtable
---
# Token for knight pull requests in dapperdivers/dapper-cluster
# (roundtable-k8s/roundtable#288, owner decision 2026-11-26). Same app, but the
# installation on the dapperdivers account, narrowed to this one repository and
# to contents and pull requests: no `workflows`, no `issues`.
# Knights share dunce-bot's identity with Renovate and autodeploy, so the path
# limit in .github/workflows/ci.yaml ("Round Table - Knight PR Paths") rests on
# knights using `knight/` branches: the owner accepted that on trust.
# Nothing mounts this yet: the knights need a second token file for another
# owner first (roundtable-k8s/roundtable, tracked from #288).
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: dunce-bot-dapper-cluster
  namespace: roundtable
spec:
  appID: "1040936"
  installID: "56558271"
  repositories:
    - dapper-cluster
  permissions:
    contents: write
    pull_requests: write
    metadata: read
  auth:
    privateKey:
      secretRef:
        name: dunce-bot-key
        key: privateKey
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dapper-cluster-github-token
  namespace: roundtable
spec:
  refreshInterval: 30m
  target:
    name: dapper-cluster-github-token
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: dunce-bot-dapper-cluster
---
# Token for bors, the personal table's own builder (owner decision 2026-11-26:
# "create a knight that we're allowing dapperdivers work in"). Same app and
# installation as dunce-bot-dapper-cluster, for the three repositories the
# owner named: the cluster repo, the personal arsenal and the vault jobs.
# Contents and pull requests only: no `workflows`, no `issues`.
# Only the Knight bors mounts it (spec.github.tokenSecretRef on the knight).
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: dunce-bot-dapperdivers
  namespace: roundtable
spec:
  appID: "1040936"
  installID: "56558271"
  repositories:
    - dapper-cluster
    - roundtable-arsenal
    - vault-jobs
  permissions:
    contents: write
    pull_requests: write
    metadata: read
  auth:
    privateKey:
      secretRef:
        name: dunce-bot-key
        key: privateKey
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dapperdivers-github-token
  namespace: roundtable
spec:
  refreshInterval: 30m
  target:
    name: dapperdivers-github-token
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: dunce-bot-dapperdivers
