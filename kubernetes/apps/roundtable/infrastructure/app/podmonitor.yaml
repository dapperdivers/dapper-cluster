---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/podmonitor_v1.json
# Scrape pi-knight runtime metrics (roundtable_knight_tasks_total, roundtable_knight_llm_cost_usd_total, ...)
# Knight pods are operator-managed and declare no container ports, so
# `portNumber` matched nothing (the operator keeps only targets whose declared
# port is 3000): KnightMetricsAbsent fired. Scrape podIP:3000 directly instead.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: knights
  namespace: roundtable
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: knight
  podMetricsEndpoints:
    - path: /metrics
      interval: 1m
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_ip]
          targetLabel: __address__
          replacement: $1:3000
        # A pod with no declared ports yields one target per container; keep
        # only the knight runtime container.
        - sourceLabels: [__meta_kubernetes_pod_container_name]
          regex: app
          action: keep
