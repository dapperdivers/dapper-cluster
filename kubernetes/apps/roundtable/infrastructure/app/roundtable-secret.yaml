# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: roundtable
  namespace: roundtable
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: roundtable-secret
    template:
      engineVersion: v2
      # OPENROUTER_API_KEY is required (the planner and default knights use
      # OpenRouter), so a missing key fails loudly. The rest are optional: `index`
      # yields an empty value instead of failing the whole template. Since the
      # 2026-11-22 redeploy, OPENCLAW_ANTHROPIC_API_KEY no longer exists in Infisical
      # (OpenClaw moved off Anthropic), and one missing key was blocking the entire
      # secret. GitHub access is the scoped dunce-bot token file (github-token.yaml,
      # roundtable-k8s/roundtable#194); the old GAWAIN_GITHUB_TOKEN PAT is gone.
      data:
        OPENROUTER_API_KEY: "{{ .OPENROUTER_API_KEY }}"
        ANTHROPIC_API_KEY: '{{ index . "OPENCLAW_ANTHROPIC_API_KEY" | default "" }}'
        OPENAI_API_KEY: '{{ index . "LITELLM_API_KEY" | default "" }}'
  dataFrom:
    - find:
        name:
          regexp: ^(OPENCLAW|LITELLM_(MASTER|API)|OPENROUTER_API_KEY).*
