# bors (the personal table's builder) reads Round Table objects, pods, logs
# and events in this namespace, with the same read-only Role as merlin. It
# changes nothing in the cluster directly: its changes are pull requests.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bors
  namespace: roundtable
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bors-read-only
  namespace: roundtable
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: merlin-read-only
subjects:
  - kind: ServiceAccount
    name: bors
    namespace: roundtable
