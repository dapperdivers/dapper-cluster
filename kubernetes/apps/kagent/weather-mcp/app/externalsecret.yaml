---
# The bearer token is generated in the cluster, once: refreshInterval "0" means the
# ExternalSecret never asks the generator again, so the value stays put. Nothing outside the
# cluster needs it (the pod and the RemoteMCPServer both read this Secret), so it is not
# stored in Infisical; a rebuilt cluster simply gets a new one.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: weather-mcp-token
spec:
  length: 48
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: weather-mcp
spec:
  refreshInterval: "0"
  target:
    name: weather-mcp-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # the server requires it on every /mcp request
        MCP_AUTH_TOKEN: "{{ .password }}"
        # sent by the weather RemoteMCPServer
        Authorization: "Bearer {{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: weather-mcp-token
---
# NASA's APIs take an api.data.gov key, which is what GSA_API_KEY is. Only the asteroid
# list uses it; the pod treats this Secret as optional.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: weather-mcp-keys
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: weather-mcp-keys
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        NASA_API_KEY: "{{ .GSA_API_KEY }}"
  dataFrom:
    - find:
        name:
          regexp: ^GSA_API_KEY$
