---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: weather-mcp
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      weather-mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            # US forecast, weather alerts and tonight's sky for a point (NWS, NOAA space
            # weather, CelesTrak, NASA; planets and ISS passes are computed in the pod).
            # The code lives in github.com/dapperdivers/mcp-servers: one image for all the
            # custom tool servers, the argument picks which one runs. Serves MCP Streamable
            # HTTP at /mcp (bearer token required) and /healthz.
            image:
              repository: ghcr.io/dapperdivers/mcp-servers
              tag: 2026.11.24.4@sha256:31f82a4252d65da18bbb7cbcc151d51eee2d7aba3550d81cb659bd7bd64d67b7
            args: [weather]
            env:
              TZ: ${TIME_ZONE}
            # The token is generated in the cluster (see externalsecret.yaml).
            envFrom:
              - secretRef:
                  name: weather-mcp-secret
              # NASA_API_KEY, for the asteroid list (optional: the server falls back to DEMO_KEY).
              - secretRef:
                  name: weather-mcp-keys
                  optional: true
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8000
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
                memory: 160Mi
              limits:
                memory: 384Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: weather-mcp
        ports:
          http:
            port: *port
