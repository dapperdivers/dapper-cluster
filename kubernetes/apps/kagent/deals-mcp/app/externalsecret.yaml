---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: deals-mcp
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: deals-mcp-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      # Merge: the keys found below are kept as they are and the two templated keys are
      # added. Only DEALS_MCP_TOKEN is required. The API keys are optional, so a source is
      # switched on later by creating its key in Infisical and nothing else:
      #   GSA_API_KEY                         free api.data.gov key (without it, the shared DEMO_KEY)
      #   EBAY_CLIENT_ID, EBAY_CLIENT_SECRET  eBay production keyset (App ID, Cert ID); without
      #                                       them ebay_search answers "not configured"
      mergePolicy: Merge
      data:
        # the server requires it on every /mcp request
        MCP_AUTH_TOKEN: "{{ .DEALS_MCP_TOKEN }}"
        # sent by the deals RemoteMCPServer
        Authorization: "Bearer {{ .DEALS_MCP_TOKEN }}"
  dataFrom:
    - find:
        name:
          regexp: ^(DEALS_MCP_TOKEN|GSA_API_KEY|EBAY_CLIENT_ID|EBAY_CLIENT_SECRET)$
