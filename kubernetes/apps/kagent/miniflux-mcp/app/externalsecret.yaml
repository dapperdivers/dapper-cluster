---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: miniflux-mcp
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: miniflux-mcp-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # The reader's own API key (created in the owner's Miniflux account).
        MINIFLUX_API_KEY: "{{ .MINIFLUX_API_KEY }}"
        # Protects the MCP endpoint; separate from the Miniflux key.
        MCP_AUTH_TOKEN: "{{ .MINIFLUX_MCP_TOKEN }}"
        # Sent by the miniflux RemoteMCPServer.
        Authorization: "Bearer {{ .MINIFLUX_MCP_TOKEN }}"
  dataFrom:
    - find:
        name:
          regexp: ^MINIFLUX_(API_KEY|MCP_TOKEN)$
