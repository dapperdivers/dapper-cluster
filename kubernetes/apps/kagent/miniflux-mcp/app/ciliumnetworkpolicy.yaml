---
# The MCP server holds the owner's Miniflux API key, so only kagent may call it and it
# may only reach Miniflux (and DNS).
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: miniflux-mcp
spec:
  description: Miniflux MCP server; callable by kagent and Round Table knights, egress to Miniflux only.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: miniflux-mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: kagent
            app.kubernetes.io/component: controller
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ate-system
            app: atenet-egress
        # Round Table knights (any knight pod; the bearer token is the gate).
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: roundtable
            app.kubernetes.io/name: knight
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEntities:
        - host
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: selfhosted
            app.kubernetes.io/name: miniflux
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
