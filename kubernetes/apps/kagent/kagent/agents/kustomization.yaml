---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Shared pieces any agent can reference: ModelConfigs, Harnesses, EgressPolicies and
  # tool servers (RemoteMCPServers), one file per concern.
  - ./platform
  # One file per agent (its AgentTemplate + Agent only). To add an agent, add a file here.
  - ./claude.yaml
  - ./feeds-digest.yaml
  - ./k8s-reader.yaml
  - ./night-editor.yaml
  - ./nightwatch.yaml
  - ./security-brief.yaml
  # TEMPORARY: remove after the tools-harness test (2026-11-18).
  - ./tools-canary.yaml
  - ./voice-librarian.yaml
