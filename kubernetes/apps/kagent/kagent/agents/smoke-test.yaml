---
# Smallest possible agent: no tools, default (Ollama) model, kagent harness.
# Proves the chain controller -> Substrate -> gVisor worker -> Ollama works.
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: smoke-test
spec:
  description: Smoke test for kagent on local Ollama.
  modelConfig:
    name: default-model-config
  systemPrompt: |-
    You are a terse test agent. Answer in one short sentence.
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: smoke-test
spec:
  template:
    ref:
      name: smoke-test
  harnessRef:
    name: kagent-default
