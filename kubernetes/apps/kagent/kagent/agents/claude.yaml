---
# Claude (Opus 5.5) on the Claude Code runtime, in the gVisor sandbox, on the Claude
# subscription. The setup-token (MOLT_ANTHROPIC_SETUP_TOKEN in Infisical, shared with
# OpenClaw) never enters the sandbox: Claude Code sends "Authorization: Bearer
# <placeholder>" and the egress gateway swaps in the real token (EgressPolicy below).
#
# Undocumented in kagent 1.0.1 (#4777): kagent's own Anthropic path injects x-api-key,
# which Anthropic rejects for subscription tokens. This relies on (1) kagent allowing
# ANTHROPIC_AUTH_TOKEN / ANTHROPIC_CUSTOM_HEADERS in Harness env, (2) Claude Code using
# ANTHROPIC_AUTH_TOKEN over the placeholder API key, (3) the oauth beta header value.
# An update to any of them can break it. Usage counts against the subscription's limits.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: claude-setup-token
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: claude-setup-token
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        CLAUDE_CODE_OAUTH_TOKEN: "{{ .MOLT_ANTHROPIC_SETUP_TOKEN }}"
  dataFrom:
    - find:
        name:
          regexp: ^MOLT_ANTHROPIC_SETUP_TOKEN$
---
# Not a credential: the claude harness insists on an apiKeySecret; this one is never used.
apiVersion: v1
kind: Secret
metadata:
  name: claude-dummy-key
stringData:
  ANTHROPIC_API_KEY: unused-placeholder
---
apiVersion: api.kagent.dev/v1alpha3
kind: EgressPolicy
metadata:
  name: claude-subscription
spec:
  destinations:
    - origin: https://api.anthropic.com
      authentication:
        header: Authorization
        prefix: "Bearer "
        secretKeyRef:
          name: claude-setup-token
          key: CLAUDE_CODE_OAUTH_TOKEN
---
apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata:
  name: claude-opus
spec:
  provider: Anthropic
  model: claude-opus-5-5
  apiKeySecret: claude-dummy-key
  apiKeySecretKey: ANTHROPIC_API_KEY
  anthropic: {}
---
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  # The Claude Code runtime (the chart's `kagent-default` harness is the kagent runtime).
  name: claude-code
spec:
  claude: {}
  env:
    - name: ANTHROPIC_AUTH_TOKEN
      value: placeholder-replaced-at-egress
    - name: ANTHROPIC_CUSTOM_HEADERS
      value: "anthropic-beta: oauth-2025-04-20"
  substrate:
    workerPoolRef:
      name: kagent-default
    snapshotPolicy:
      location: s3://ate-snapshots/kagent/
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: claude
spec:
  description: Research assistant for the vault owner - searches the web, reads pages and the owner's RSS feeds, and knows the Obsidian vault (read-only).
  modelConfig:
    name: claude-opus
  systemPrompt: |-
    You are a research assistant for the owner of a personal knowledge base (an
    Obsidian vault) and a homelab.

    Tools:
    - WebSearch finds current information. Use it whenever the answer depends on
      anything recent or that you are not sure of.
    - The web-fetch tools read a public page as Markdown; long pages come in
      chunks (use start_index). Your own WebFetch tool cannot reach the internet
      from this sandbox, so use web-fetch instead.
    - The vault tools (search_notes, read_note, list_directory, get_frontmatter,
      ...) read the vault. Paths are relative to the vault root. Check the vault
      first when a question is about the owner's own projects, notes or plans, and
      ground your answer in what is already there.

    - The miniflux tools read the owner's RSS reader (get_entries, get_feeds,
      get_categories, ...). Use them for "what's new" and "keeping up" questions;
      they are read-only.

    The vault is read-only to you. When asked to fill in missing information, say
    which note it belongs in and give the text to add, ready to paste.

    Cite sources: link every web fact you rely on, and name vault notes as
    [[wikilinks]]. If you could not verify something, say so; never invent facts,
    versions, dates or quotes.
  # Skills from the roundtable-arsenal, delivered as an OCI image that Substrate mounts
  # read-only before the golden build (github.com/dapperdivers/containers, arsenal-skills;
  # tag = the arsenal commit). Do NOT use git sources here: the harness fetches those
  # inside the sandbox and its golden build crashed (GoldenActorCrashed, 2026-11-18),
  # even with github.com in the EgressPolicy. To publish newer skills, bump
  # ARSENAL_COMMIT in that repo, then the digest below.
  skills:
    - name: obsidian-conventions
      source:
        oci: &arsenal ghcr.io/dapperdivers/arsenal-skills@sha256:18fd9f553c033ab6f6275a56038a2d3b8ae311ac77e3d1b79915d7ec3cf25da7
        path: vault/obsidian-conventions
    - name: zettel-extraction
      source:
        oci: *arsenal
        path: vault/zettel-extraction
    - name: morning-security-brief
      source:
        oci: *arsenal
        path: security/morning-security-brief
    - name: garden-advisor
      source:
        oci: *arsenal
        path: home/garden-advisor
  tools:
    - mcp:
        server:
          kind: RemoteMCPServer
          name: vault
    - mcp:
        server:
          kind: RemoteMCPServer
          name: web-fetch
    # Miniflux serves every API call incl. deletes: bind the read-only subset only.
    - mcp:
        server:
          kind: RemoteMCPServer
          name: miniflux
        tools:
          - get_feeds
          - get_feed
          - get_entries
          - get_entry
          - get_feed_entries
          - get_categories
          - get_category_entries
          - get_category_feeds
          - get_version
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: claude
spec:
  template:
    ref:
      name: claude
  harnessRef:
    name: claude-code
  egressPolicyRefs:
    - name: claude-subscription
