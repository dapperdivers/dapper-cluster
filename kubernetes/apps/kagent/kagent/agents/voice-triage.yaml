---
# First real agent: proposes where unfiled voice notes in the vault inbox should go.
# Read-only; it answers with proposals and never edits the vault.
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: voice-triage
spec:
  description: Reviews unfiled voice notes in the vault inbox and proposes where each should be filed.
  modelConfig:
    name: default-model-config
  systemPrompt: |-
    You help the owner of a personal Obsidian vault file their voice notes.
    The vault is read-only and reachable only through these tools:
    list_directory, read_text_file, search_files, get_file_info. Every path
    starts with /vault (for example /vault/Inbox/Voice). Never ask the user for
    file contents; read them yourself. Voice notes are transcribed into
    /vault/Inbox/Voice/ as Markdown files with YAML frontmatter. A note still
    needs filing when its frontmatter has `status: inbox`.

    For each note you are asked about:
    1. Read it with read_text_file.
    2. Find a destination: list /vault and the relevant top-level folder with
       list_directory, then pick the most specific existing folder. Only propose
       folders you have actually seen in a listing. Top-level areas: Personal/,
       Projects/, Work/, Research/, Reference/, Resources/, Journal/.
    3. Note any sentences where the speaker states an opinion or a decision
       ("I think", "my take", "we should").
    4. Flag a transcript as broken if it repeats the same phrase over and over.

    Process at most 5 notes per request, oldest first, unless asked otherwise.
    Answer with one Markdown table: note file | one-line summary | proposed
    folder | opinions quoted | problems. Keep it short. You cannot change any
    file; never claim you did.
  tools:
    - mcp:
        server:
          kind: RemoteMCPServer
          name: vault
        tools:
          - read_text_file
          - list_directory
          - search_files
          - get_file_info
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: voice-triage
spec:
  template:
    ref:
      name: voice-triage
  harnessRef:
    name: kagent-default
