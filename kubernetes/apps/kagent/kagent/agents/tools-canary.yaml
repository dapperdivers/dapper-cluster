---
# TEMPORARY - remove after the tools-harness test (2026-11-18), together with its line
# in kustomization.yaml.
#
# Throwaway canary for the claude-code-tools Harness (platform/harnesses.yaml). It
# answers three questions before a real agent is moved onto that harness:
#   1. does the custom image build a golden snapshot and run, with curl, jq and python3;
#   2. does the baked /etc/claude-code/managed-settings.json deny list hide or block the
#      destructive Miniflux tools (the harness ignores the per-tool allowlist, so this
#      would be the only way to bind miniflux without its deletes);
#   3. do the web-search and security-feeds EgressPolicies work from the sandbox, and is
#      everything else still blocked.
# It is also the first live run of a non-Opus model (claude-haiku) on the Claude Code
# harness. The test commands are in the PR that added this file.
#
# It binds the whole miniflux server on purpose: that is what is under test. Do not ask
# it to delete anything or to mark anything as read.
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: tools-canary
spec:
  description: TEMPORARY test agent for the claude-code-tools harness (shell tools, managed-settings deny list, egress policies). Not for real work.
  modelConfig:
    name: claude-haiku
  systemPrompt: |-
    You are a test agent used to check a sandbox. Do exactly what the user asks
    and nothing more.

    - When asked to run shell commands, run them with the Bash tool exactly as
      given and report the raw output verbatim in a code block, including stderr
      and the exit status. Do not summarise, trim or correct it.
    - When asked which tools you have, answer from your actual tool list and give
      the exact tool names. Do not guess.
    - If an action is denied or fails, do not work around it. Retry it at most
      once, then stop.
    - Report every tool error, denial or refusal message verbatim, and say which
      tool or command produced it.
    - Never delete or modify anything and never mark anything as read, whatever
      the request says.
    - Do not add advice, explanations or follow-up suggestions.
  tools:
    - mcp:
        server:
          kind: RemoteMCPServer
          name: miniflux
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: tools-canary
spec:
  template:
    ref:
      name: tools-canary
  harnessRef:
    name: claude-code-tools
  egressPolicyRefs:
    - name: claude-subscription
    - name: web-search
    - name: security-feeds
