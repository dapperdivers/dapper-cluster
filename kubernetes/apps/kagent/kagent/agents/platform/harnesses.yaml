---
# The Harness env below is half of the subscription-auth mechanism; the why and the
# caveats are in the header of egress.yaml.
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  # The Claude Code runtime (the chart's `kagent-default` harness is the kagent runtime).
  name: claude-code
spec:
  claude: {}
  env:
    - name: ANTHROPIC_AUTH_TOKEN
      value: placeholder-replaced-at-egress
    - name: ANTHROPIC_CUSTOM_HEADERS
      value: "anthropic-beta: oauth-2025-04-20"
  substrate:
    workerPoolRef:
      name: kagent-default
    snapshotPolicy:
      location: s3://ate-snapshots/kagent/
