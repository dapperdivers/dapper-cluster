---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vault-mcp-auth
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: vault-mcp-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        Authorization: "Bearer {{ .VAULT_MCP_API_KEY }}"

  dataFrom:
    - find:
        name:
          regexp: ^VAULT_MCP_API_KEY$
---
# The Obsidian vault, read-only, served by selfhosted/vault-mcp (MCPVault).
apiVersion: api.kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata:
  name: vault
spec:
  description: Read-only access to the Obsidian vault. Paths are relative to the vault root.
  url: http://vault-mcp.selfhosted.svc.cluster.local:8000/mcp
  protocol: STREAMABLE_HTTP
  timeout: 30s
  # supergateway rejects requests without the key (VAULT_MCP_API_KEY in Infisical).
  headersFrom:
    - name: Authorization
      valueFrom:
        type: Secret
        name: vault-mcp-auth
        key: Authorization
