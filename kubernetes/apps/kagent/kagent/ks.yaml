---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kagent-crds
  namespace: &namespace kagent
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      # One stack across three namespaces; see kubernetes/apps/kagent/README.md
      app.kubernetes.io/part-of: kagent
  path: ./kubernetes/apps/kagent/kagent/crds
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kagent
  namespace: &namespace kagent
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      # One stack across three namespaces; see kubernetes/apps/kagent/README.md
      app.kubernetes.io/part-of: kagent
  dependsOn:
    - name: kagent-crds
      namespace: kagent
    - name: substrate
      namespace: ate-system
  path: ./kubernetes/apps/kagent/kagent/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 15m
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kagent-agents
  namespace: &namespace kagent
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      # One stack across three namespaces; see kubernetes/apps/kagent/README.md
      app.kubernetes.io/part-of: kagent
  dependsOn:
    - name: kagent
      namespace: kagent
    - name: vault-mcp
      namespace: selfhosted
    - name: web-fetch
      namespace: kagent
    - name: external-secrets-stores
      namespace: external-secrets
  path: ./kubernetes/apps/kagent/kagent/agents
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 10m
