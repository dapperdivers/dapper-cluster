---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kagent
spec:
  interval: 30m
  # spec.chart, not chartRef: see flux/meta/repositories/helm/kagent.yaml
  chart:
    spec:
      chart: kagent
      version: 1.0.1
      sourceRef:
        kind: HelmRepository
        name: kagent
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    # Postgres: database `kagent` on the CNPG cluster, schema `kagent`. Roles and
    # the kagent-postgres-* Secrets were created by hand (#4777); chart defaults
    # already point at those Secret names.
    config:
      server:
        # For grpcurl against ScheduledRunService (schedules aren't CRDs).
        grpcReflection: true
      runtimeDefaults:
        # The built-in bash, file-search and ask_user tools act on the agent's own
        # sandbox, not on our tool servers. gpt-oss:20b reached for them instead of
        # the vault tools and sent ask_user malformed arguments, so turn them off
        # for every agent; agents get only the MCP tools they're bound to.
        builtinTools:
          disableBash: true
          disableFileSearch: true
          disableAskUser: true
    controller:
      substrateClientCertificate:
        enabled: true
    substrateWorkerPool:
      create: true
      workerImage: ghcr.io/kagent-dev/substrate/ateworker-gvisor:v1.0.1
      # Only nodes with user namespaces enabled can run the sandboxes
      # (kubernetes/bootstrap/talos/patches/agents/agent-sandbox.yaml).
      template:
        nodeSelector:
          workload.cluster.io/agent-sandbox: "true"
    harnesses:
      enabled: true
      kagent:
        enabled: true
      codex:
        enabled: false
      claude:
        enabled: false
    # Default ModelConfig: qwen3.5:9b on ollama-2 (second P100), thinking off.
    # In a 2026-11-17 bake-off it scored 12/12 on tool calls with thinking off,
    # against 10/12 for gpt-oss:20b, which never made parallel calls and renamed
    # nested schema fields. With thinking on it overthinks: ~3x slower and worse.
    # Why the OpenAI provider and not Ollama: kagent's Ollama provider never sets
    # the request's top-level `think` field (an `options.think` value is ignored,
    # and Modelfiles reject `PARAMETER think`). Ollama's /v1 API maps
    # reasoning_effort "none" to think=false. The context window comes from the
    # server's OLLAMA_CONTEXT_LENGTH (ollama/app/helmrelease-2.yaml), because /v1
    # can't send num_ctx. No API key: with a custom baseUrl kagent omits auth.
    providers:
      default: openAI
      openAI:
        provider: OpenAI
        model: qwen3.5:9b
        # Null the chart's kagent-openai Secret reference; ollama needs no key.
        apiKeySecretRef: null
        apiKeySecretKey: null
        config:
          baseUrl: http://ollama-2.ai.svc.cluster.local:11434/v1
          reasoningEffort: none
    ui:
      httpRoute:
        enabled: true
        annotations:
          # Authentik forward-auth (Kyverno generates the SecurityPolicy). kagent's
          # own API auth is still "insecure", so this is the only gate on the UI.
          authentik.home.arpa/forward-auth: "true"
        parentRefs:
          - name: internal
            namespace: network
        hostnames: ["kagent.${SECRET_DOMAIN}"]
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            # Chat replies stream for minutes; match the UI's own 1800s stream timeout.
            timeouts:
              request: 1800s
              backendRequest: 1800s
    kagent-tools:
      rbac:
        # Built-in k8s tool server: read-only cluster access, no Secrets.
        readOnly: true
