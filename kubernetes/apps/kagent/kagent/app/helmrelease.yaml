---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kagent
spec:
  interval: 30m
  # spec.chart, not chartRef: see flux/meta/repositories/helm/kagent.yaml
  chart:
    spec:
      chart: kagent
      version: 1.0.1
      sourceRef:
        kind: HelmRepository
        name: kagent
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    # Postgres: database `kagent` on the CNPG cluster, schema `kagent`. Roles and
    # the kagent-postgres-* Secrets were created by hand (#4777); chart defaults
    # already point at those Secret names.
    config:
      server:
        # For grpcurl against ScheduledRunService (schedules aren't CRDs).
        grpcReflection: true
      runtimeDefaults:
        # The built-in bash, file-search and ask_user tools act on the agent's own
        # sandbox, not on our tool servers. gpt-oss:20b reached for them instead of
        # the vault tools and sent ask_user malformed arguments, so turn them off
        # for every agent; agents get only the MCP tools they're bound to.
        builtinTools:
          disableBash: true
          disableFileSearch: true
          disableAskUser: true
    controller:
      substrateClientCertificate:
        enabled: true
    substrateWorkerPool:
      create: true
      workerImage: ghcr.io/kagent-dev/substrate/ateworker-gvisor:v1.0.1
      # Only nodes with user namespaces enabled can run the sandboxes
      # (kubernetes/bootstrap/talos/patches/agents/agent-sandbox.yaml).
      template:
        nodeSelector:
          workload.cluster.io/agent-sandbox: "true"
    harnesses:
      enabled: true
      kagent:
        enabled: true
      codex:
        enabled: false
      claude:
        enabled: false
    # Default ModelConfig: local Ollama on the idle second P100. num_ctx matches
    # the server's OLLAMA_CONTEXT_LENGTH; more would spill KV cache off the card.
    providers:
      default: ollama
      ollama:
        provider: Ollama
        model: gpt-oss:20b
        config:
          host: http://ollama-2.ai.svc.cluster.local:11434
          options:
            num_ctx: "32768"
    ui:
      httpRoute:
        enabled: true
        annotations:
          # Authentik forward-auth (Kyverno generates the SecurityPolicy). kagent's
          # own API auth is still "insecure", so this is the only gate on the UI.
          authentik.home.arpa/forward-auth: "true"
        parentRefs:
          - name: internal
            namespace: network
        hostnames: ["kagent.${SECRET_DOMAIN}"]
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            # Chat replies stream for minutes; match the UI's own 1800s stream timeout.
            timeouts:
              request: 1800s
              backendRequest: 1800s
    kagent-tools:
      rbac:
        # Built-in k8s tool server: read-only cluster access, no Secrets.
        readOnly: true
