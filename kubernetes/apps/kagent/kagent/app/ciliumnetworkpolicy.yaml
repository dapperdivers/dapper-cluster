---
# Who may reach the kagent services (#4777). Without these, any pod in the
# cluster could call agents (which carry the vault API key) and use the UI
# without going through Authentik. Callers were taken from Hubble flows.
# Replies to connections these pods open (Postgres, Substrate, tool servers)
# are not affected: Cilium tracks connection state.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kagent-controller
spec:
  description: A2A/MCP/REST API, only from the UI, agents via Substrate's egress gateway, labelled jobs in selfhosted and OpenClaw.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kagent
      app.kubernetes.io/component: controller
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: kagent
            app.kubernetes.io/component: ui
        # Sandboxed agents reach the controller (and, through it, their tools) here.
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ate-system
            app: atenet-egress
        # Scheduled jobs that call agents. A job opts in with the pod label
        # `kagent-client: "true"`, so a new one needs no change here. Today these are
        # the vault jobs (selfhosted/obsidian-vault/jobs): voice-inbox, night-shift,
        # nightwatch and reading-process. Only the selfhosted namespace is admitted;
        # for jobs in another namespace, add a block like this one for it.
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: selfhosted
            kagent-client: "true"
        # OpenClaw (Tim) delegates tasks to agents through the controller's MCP
        # endpoint. The controller label keeps the molt-syncthing pod out.
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: molt
            app.kubernetes.io/controller: molt
        # opencti-feed-sync (security/opencti) asks the intel-triage agent which feed
        # articles to file.
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: security
            app.kubernetes.io/name: opencti-feed-sync
      toPorts:
        - ports:
            - port: "8083"
              protocol: TCP
    # Kubelet probes; kubectl port-forward also arrives this way.
    - fromEntities:
        - host
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kagent-ui
spec:
  description: UI, only through the internal gateway (Authentik forward-auth).
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kagent
      app.kubernetes.io/component: ui
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: internal
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEntities:
        - host
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kagent-tools
spec:
  description: Built-in k8s tool server, only from the controller (tool discovery) and agents (via Substrate's egress gateway).
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kagent-tools
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: kagent
            app.kubernetes.io/component: controller
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ate-system
            app: atenet-egress
      toPorts:
        - ports:
            - port: "8084"
              protocol: TCP
    - fromEntities:
        - host
