---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: web-fetch
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: web-fetch-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # the server requires it on every /mcp request (read as MCP_AUTH_TOKEN; key name kept)
        MCP_PROXY_AUTH_TOKEN: "{{ .WEB_FETCH_MCP_TOKEN }}"
        # sent by the web-fetch RemoteMCPServer
        Authorization: "Bearer {{ .WEB_FETCH_MCP_TOKEN }}"

  dataFrom:
    - find:
        name:
          regexp: ^WEB_FETCH_MCP_TOKEN$
