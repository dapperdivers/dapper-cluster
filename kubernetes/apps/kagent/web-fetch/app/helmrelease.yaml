---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: web-fetch
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      web-fetch:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            # Lets agents read web pages (the sandbox can't reach the internet itself).
            # This is the upstream mcp-server-fetch, packaged in
            # github.com/dapperdivers/mcp-servers (one image for the custom tool servers;
            # the argument picks which one runs). It turns pages into Markdown and refuses
            # private, loopback, link-local and metadata addresses (every redirect
            # re-checked); the network policy is the second layer. Serves MCP Streamable
            # HTTP at /mcp (bearer token required) and /healthz. HTML extraction is
            # pure-Python (keeps text and headings, drops link targets).
            image:
              repository: ghcr.io/dapperdivers/mcp-servers
              tag: 2026.11.24.4@sha256:31f82a4252d65da18bbb7cbcc151d51eee2d7aba3550d81cb659bd7bd64d67b7
            args: [web-fetch]
            env:
              TZ: ${TIME_ZONE}
              MCP_AUTH_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: web-fetch-secret
                    key: MCP_PROXY_AUTH_TOKEN
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8000
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: web-fetch
        ports:
          http:
            port: *port
