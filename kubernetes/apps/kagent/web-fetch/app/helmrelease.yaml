---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: web-fetch
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      web-fetch:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/library/python
              tag: 3.13.18-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
            # Lets agents read web pages (the sandbox can't reach the internet itself).
            # mcp-server-fetch turns pages into Markdown and refuses private, loopback,
            # link-local and metadata addresses (every redirect re-checked); the network
            # policy is the second layer. mcp-proxy serves it as Streamable HTTP at /mcp.
            # Python-only, so HTML extraction uses readabilipy's pure-Python path (keeps
            # text and headings, drops link targets).
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -e
                # Agents' calls come through Substrate's egress gateway, which sends the Host
                # header without the port, hence the portless --allowed-host.
                # Separate install dirs: the two packages pin conflicting versions of a
                # shared dependency.
                pip install --quiet --no-cache-dir --disable-pip-version-check --target /tmp/proxy mcp-proxy==0.15.0
                pip install --quiet --no-cache-dir --disable-pip-version-check --target /tmp/fetch mcp-server-fetch==2026.11.11
                export PYTHONPATH=/tmp/proxy
                exec /tmp/proxy/bin/mcp-proxy --host 0.0.0.0 --port 8000 --stateless \
                  --allowed-host web-fetch.kagent.svc.cluster.local:8000 \
                  --allowed-host web-fetch.kagent.svc:8000 --allowed-host web-fetch:8000 \
                  --allowed-host web-fetch.kagent.svc.cluster.local \
                  -- /usr/bin/env PYTHONPATH=/tmp/fetch HOME=/tmp /tmp/fetch/bin/mcp-server-fetch \
                  --user-agent "Mozilla/5.0 (compatible; homelab-research-agent)"
            env:
              TZ: ${TIME_ZONE}
              HOME: /tmp
              MCP_PROXY_AUTH_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: web-fetch-secret
                    key: MCP_PROXY_AUTH_TOKEN
              PYTHONDONTWRITEBYTECODE: "1"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 8000
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 5
                  # Each start pip-installs both packages.
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: web-fetch
        ports:
          http:
            port: *port
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
