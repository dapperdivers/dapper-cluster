---
apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  external:
    enable: true

  # Ceph version must match the external Proxmox cluster (19.2.x Squid since 2026-11-03)
  # Required for creating additional CRs (RGW, MDS, NFS)
  # PINNED: .renovate/allowedVersions.json5 limits this to v19.x
  # Bump the major only after the Proxmox Ceph cluster itself is upgraded
  cephVersion:
    image: quay.io/ceph/ceph:v19.2.5

  # CephCluster settings for external mode
  dataDirHostPath: /var/lib/rook

  # Optional: Monitor external cluster health
  # Uncomment and set your Ceph manager IPs from the 10.150.0.0/24 network
  monitoring:
    enabled: true
    externalMgrEndpoints:
      - ip: "10.150.0.2"
      - ip: "10.150.0.3"
      - ip: "10.150.0.4"

  # CSI driver configuration
  # Note: CephFS StorageClasses use the kernel mounter (Talos ships the ceph module again);
  # all CephFS PVs are kernel-mounted since 2026-11-03 (last FUSE PVs recreated).
  # MDS-side config still sets mds_session_blocklist_on_timeout/evict=false (FUSE-era workaround).
  csi:
    cephfs:
      fuseMountOptions: ""
    readAffinity:
      enabled: false

  # Network configuration
  network:
    # If your Ceph cluster uses a specific public network
    # provider: host
    # connections:
    #   encryption:
    #     enabled: false
    #   compression:
    #     enabled: false

  # Crash collector - disabled for external clusters
  crashCollector:
    disable: true

  # Log collection - disabled for external clusters
  logCollector:
    enabled: false

  # Health checks
  healthCheck:
    daemonHealth:
      mon:
        disabled: false
        interval: 45s
      osd:
        disabled: true
      status:
        disabled: false
        interval: 60s

  # Disable cleanup on deletion (don't touch external cluster)
  cleanupPolicy:
    confirmation: ""
    sanitizeDisks:
      method: complete
      dataSource: zero
      iteration: 1
    allowUninstallWithVolumes: false

  # Disable automatic updates
  removeOSDsIfOutAndSafeToRemove: false
  skipUpgradeChecks: false
  continueUpgradeAfterChecksEvenIfNotHealthy: false

  # Annotations and labels
  annotations:
    all:
      cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
  labels:
    all:
      app.kubernetes.io/name: rook-ceph
