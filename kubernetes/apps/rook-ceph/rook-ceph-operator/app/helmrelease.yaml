---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-operator
spec:
  interval: 30m
  # The rook/ceph operator image is over 1 GB and pulls slowly here. Helm's
  # default 5m timeout rolled back the v1.19.12 upgrade mid-pull
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: rook-ceph
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    crds:
      enabled: true

    # Enable monitoring
    monitoring:
      enabled: true

    # CSI images: since Rook 1.21 these default to the ceph-csi-operator's
    # built-in set (rook-csi-operator-image-set-configmap renders empty).
    #
    # cephcsi: use the Rocky Linux 9 (-rocky9) variant. The default cephcsi 3.18
    # images need an x86-64-v3 CPU ("Fatal glibc error: CPU does not support
    # x86-64-v3", exit 127) and crash-looped on the talos-node-small-* VMs, whose
    # virtual CPU has no AVX2. The EL9-based -rocky9 images (published since
    # v3.18.2) only need x86-64-v2. Keep the -rocky9 suffix until every Talos
    # VM's Proxmox CPU type is x86-64-v3 (or host).
    csi:
      cephcsi:
        repository: quay.io/cephcsi/cephcsi
        tag: v3.18.2-rocky9

    # Operator resource configuration
    resources:
      limits:
        cpu: "1"
        memory: "512Mi"
      requests:
        cpu: "100m"
        memory: "128Mi"

    # Node selector for running on specific nodes (optional)
    # nodeSelector:
    #   node-role.kubernetes.io/worker: "true"

    # Toleration for taints (optional)
    # tolerations: []
