---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-operator
spec:
  interval: 30m
  # The rook/ceph operator image is over 1 GB and pulls slowly here. Helm's
  # default 5m timeout rolled back the v1.19.12 upgrade mid-pull
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: rook-ceph
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    crds:
      enabled: true

    # Enable monitoring
    monitoring:
      enabled: true

    # Rook >= 1.21 no longer sets CSI images: it leaves
    # rook-csi-operator-image-set-configmap empty, and the ceph-csi-operator
    # (v1.0.4) then falls back to its built-in cephcsi v3.17.0, a downgrade from
    # the v3.17.1 that Rook 1.20 set. Pin the plugin and csi-addons explicitly;
    # these render into that configmap, which both ceph-csi Drivers reference.
    # The k8s sidecars (provisioner, attacher, ...) match the operator defaults,
    # so they stay unset.
    csi:
      cephcsi:
        repository: quay.io/cephcsi/cephcsi
        tag: v3.17.1
      csiAddons:
        repository: quay.io/csiaddons/k8s-sidecar
        tag: v0.14.0

    # Operator resource configuration
    resources:
      limits:
        cpu: "1"
        memory: "512Mi"
      requests:
        cpu: "100m"
        memory: "128Mi"

    # Node selector for running on specific nodes (optional)
    # nodeSelector:
    #   node-role.kubernetes.io/worker: "true"

    # Toleration for taints (optional)
    # tolerations: []
