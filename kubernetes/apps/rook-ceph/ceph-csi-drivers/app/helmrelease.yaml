---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  # The release name must stay "ceph-csi-drivers": Rook 1.19 stamped the
  # existing OperatorConfig and Driver CRs with this release name, so Helm
  # adopts them in place
  name: ceph-csi-drivers
spec:
  interval: 30m
  chart:
    spec:
      chart: ceph-csi-drivers
      # Keep in step with the ceph-csi-operator subchart bundled in the
      # rook-ceph operator chart (v1.20.9 bundles 1.0.4)
      version: 1.1.0
      sourceRef:
        kind: HelmRepository
        name: ceph-csi-operator
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  # Rook's recommended values (deploy/charts/ceph-csi-drivers/values.yaml),
  # plus the settings the Rook-generated Driver CRs had. The chart writes
  # its own per-driver defaults into each Driver, and those override
  # operatorConfig, so controller replicas, hostNetwork and the timeout are
  # set per driver
  values:
    operatorConfig:
      namespace: rook-ceph
      driverSpecDefaults:
        imageSet:
          name: rook-csi-operator-image-set-configmap
        clusterName: rook-ceph
        nodePlugin:
          priorityClassName: system-node-critical
        controllerPlugin:
          priorityClassName: system-cluster-critical
    drivers:
      # Driver names must match the StorageClasses, VolumeSnapshotClasses
      # and every existing PV
      rbd:
        enabled: true
        name: rook-ceph.rbd.csi.ceph.com
        # VolSync needs the snapshotter sidecar; "none" drops it
        snapshotPolicy: volumeSnapshot
        grpcTimeout: 150
        log:
          rotation:
            enabled: false
        controllerPlugin:
          replicas: 2
          # Reach the external Ceph mons the same way the node plugins do
          hostNetwork: true
      cephfs:
        enabled: true
        name: rook-ceph.cephfs.csi.ceph.com
        snapshotPolicy: volumeGroupSnapshot
        # Kernel mounts (Talos ships the ceph module) instead of FUSE
        cephFsClientType: kernel
        grpcTimeout: 150
        log:
          rotation:
            enabled: false
        controllerPlugin:
          replicas: 2
          hostNetwork: true
      nfs:
        enabled: false
        name: rook-ceph.nfs.csi.ceph.com
      nvmeof:
        enabled: false
        name: rook-ceph.nvmeof.csi.ceph.com
