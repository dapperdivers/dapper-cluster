---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kometa
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: plex
      namespace: media
    - name: volsync
      namespace: storage
  values:
    controllers:
      kometa:
        type: cronjob
        annotations:
          reloader.stakater.com/auto: "true"
        cronjob:
          schedule: "0 1 * * *" # Daily at 1 AM
          timeZone: &timeZone ${TIME_ZONE}
          concurrencyPolicy: Forbid
          # 11.5h — daily runs take ~1.5-3.5h, but the Sunday full overlay pass needs
          # ~8-9h (≈2h gathering 33k TV episodes + ~1/s apply). At 6h it was reaped
          # mid-episodes every Sunday and never completed. Kept under KubeJobNotCompleted's
          # 12h threshold so a true hang is reaped (KubeJobFailed) rather than double-alerting.
          activeDeadlineSeconds: 41400
          successfulJobsHistory: 1
          failedJobsHistory: 1
        initContainers:
          git-sync:
            env:
              GITSYNC_REPO: https://github.com/dapperdivers/kometa-config/
              GITSYNC_REF: master
              GITSYNC_ROOT: /git
              # git-sync >= 4.8 ships a git that rejects the PVC-owned repo dir ("dubious ownership")
              GITSYNC_GIT_CONFIG: "safe.directory:*"
              GITSYNC_DEPTH: 1
              GITSYNC_ONE_TIME: "true"
            image:
              repository: registry.k8s.io/git-sync/git-sync
              tag: v4.8.1@sha256:6eabb33faf08810811756f364a8e2ec9a3a2622363352e469f7bef78cc2294f5
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
        containers:
          app:
            image:
              repository: kometateam/kometa
              tag: nightly@sha256:d460c4dec6654f1b63b84e0276b5e747da22be2ebc6706177ac196665ccc5b3f
            command:
              - /bin/sh
              - -c
            args:
              - |
                sleep 5 && cp -r /git/kometa-config/. /config/ && \
                python3 kometa.py --read-only-config --run;
            env:
              TZ: *timeZone
              KOMETA_TAUTULLI_HOST: "http://tautulli.media:8181"
              KOMETA_PLEX_HOST: "http://plex.media.svc.cluster.local:32400"
              KOMETA_RADARR_HOST: "http://radarr.media"
              KOMETA_RADARR_ROOT_FOLDER_PATH: "/media/movies"
              KOMETA_RADARR_UHD_HOST: "http://radarr-uhd.media"
              KOMETA_RADARR_UHD_ROOT_FOLDER_PATH: "/media/movies-4k"
              KOMETA_SONARR_HOST: "http://sonarr.media"
              KOMETA_SONARR_ROOT_FOLDER_PATH: "/media/tv"
              KOMETA_SONARR_UHD_HOST: "http://sonarr-uhd.media"
              KOMETA_SONARR_UHD_ROOT_FOLDER_PATH: "/media/tv-4k"
            envFrom:
              - secretRef:
                  name: kometa-secret
            resources:
              requests:
                cpu: 4000m
                memory: 4096M
              limits:
                cpu: 6000m
                memory: 8192M
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      affinity:
        podAffinity:
          # Prefer (not require) co-location with Plex. The shared volumes
          # (kometa config + plex-posters-cephfs assets) are RWX CephFS, so
          # multi-node mounts work fine — co-location is just a locality
          # optimization now. A hard requirement shackled this 4-CPU job to
          # Plex's node, which can fill past its CPU request and leave Kometa
          # Pending until activeDeadlineSeconds reaps it (DeadlineExceeded).
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: plex
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 150
        fsGroup: 150
        supplementalGroups:
          - 140
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    persistence:
      config:
        existingClaim: *app
      assets:
        existingClaim: plex-posters-cephfs
        globalMounts:
          - path: /assets
            subPath: assets
      git:
        type: emptyDir
        globalMounts:
          - path: /git
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
