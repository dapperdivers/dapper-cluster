---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dapper-cluster-unprivileged
---
# Only what containerMode: kubernetes needs to run job pods in this namespace.
# No Talos ServiceAccount, no cluster-scoped access.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dapper-cluster-unprivileged
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dapper-cluster-unprivileged
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dapper-cluster-unprivileged
subjects:
  - kind: ServiceAccount
    name: dapper-cluster-unprivileged
    namespace: actions-runner-system
