---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: garage-secret
    template:
      engineVersion: v2
      data:
        # Server
        GARAGE_RPC_SECRET: "{{ .GARAGE_RPC_SECRET }}"
        GARAGE_ADMIN_TOKEN: "{{ .GARAGE_ADMIN_TOKEN }}"
        # Bucket keys, imported by the provision Job (consumers read the same
        # Infisical keys through their own ExternalSecrets).
        GARAGE_CNPG_ACCESS_KEY_ID: "{{ .GARAGE_CNPG_ACCESS_KEY_ID }}"
        GARAGE_CNPG_SECRET_ACCESS_KEY: "{{ .GARAGE_CNPG_SECRET_ACCESS_KEY }}"
        GARAGE_OFFSITE_ACCESS_KEY_ID: "{{ .GARAGE_OFFSITE_ACCESS_KEY_ID }}"
        GARAGE_OFFSITE_SECRET_ACCESS_KEY: "{{ .GARAGE_OFFSITE_SECRET_ACCESS_KEY }}"
        # Generated and pushed to Infisical by ./generated-keys.yaml.
        GARAGE_OPENCTI_ACCESS_KEY_ID: "{{ .GARAGE_OPENCTI_ACCESS_KEY_ID }}"
        GARAGE_OPENCTI_SECRET_ACCESS_KEY: "{{ .GARAGE_OPENCTI_SECRET_ACCESS_KEY }}"
  dataFrom:
    - find:
        name:
          regexp: ^GARAGE_.*
