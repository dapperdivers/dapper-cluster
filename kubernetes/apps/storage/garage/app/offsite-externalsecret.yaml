---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-offsite
  annotations:
    # The templates use regex replacement groups ($1); keep Flux postBuild
    # substitution away from them.
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: garage-offsite-secret
    template:
      engineVersion: v2
      data:
        # rclone remotes configured entirely from env (no config file).
        # garage: read-only key (provisioned as cloudnative-pg:OFFSITE:ro).
        RCLONE_CONFIG_GARAGE_TYPE: s3
        RCLONE_CONFIG_GARAGE_PROVIDER: Other
        RCLONE_CONFIG_GARAGE_ENDPOINT: http://garage.storage.svc.cluster.local:3900
        RCLONE_CONFIG_GARAGE_REGION: us-east-1
        RCLONE_CONFIG_GARAGE_FORCE_PATH_STYLE: "true"
        RCLONE_CONFIG_GARAGE_ACCESS_KEY_ID: "{{ .GARAGE_OFFSITE_ACCESS_KEY_ID }}"
        RCLONE_CONFIG_GARAGE_SECRET_ACCESS_KEY: "{{ .GARAGE_OFFSITE_SECRET_ACCESS_KEY }}"
        # r2: the bucket-scoped token VolSync already uses. NO_CHECK_BUCKET
        # because the token can't CreateBucket (rclone tries before uploads).
        # CLOUDFLARE_S2_URL is "s3:https://<account>.r2.cloudflarestorage.com/<bucket>".
        RCLONE_CONFIG_R2_TYPE: s3
        RCLONE_CONFIG_R2_PROVIDER: Cloudflare
        RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
        RCLONE_CONFIG_R2_ENDPOINT: '{{ regexReplaceAll "^s3:(https://[^/]+)/.*$" .CLOUDFLARE_S2_URL "$1" }}'
        RCLONE_CONFIG_R2_ACCESS_KEY_ID: "{{ .CLOUDFLARE_OBJECT_STORAGE_KEY_ID }}"
        RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: "{{ .CLOUDFLARE_OBJECT_STORAGE_SECRET_ACCESS_KEY }}"
        R2_BUCKET: '{{ regexReplaceAll "^.*/" .CLOUDFLARE_S2_URL "" }}'
  dataFrom:
    - find:
        name:
          regexp: ^GARAGE_OFFSITE_.*
    - find:
        name:
          regexp: ^CLOUDFLARE_(S2_URL|OBJECT_STORAGE_KEY_ID|OBJECT_STORAGE_SECRET_ACCESS_KEY)$
