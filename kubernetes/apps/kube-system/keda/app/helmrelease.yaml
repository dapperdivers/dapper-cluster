---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# KEDA: event-driven autoscaling. Round Table knights scale 0..N on NATS
# JetStream consumer lag (roundtable-k8s/roundtable#213, #215, #166).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
spec:
  interval: 30m
  chart:
    spec:
      chart: keda
      version: 2.21.1
      sourceRef:
        kind: HelmRepository
        name: kedacore
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    prometheus:
      metricServer:
        enabled: true
        podMonitor:
          enabled: true
      operator:
        enabled: true
        podMonitor:
          enabled: true
      webhooks:
        enabled: true
        podMonitor:
          enabled: true
