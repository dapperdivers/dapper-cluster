---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opencti
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: opencti
  timeout: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    fullnameOverride: opencti

    # This deployment is deliberately small. The previous one was retired
    # (#4527) because OpenSearch read ~760 MiB/s from Ceph: 20 GB of indices
    # against ~1 GB of page cache. So: few connectors, one worker, and an
    # OpenSearch memory limit well above its heap so the index stays cached.

    opencti:
      adminEmail: admin@chelonianlabs.com
      adminPasswordExistingSecret:
        name: &secret opencti-secret
        key: OPENCTI_ADMIN_PASSWORD
      adminTokenExistingSecret:
        name: *secret
        key: OPENCTI_ADMIN_TOKEN
      encryptionKeyExistingSecret:
        name: *secret
        key: OPENCTI_ENCRYPTION_KEY

    server:
      nodeOptions: "--max-old-space-size=4096"
      # Cap the Redis event stream (stream.opencti). The default of 2,000,000
      # entries at ~3.5 KB each can exceed 5 GB and fill the shared Dragonfly,
      # which then rejects writes for every tenant. 200k entries is ~700 MB.
      extraEnv:
        - name: REDIS__TRIMMING
          value: "200000"
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          memory: 4Gi
      route:
        enabled: true
        parentRefs:
          - name: internal
            namespace: network
        hostnames: ["opencti.${SECRET_DOMAIN}"]

    worker:
      replicaCount: 2
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi

    serviceMonitor:
      enabled: true

    # Shared Dragonfly in the database namespace (passwordless).
    externalRedis:
      hostname: dragonfly.database.svc.cluster.local

    # Garage; the bucket and key come from storage/garage's provision Job.
    rustfs:
      enabled: false
    externalS3:
      enabled: true
      endpoint: garage.storage.svc.cluster.local
      port: 3900
      region: us-east-1
      bucketName: opencti
      existingSecret:
        name: *secret
        accessKeyKey: S3_ACCESS_KEY
        secretKeyKey: S3_SECRET_KEY

    opensearch:
      replicas: 1
      sysctlInit:
        enabled: false
      # 4 GB heap; the other ~12 GB of the limit is page cache for the index
      # files, so reads stay in memory until the index outgrows that.
      # request == limit so the cache is not squeezed by neighbours.
      opensearchJavaOpts: "-Xms4g -Xmx4g"
      resources:
        requests:
          cpu: 500m
          memory: 16Gi
        limits:
          memory: 16Gi
      persistence:
        enabled: true
        size: 50Gi
        storageClass: ceph-rbd
        # The volume-permissions init container defaults to busybox:latest,
        # which the restrict-latest-tag policy rejects.
        image: busybox
        imageTag: "1.37"

    rabbitmq:
      auth:
        existingSecret:
          name: *secret
          key: OPENCTI_RABBITMQ_PASSWORD
      persistence:
        enabled: true
        size: 10Gi
        storageClass: ceph-rbd
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1Gi

    # Low-volume feeds only. Left out on purpose: AlienVault (needed 8Gi),
    # MalwareBazaar, URLhaus and ThreatFox (two-hourly).
    connectors:
      cisa-known-exploited-vulnerabilities:
        enabled: true
        env:
          CONNECTOR_ID: 07cadcfd-3f09-412a-ad19-478c84086178
          CONNECTOR_NAME: CISA Known Exploited Vulnerabilities
          CONNECTOR_SCOPE: cisa
          CONNECTOR_LOG_LEVEL: info
          CONNECTOR_DURATION_PERIOD: PT24H
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 512Mi
      mitre:
        enabled: true
        env:
          CONNECTOR_ID: fabbfeb2-633c-42c6-b812-287d35df008b
          CONNECTOR_NAME: MITRE ATT&CK
          CONNECTOR_SCOPE: tool,report,malware,identity,campaign,intrusion-set,attack-pattern,course-of-action,x-mitre-data-source,x-mitre-data-component,x-mitre-matrix,x-mitre-tactic,x-mitre-collection
          CONNECTOR_LOG_LEVEL: info
          CONNECTOR_DURATION_PERIOD: P7D
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 512Mi
      # New and changed CVEs only: no history backfill and no CPE/software
      # import, which is where the bulk of the old index came from.
      cve:
        enabled: true
        env:
          CONNECTOR_ID: 5a8c1f0e-6d3b-4e2a-9b7c-3f1d2e4a6b8c
          CONNECTOR_NAME: Common Vulnerabilities and Exposures
          CONNECTOR_SCOPE: cve
          CONNECTOR_LOG_LEVEL: info
          CVE_INTERVAL: "24"
          CVE_MAINTAIN_DATA: "true"
          CVE_PULL_HISTORY: "false"
          CVE_IMPORT_SOFTWARE: "false"
        envFromSecrets:
          CVE_API_KEY:
            name: *secret
            key: OPENCTI_NVD_API_KEY
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 512Mi
      # Enrichment on request only (CONNECTOR_AUTO off): it scores a CVE when
      # someone asks, instead of rewriting every vulnerability.
      epss:
        enabled: true
        image:
          repository: opencti/connector-first-epss
        env:
          CONNECTOR_ID: 18f1a9e6-a82b-4ef4-9699-ae406fe4a1a6
          CONNECTOR_NAME: FIRST EPSS
          CONNECTOR_SCOPE: vulnerability
          CONNECTOR_LOG_LEVEL: info
          CONNECTOR_AUTO: "false"
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
      # Reference data: sectors, countries and regions, so reports can be tied
      # to an industry or geography. Small, refreshed weekly.
      opencti:
        enabled: true
        env:
          CONNECTOR_ID: 8058d2e0-3d45-492f-a8f3-9c365a58372d
          CONNECTOR_NAME: OpenCTI Datasets
          CONNECTOR_SCOPE: marking-definition,identity,location
          CONNECTOR_LOG_LEVEL: info
          CONFIG_SECTORS_FILE_URL: https://raw.githubusercontent.com/OpenCTI-Platform/datasets/master/data/sectors.json
          CONFIG_GEOGRAPHY_FILE_URL: https://raw.githubusercontent.com/OpenCTI-Platform/datasets/master/data/geography.json
          CONFIG_COMPANIES_FILE_URL: https://raw.githubusercontent.com/OpenCTI-Platform/datasets/master/data/companies.json
          CONFIG_REMOVE_CREATOR: "false"
          CONFIG_INTERVAL: "7"
        resources:
          requests:
            cpu: 20m
            memory: 128Mi
          limits:
            memory: 256Mi

      # Look-ups that run only when asked for from an observable's page
      # (CONNECTOR_AUTO off), so they add no background load.
      shodan:
        enabled: true
        env:
          CONNECTOR_ID: 82b58916-a654-4cd4-81de-700eb72a5c94
          CONNECTOR_NAME: Shodan
          CONNECTOR_SCOPE: ipv4-addr,indicator
          CONNECTOR_AUTO: "false"
          CONNECTOR_LOG_LEVEL: info
        envFromSecrets:
          SHODAN_TOKEN:
            name: *secret
            key: SHODAN_API_KEY
        resources:
          requests:
            cpu: 20m
            memory: 128Mi
          limits:
            memory: 256Mi

      shodan-internetdb:
        enabled: true
        env:
          CONNECTOR_ID: 73d4fdfa-0e8f-498c-894a-6f09d9973410
          CONNECTOR_NAME: Shodan InternetDB
          CONNECTOR_SCOPE: IPv4-Addr
          CONNECTOR_AUTO: "false"
          CONNECTOR_LOG_LEVEL: info
        resources:
          requests:
            cpu: 20m
            memory: 128Mi
          limits:
            memory: 256Mi

      # Upload a report (PDF, HTML, text, Word) and extract its indicators,
      # CVEs and techniques. Results are reviewed before they are imported.
      import-document:
        enabled: true
        env:
          CONNECTOR_ID: efc80ccb-605f-486a-8505-102861b9e17a
          CONNECTOR_NAME: ImportDocument
          CONNECTOR_SCOPE: application/pdf,text/plain,text/csv,text/html,text/markdown,application/vnd.openxmlformats-officedocument.wordprocessingml.document
          CONNECTOR_AUTO: "false"
          CONNECTOR_VALIDATE_BEFORE_IMPORT: "true"
          CONNECTOR_LOG_LEVEL: info
          IMPORT_DOCUMENT_CREATE_INDICATOR: "false"
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 1Gi

      export-file-stix:
        enabled: true
        env:
          CONNECTOR_ID: 0235dd1b-7191-46f1-9272-4e94d82b2a8a
          CONNECTOR_NAME: ExportFileStix2
          CONNECTOR_SCOPE: application/vnd.oasis.stix+json
          CONNECTOR_LOG_LEVEL: info
        resources:
          requests:
            cpu: 20m
            memory: 128Mi
          limits:
            memory: 256Mi

      export-file-csv:
        enabled: true
        env:
          CONNECTOR_ID: bbb48bd8-19ea-4c28-b61a-f0829fa82a38
          CONNECTOR_NAME: ExportFileCsv
          CONNECTOR_SCOPE: text/csv
          CONNECTOR_LOG_LEVEL: info
        resources:
          requests:
            cpu: 20m
            memory: 128Mi
          limits:
            memory: 256Mi

      # Publicly claimed ransomware victims with group, date, country and
      # sector, which gives victim counts per sector over time. Starts from
      # now (no history backfill); leak-site domains and post links are off.
      ransomwarelive:
        enabled: true
        env:
          CONNECTOR_ID: 69f15add-d7ee-4f54-8309-95c0c98a0789
          CONNECTOR_NAME: Ransomware.live
          CONNECTOR_SCOPE: identity,location,intrusion-set,report,relationship
          CONNECTOR_LOG_LEVEL: info
          CONNECTOR_DURATION_PERIOD: PT12H
          RANSOMWARELIVE_API_BASE_URL: https://api.ransomware.live/v2
          RANSOMWARELIVE_CREATE_THREAT_ACTOR: "false"
          RANSOMWARELIVE_CREATE_INTRUSION_SET: "true"
          RANSOMWARELIVE_CREATE_CAMPAIGN: "false"
          RANSOMWARELIVE_CREATE_REPORT: "true"
          RANSOMWARELIVE_CREATE_LEAK_SITE_DOMAINS: "false"
          RANSOMWARELIVE_CREATE_LEAK_POST_REFS: "false"
          RANSOMWARELIVE_PULL_HISTORY: "false"
          RANSOMWARELIVE_MARKING_VALUE: TLP:CLEAR
        resources:
          requests:
            cpu: 20m
            memory: 128Mi
          limits:
            memory: 512Mi

      # OTX pulses as reports, kept narrow: only pulses since 2026-11-01,
      # once a day, no observables and no file hashes. The retired deployment
      # pulled everything since 2024 with observables and needed 8Gi.
      alienvault:
        enabled: true
        env:
          CONNECTOR_ID: 8bbae241-6289-4faf-b7d6-7503bed50bbc
          CONNECTOR_NAME: AlienVault OTX
          CONNECTOR_SCOPE: alienvault
          CONNECTOR_LOG_LEVEL: info
          CONNECTOR_DURATION_PERIOD: PT24H
          ALIENVAULT_BASE_URL: https://otx.alienvault.com
          ALIENVAULT_TLP: White
          ALIENVAULT_PULSE_START_TIMESTAMP: "2026-11-01T00:00:00Z"
          ALIENVAULT_REPORT_TYPE: threat-report
          ALIENVAULT_REPORT_STATUS: New
          ALIENVAULT_CREATE_OBSERVABLES: "false"
          ALIENVAULT_CREATE_INDICATORS: "true"
          ALIENVAULT_EXCLUDED_PULSE_INDICATOR_TYPES: FileHash-MD5,FileHash-SHA1,FileHash-SHA256,FileHash-PEHASH,FileHash-IMPHASH
          ALIENVAULT_GUESS_MALWARE: "true"
          ALIENVAULT_GUESS_CVE: "true"
          ALIENVAULT_ENABLE_RELATIONSHIPS: "true"
          ALIENVAULT_ENABLE_ATTACK_PATTERNS_INDICATES: "false"
        envFromSecrets:
          ALIENVAULT_API_KEY:
            name: *secret
            key: OPENCTI_ALIENVAULT_API_KEY
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 1Gi
