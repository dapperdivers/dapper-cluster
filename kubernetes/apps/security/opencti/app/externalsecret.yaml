---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opencti
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: opencti-secret
  data:
    # Already in Infisical from the previous deployment
    - secretKey: OPENCTI_ADMIN_PASSWORD
      remoteRef:
        key: /Selfhosted/OpenCTI/OPENCTI_ADMIN_PASSWORD
    - secretKey: OPENCTI_ADMIN_TOKEN
      remoteRef:
        key: /Selfhosted/OpenCTI/OPENCTI_ADMIN_TOKEN
    - secretKey: OPENCTI_NVD_API_KEY
      remoteRef:
        key: /Selfhosted/OpenCTI/OPENCTI_NVD_API_KEY
    - secretKey: OPENCTI_ALIENVAULT_API_KEY
      remoteRef:
        key: /Selfhosted/OpenCTI/OPENCTI_ALIENVAULT_API_KEY
    - secretKey: SHODAN_API_KEY
      remoteRef:
        key: /Selfhosted/SHODAN_API_KEY
    # Generated by ./generated-secrets.yaml
    - secretKey: OPENCTI_ENCRYPTION_KEY
      remoteRef:
        key: /Selfhosted/OpenCTI/OPENCTI_ENCRYPTION_KEY
    - secretKey: OPENCTI_RABBITMQ_PASSWORD
      remoteRef:
        key: /Selfhosted/OpenCTI/OPENCTI_RABBITMQ_PASSWORD
    # Generated by storage/garage (generated-keys.yaml); Garage imports the same pair.
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: /Infrastructure/Garage/GARAGE_OPENCTI_ACCESS_KEY_ID
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: /Infrastructure/Garage/GARAGE_OPENCTI_SECRET_ACCESS_KEY
