---
# OpenCTI's own credentials are generated in the cluster and stored in
# Infisical under /OpenCTI; nobody has to type them. Each PushSecret asks its
# generator for a value and writes it once (updatePolicy IfNotExists), so
# later refreshes and a rebuilt cluster keep the stored value. That matters
# most for the encryption key: OpenCTI encrypts stored API tokens with it.
# ./externalsecret.yaml reads the values back for the chart.
# deletionPolicy defaults to None: removing a PushSecret keeps the value.
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: opencti-admin-password
spec:
  length: 32
  symbols: 0
  secretKeys: [OPENCTI_ADMIN_PASSWORD]
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: opencti-admin-password
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: infisical
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: opencti-admin-password
  data:
    - match:
        secretKey: OPENCTI_ADMIN_PASSWORD
        remoteRef:
          remoteKey: /OpenCTI/OPENCTI_ADMIN_PASSWORD
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/generators.external-secrets.io/uuid_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: UUID
metadata:
  name: opencti-admin-token
spec: {}
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: opencti-admin-token
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: infisical
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: UUID
      name: opencti-admin-token
  data:
    - match:
        secretKey: uuid
        remoteRef:
          remoteKey: /OpenCTI/OPENCTI_ADMIN_TOKEN
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: opencti-encryption-key
spec:
  # 32 random characters, base64-encoded: what `openssl rand -base64 32` yields.
  length: 32
  symbols: 0
  encoding: base64
  secretKeys: [OPENCTI_ENCRYPTION_KEY]
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: opencti-encryption-key
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: infisical
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: opencti-encryption-key
  data:
    - match:
        secretKey: OPENCTI_ENCRYPTION_KEY
        remoteRef:
          remoteKey: /OpenCTI/OPENCTI_ENCRYPTION_KEY
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: opencti-rabbitmq-password
spec:
  length: 32
  symbols: 0
  secretKeys: [OPENCTI_RABBITMQ_PASSWORD]
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: opencti-rabbitmq-password
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: infisical
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: opencti-rabbitmq-password
  data:
    - match:
        secretKey: OPENCTI_RABBITMQ_PASSWORD
        remoteRef:
          remoteKey: /OpenCTI/OPENCTI_RABBITMQ_PASSWORD
