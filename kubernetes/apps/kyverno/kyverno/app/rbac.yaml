---
# Grants Kyverno permission to read + manage Envoy Gateway SecurityPolicies, so the
# httproute-authentik-forward-auth generate policy can validate (admission controller)
# and create/sync them (background controller). Uses Kyverno's RBAC aggregation labels
# rather than the chart's extraResources (which didn't render the CRD grant reliably).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:securitypolicies-access
  labels:
    app.kubernetes.io/part-of: kyverno
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups:
      - gateway.envoyproxy.io
    resources:
      - securitypolicies
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # ReferenceGrant lets the generated SecurityPolicy (app ns) reach the outpost
  # Service in `security`. The forward-auth policy generates these per-namespace.
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - referencegrants
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
# Read access to HTTPRoutes, the trigger kind of the forward-auth generate policy.
# Without list/watch the background controller can't run generateExisting (it
# logged "cannot list resource httproutes"), and the reports controller can't
# scan them. Admission-time generation was unaffected, because the webhook
# receives the object in the request.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:httproutes-read
  labels:
    app.kubernetes.io/part-of: kyverno
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
    rbac.kyverno.io/aggregate-to-background-controller: "true"
    rbac.kyverno.io/aggregate-to-reports-controller: "true"
rules:
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - httproutes
    verbs:
      - get
      - list
      - watch
---
# volsync-repository-mkdir: the trigger is a PersistentVolume (read by both
# controllers; generateExisting is off, but the background controller still
# fetches the trigger), and the generated kind is a Job in rook-ceph.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:volsync-repository-mkdir
  labels:
    app.kubernetes.io/part-of: kyverno
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
