---
# Grants Kyverno permission to read + manage Envoy Gateway SecurityPolicies, so the
# httproute-authentik-forward-auth generate policy can validate (admission controller)
# and create/sync them (background controller). Uses Kyverno's RBAC aggregation labels
# rather than the chart's extraResources (which didn't render the CRD grant reliably).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:securitypolicies-access
  labels:
    app.kubernetes.io/part-of: kyverno
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups:
      - gateway.envoyproxy.io
    resources:
      - securitypolicies
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # ReferenceGrant lets the generated SecurityPolicy (app ns) reach the outpost
  # Service in `security`. The forward-auth policy generates these per-namespace.
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - referencegrants
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
# Read access to HTTPRoutes, the trigger kind of the forward-auth generate policy.
# Without list/watch the background controller can't run generateExisting (it
# logged "cannot list resource httproutes"), and the reports controller can't
# scan them. Admission-time generation was unaffected, because the webhook
# receives the object in the request.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:httproutes-read
  labels:
    app.kubernetes.io/part-of: kyverno
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
    rbac.kyverno.io/aggregate-to-background-controller: "true"
    rbac.kyverno.io/aggregate-to-reports-controller: "true"
rules:
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - httproutes
    verbs:
      - get
      - list
      - watch
---
# volsync-repository-mkdir trigger: PersistentVolume read for all three
# controllers. The reports controller needs it too, or the policy reports
# RBACPermissionsGranted=False / ready=false even though generation works.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:persistentvolumes-read
  labels:
    app.kubernetes.io/part-of: kyverno
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
    rbac.kyverno.io/aggregate-to-background-controller: "true"
    rbac.kyverno.io/aggregate-to-reports-controller: "true"
rules:
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, list, watch]
---
# volsync-schedule-stagger target: ReplicationSource read. Mutation works at
# admission without it, but the policy reports RBACPermissionsGranted=False /
# ready=false until the reports controller can read the kind.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:replicationsources-read
  labels:
    app.kubernetes.io/part-of: kyverno
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
    rbac.kyverno.io/aggregate-to-background-controller: "true"
    rbac.kyverno.io/aggregate-to-reports-controller: "true"
rules:
  - apiGroups: [volsync.backube]
    resources: [replicationsources]
    verbs: [get, list, watch]
---
# volsync-repository-mkdir output: Jobs in rook-ceph. Kept separate from the
# PV read so the reports controller doesn't get Job write access.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:volsync-repository-mkdir
  labels:
    app.kubernetes.io/part-of: kyverno
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
