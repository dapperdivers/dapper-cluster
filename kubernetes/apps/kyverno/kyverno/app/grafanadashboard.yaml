---
# The chart's `grafana.enabled` renders this dashboard as a ConfigMap, but
# grafana-operator only loads dashboards that have a GrafanaDashboard CR. The CR
# must sit in the ConfigMap's namespace; allowCrossNamespaceImport lets the
# observability Grafana instance pick it up.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: kyverno
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  resyncPeriod: 1h
  configMapRef:
    name: kyverno-grafana-grafana
    key: kyverno-dashboard.json
