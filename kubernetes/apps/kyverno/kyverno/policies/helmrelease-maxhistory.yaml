---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: helmrelease-default-maxhistory
  annotations:
    policies.kyverno.io/title: Default HelmRelease maxHistory
    policies.kyverno.io/subject: HelmRelease
    policies.kyverno.io/description: >-
      Defaults spec.maxHistory to 3 on any HelmRelease that does not set its
      own value, capping the Helm release-history Secrets retained in etcd
      (the CRD default is 5, ~1MB each for CRD-heavy charts). HelmReleases that
      declare maxHistory explicitly are left untouched (matchCondition), so an
      individual app can override up (e.g. 10) or down (e.g. 1).
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [helm.toolkit.fluxcd.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [helmreleases]
  matchConditions:
    - name: maxhistory-unset
      expression: "!has(object.spec.maxHistory)"
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          [JSONPatch{op: "add", path: "/spec/maxHistory", value: 3}]
