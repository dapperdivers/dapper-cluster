---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: postgres-init-container
  annotations:
    policies.kyverno.io/title: Postgres Init Container Injection
    policies.kyverno.io/subject: HelmRelease
    policies.kyverno.io/description: >-
      Injects a postgres-init init container (init-db) into HelmReleases that
      set postgres-init.home.arpa/enabled: "true". It goes into the controller
      named by postgres-init.home.arpa/controller (default: the release name).
      The image comes from the kyverno/postgres-init-config ConfigMap, and the
      env comes from the <release>-postgres-init Secret generated by the
      postgres-init-externalsecret GeneratingPolicy.
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [helm.toolkit.fluxcd.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [helmreleases]
  matchConditions:
    - name: postgres-init-enabled
      expression: >-
        has(object.metadata.annotations) &&
        'postgres-init.home.arpa/enabled' in object.metadata.annotations &&
        object.metadata.annotations['postgres-init.home.arpa/enabled'] == 'true'
    - name: has-controllers
      expression: has(object.spec.values) && has(object.spec.values.controllers)
  variables:
    - name: ctrl
      expression: >-
        'postgres-init.home.arpa/controller' in object.metadata.annotations
        ? object.metadata.annotations['postgres-init.home.arpa/controller']
        : object.metadata.name
    - name: cfg
      expression: resource.Get("v1", "configmaps", "kyverno", "postgres-init-config").data
    - name: initDb
      expression: >-
        {
          "image": dyn({
            "repository": variables.cfg["image-repository"],
            "tag": variables.cfg["image-tag"]
          }),
          "envFrom": dyn([{"secretRef": {"name": object.metadata.name + "-postgres-init"}}])
        }
    - name: path
      expression: >-
        "/spec/values/controllers/" + jsonpatch.escapeKey(variables.ctrl)
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        # No-op if the named controller doesn't exist; otherwise add (or
        # replace) initContainers.init-db, creating initContainers if absent.
        expression: >-
          !(variables.ctrl in object.spec.values.controllers) ? [] :
          'initContainers' in object.spec.values.controllers[variables.ctrl]
          ? [JSONPatch{op: "add", path: variables.path + "/initContainers/init-db", value: variables.initDb}]
          : [JSONPatch{op: "add", path: variables.path + "/initContainers", value: {"init-db": variables.initDb}}]
