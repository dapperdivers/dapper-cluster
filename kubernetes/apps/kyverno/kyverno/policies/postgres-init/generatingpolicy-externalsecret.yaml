---
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: postgres-init-externalsecret
  annotations:
    policies.kyverno.io/title: Postgres Init ExternalSecret Generation
    policies.kyverno.io/subject: HelmRelease, ExternalSecret
    policies.kyverno.io/description: >-
      Generates the <release>-postgres-init ExternalSecret for HelmReleases that
      set postgres-init.home.arpa/enabled: "true" plus the user-key and pass-key
      annotations (Infisical key names). Synchronized: the ExternalSecret follows
      annotation changes and is deleted with the HelmRelease.
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [helm.toolkit.fluxcd.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [helmreleases]
  matchConditions:
    - name: postgres-init-enabled
      expression: >-
        has(object.metadata.annotations) &&
        'postgres-init.home.arpa/enabled' in object.metadata.annotations &&
        object.metadata.annotations['postgres-init.home.arpa/enabled'] == 'true'
    # Both Infisical key annotations are required.
    - name: has-credential-keys
      expression: >-
        object.metadata.annotations[?'postgres-init.home.arpa/user-key'].orValue('') != '' &&
        object.metadata.annotations[?'postgres-init.home.arpa/pass-key'].orValue('') != ''
  evaluation:
    synchronize:
      enabled: true
    # Adopt the ExternalSecrets the legacy ClusterPolicy generated (orphaned on
    # its deletion) and cover HelmReleases that predate this policy.
    generateExisting:
      enabled: true
  # Create-or-update, so pre-existing ExternalSecrets are adopted rather than
  # failing with AlreadyExists.
  useServerSideApply: true
  variables:
    - name: ann
      expression: object.metadata.annotations
    - name: userKey
      expression: variables.ann['postgres-init.home.arpa/user-key']
    - name: passKey
      expression: variables.ann['postgres-init.home.arpa/pass-key']
    - name: store
      expression: variables.ann[?'postgres-init.home.arpa/secret-store'].orValue('infisical')
    - name: dbname
      expression: variables.ann[?'postgres-init.home.arpa/dbname'].orValue(object.metadata.name)
    - name: externalSecret
      # CEL map literals must be homogeneous: maps that mix strings and nested
      # objects wrap every value in dyn(); all-string maps use string().
      expression: >-
        {
          "apiVersion": dyn("external-secrets.io/v1"),
          "kind": dyn("ExternalSecret"),
          "metadata": dyn({
            "name": string(object.metadata.name) + "-postgres-init",
            "namespace": string(object.metadata.namespace)
          }),
          "spec": dyn({
            "secretStoreRef": dyn({"kind": "ClusterSecretStore", "name": string(variables.store)}),
            "target": dyn({
              "name": dyn(string(object.metadata.name) + "-postgres-init"),
              "template": dyn({
                "engineVersion": dyn("v2"),
                "data": dyn({
                  "INIT_POSTGRES_HOST": "postgres-rw.database.svc.cluster.local",
                  "INIT_POSTGRES_SUPER_USER": "{{ .POSTGRES_SUPER_USER }}",
                  "INIT_POSTGRES_SUPER_PASS": "{{ .POSTGRES_SUPER_PASS }}",
                  "INIT_POSTGRES_PORT": "5432",
                  "INIT_POSTGRES_DBNAME": string(variables.dbname),
                  "INIT_POSTGRES_USER": "{{ ." + string(variables.userKey) + " }}",
                  "INIT_POSTGRES_PASS": "{{ ." + string(variables.passKey) + " }}"
                })
              })
            }),
            "refreshInterval": dyn("6h"),
            "dataFrom": dyn([{"find": {"name": {"regexp":
              "^(POSTGRES_SUPER_USER|POSTGRES_SUPER_PASS|" + string(variables.userKey) + "|" + string(variables.passKey) + ")$"
            }}}])
          })
        }
  generate:
    # Static superuser + per-app postgres creds rarely rotate, so the 6h refresh
    # keeps recursive ListSecrets calls off the rate-limited infisical-postgres
    # store. The single anchored-alternation find is one ListSecrets call
    # instead of four (the 4x version triggered an HTTP 429 storm).
    - expression: generator.Apply(object.metadata.namespace, [variables.externalSecret])
