---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-probes
  annotations:
    policies.kyverno.io/title: Require Health Probes
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Validates that containers have at least a readinessProbe defined.
      Health probes enable Kubernetes to properly manage traffic routing
      and rolling updates. Audit mode — reports violations without blocking.
      Job Pods (job-name label) are exempt.
spec:
  validationActions: [Audit]
  failurePolicy: Ignore
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, flux-system, kyverno, cert-manager]
    # Jobs and CronJobs don't need probes
    objectSelector:
      matchExpressions:
        - key: job-name
          operator: DoesNotExist
  validations:
    - expression: object.spec.containers.all(c, has(c.readinessProbe))
      messageExpression: >-
        'Container(s) ' + object.spec.containers.filter(c,
          !has(c.readinessProbe)).map(c, c.name).join(', ') +
        ' have no readinessProbe. Add a readinessProbe for proper traffic
        routing and rolling updates.'
