---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: default-security-context
  annotations:
    policies.kyverno.io/title: Default Security Context
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Validates that every container sets runAsNonRoot=true and
      allowPrivilegeEscalation=false. Audit mode — reports violations without
      blocking deployments. Workloads should be hardened incrementally.
      Opt a Pod out with the kyverno.io/skip-security-defaults: "true" annotation.
spec:
  validationActions: [Audit]
  failurePolicy: Ignore
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, flux-system, kyverno]
  matchConditions:
    - name: not-opted-out
      expression: >-
        !has(object.metadata.annotations) ||
        !('kyverno.io/skip-security-defaults' in object.metadata.annotations) ||
        object.metadata.annotations['kyverno.io/skip-security-defaults'] != 'true'
  validations:
    - expression: >-
        object.spec.containers.all(c,
          has(c.securityContext) && has(c.securityContext.runAsNonRoot) &&
          c.securityContext.runAsNonRoot == true)
      messageExpression: >-
        'Container(s) ' + object.spec.containers.filter(c,
          !(has(c.securityContext) && has(c.securityContext.runAsNonRoot) &&
          c.securityContext.runAsNonRoot == true)).map(c, c.name).join(', ') +
        ' do not set runAsNonRoot: true. Set securityContext.runAsNonRoot=true for defense in depth.'
    - expression: >-
        object.spec.containers.all(c,
          has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation) &&
          c.securityContext.allowPrivilegeEscalation == false)
      messageExpression: >-
        'Container(s) ' + object.spec.containers.filter(c,
          !(has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation) &&
          c.securityContext.allowPrivilegeEscalation == false)).map(c, c.name).join(', ') +
        ' do not set allowPrivilegeEscalation: false.'
