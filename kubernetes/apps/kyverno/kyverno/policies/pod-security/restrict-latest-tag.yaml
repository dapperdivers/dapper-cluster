---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-latest-tag
  annotations:
    policies.kyverno.io/title: Restrict Latest Image Tag
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Validates that container images do not use the :latest tag.
      Using :latest makes deployments non-deterministic and can
      silently introduce breaking changes or vulnerabilities.
      Audit mode — surfaces violations without blocking.
spec:
  validationActions: [Audit]
  failurePolicy: Ignore
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, flux-system]
  validations:
    - expression: object.spec.containers.all(c, !c.image.endsWith(':latest'))
      messageExpression: >-
        'Image(s) ' + object.spec.containers.filter(c,
          c.image.endsWith(':latest')).map(c, c.image).join(', ') +
        ' use the :latest tag. Pin to a specific version or SHA digest for
        reproducible deployments.'
