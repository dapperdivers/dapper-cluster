---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disable-automount-sa-token
  annotations:
    policies.kyverno.io/title: Disable Auto-Mount Service Account Token
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Validates that Pods set automountServiceAccountToken to false.
      Most workloads don't need the Kubernetes API token mounted, and
      leaving it mounted expands the blast radius of container compromise.
      Audit mode — reports violations without blocking deployments.
      Opt a Pod out with the kyverno.io/automount-sa-token: "true" annotation.
spec:
  validationActions: [Audit]
  failurePolicy: Ignore
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - cert-manager
            - flux-system
            - kyverno
            - actions-runner-system
            - external-secrets
  matchConditions:
    - name: not-opted-out
      expression: >-
        !has(object.metadata.annotations) ||
        !('kyverno.io/automount-sa-token' in object.metadata.annotations) ||
        object.metadata.annotations['kyverno.io/automount-sa-token'] != 'true'
  validations:
    - expression: >-
        has(object.spec.automountServiceAccountToken) &&
        object.spec.automountServiceAccountToken == false
      messageExpression: >-
        'Pod ' + object.metadata.name + ' has automountServiceAccountToken
        enabled or unset. Set automountServiceAccountToken: false unless the
        workload needs Kubernetes API access.'
