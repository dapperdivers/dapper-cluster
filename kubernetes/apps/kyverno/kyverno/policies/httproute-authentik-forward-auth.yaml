---
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: httproute-authentik-forward-auth
  annotations:
    policies.kyverno.io/title: HTTPRoute Authentik forward-auth
    policies.kyverno.io/subject: HTTPRoute, SecurityPolicy
    policies.kyverno.io/description: >-
      Generates an Envoy Gateway SecurityPolicy (ext-auth via the Authentik
      embedded outpost) for any HTTPRoute annotated
      authentik.home.arpa/forward-auth: "true". The Gateway-API equivalent of
      the nginx auth-url annotation injection. The outpost selects the provider
      by Host. The generated SecurityPolicy is kept in sync and removed when the
      HTTPRoute is deleted or the annotation is cleared (synchronize).
      kube-system is excluded by Kyverno globally, so hubble-ui uses a static
      SecurityPolicy (kube-system/cilium/app/securitypolicy.yaml).
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [gateway.networking.k8s.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [httproutes]
  matchConditions:
    - name: forward-auth-enabled
      expression: >-
        has(object.metadata.annotations) &&
        object.metadata.annotations[?'authentik.home.arpa/forward-auth'].orValue('') == 'true'
  evaluation:
    synchronize:
      enabled: true
    # Cover HTTPRoutes that predate the policy.
    generateExisting:
      enabled: true
  # Create-or-update, so existing SecurityPolicies are updated in place.
  useServerSideApply: true
  generate:
    - template:
        interpolate: cel
        # headersToExtAuth forwards what the outpost needs: cookie (session/state
        # validation on callback) and x-forwarded-* (correct https scheme/host).
        # Without these the OAuth callback fails with HTTP 400. NOTE: this field
        # is at spec.extAuth level, NOT under .http.
        value: |
          apiVersion: gateway.envoyproxy.io/v1alpha1
          kind: SecurityPolicy
          metadata:
            name: (( object.metadata.name ))-forward-auth
            namespace: (( object.metadata.namespace ))
          spec:
            targetRefs:
              - group: gateway.networking.k8s.io
                kind: HTTPRoute
                name: (( object.metadata.name ))
            extAuth:
              failOpen: false
              headersToExtAuth:
                - host
                - cookie
                - x-forwarded-proto
                - x-forwarded-host
                - x-forwarded-for
              http:
                backendRefs:
                  - name: ak-outpost-authentik-embedded-outpost
                    namespace: security
                    port: 9000
                path: /outpost.goauthentik.io/auth/envoy
                headersToBackend:
                  - set-cookie
                  - x-authentik-username
                  - x-authentik-email
                  - x-authentik-groups
                  - x-authentik-uid
                  - x-authentik-name
---
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: httproute-authentik-outpost-referencegrant
  annotations:
    policies.kyverno.io/title: Authentik outpost ReferenceGrant per namespace
    policies.kyverno.io/subject: HTTPRoute, ReferenceGrant
    policies.kyverno.io/description: >-
      The forward-auth SecurityPolicy lives in the app namespace, but its ext-auth
      backendRef points at the outpost Service in `security`. That
      cross-namespace ref needs a ReferenceGrant. ReferenceGrant has no
      namespace wildcard, so instead of maintaining a hand-written allowlist this
      generates one grant per source namespace on demand. Not synchronized, so
      the grant is sticky: one left orphaned when the last annotated route in a
      namespace goes away is harmless.
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [gateway.networking.k8s.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [httproutes]
  matchConditions:
    - name: forward-auth-enabled
      expression: >-
        has(object.metadata.annotations) &&
        object.metadata.annotations[?'authentik.home.arpa/forward-auth'].orValue('') == 'true'
  evaluation:
    synchronize:
      enabled: false
    generateExisting:
      enabled: true
  useServerSideApply: true
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: gateway.networking.k8s.io/v1beta1
          kind: ReferenceGrant
          metadata:
            name: securitypolicy-to-outpost-(( object.metadata.namespace ))
            namespace: security
          spec:
            from:
              - group: gateway.envoyproxy.io
                kind: SecurityPolicy
                namespace: (( object.metadata.namespace ))
            to:
              - group: ""
                kind: Service
                name: ak-outpost-authentik-embedded-outpost
