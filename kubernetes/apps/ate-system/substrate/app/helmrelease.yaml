---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: substrate
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: substrate
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    # atelet is its own release (substrate-atelet), installed first.
    atelet:
      enabled: false
    preview: [PerTemplateSnapshotLocation, GoldenEgressPolicy]
    # Postgres: database `kagent` on the CNPG cluster, schema `substrate`.
    # Roles and the substrate-postgres-* Secrets were created by hand (#4777).
    ateApi:
      authorization:
        bootstrapOwners:
          - spiffe://cluster.local/ns/kagent/sa/kagent-controller
          - system:serviceaccount:ate-system:ate-client
    atenetRouter:
      ingressAllowedSPIFFEIDs:
        - spiffe://cluster.local/ns/kagent/sa/kagent-controller
    credentialProvider:
      namespacePolicies:
        - atespace: kagent
          allowedNamespaces: [kagent]
