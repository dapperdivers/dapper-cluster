---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: substrate-podcert
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: substrate-podcert
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  # The chart installs into podcertificate-controller-system, where the CA pool
  # Secrets made by `kubectl ate admin make-ca-pool` live (see #4777).
  targetNamespace: podcertificate-controller-system
  values:
    createNamespace: false
