---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: substrate-atelet
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: substrate-atelet
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    substrateReleaseName: substrate
    preview: [PerTemplateSnapshotLocation, GoldenEgressPolicy]
    # Trial: the substrate chart's bundled RustFS (1Gi, not durable).
    # Move snapshots to Garage before relying on them (#4777).
    objectStore:
      backend: s3
      endpoint: http://rustfs.ate-system.svc:9000
      region: us-east-1
      pathStyle: true
      credentialsSecret: kagent-rustfs-credentials
