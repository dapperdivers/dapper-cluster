---
# Store for PushSecrets that have to create or change a value. Same project
# and credentials as "infisical"; the only difference is the CA bundle.
#
# external-secrets v2.15.0 cannot look up the project ID over HTTP/2 unless
# the store carries a CA bundle (external-secrets/external-secrets#7324), so
# a push through "infisical" fails with "failed to resolve project id".
# The bundle holds Amazon Root CA 1-4 and Starfield Services Root G2, the
# roots behind app.infisical.com. Once a release with the fix is deployed,
# point the PushSecrets back at "infisical" and delete this store.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/clustersecretstore_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical-push
spec:
  provider:
    infisical:
      auth:
        universalAuthCredentials:
          clientId:
            key: clientId
            namespace: external-secrets
            name: infiscal-auth-secret
          clientSecret:
            key: clientSecret
            namespace: external-secrets
            name: infiscal-auth-secret
      secretsScope:
        projectSlug: homelab-p-iqd
        environmentSlug: prod
        secretsPath: /
        recursive: true
      hostAPI: https://app.infisical.com
      caBundle: 
