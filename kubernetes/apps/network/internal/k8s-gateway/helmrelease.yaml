---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: k8s-gateway
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    fullnameOverride: k8s-gateway
    domain: "${SECRET_DOMAIN} ${SECRET_DOMAIN_MEDIA} ${SECRET_DOMAIN_PERSONAL} ${SECRET_DOMAIN_DIVING} ${SECRET_DOMAIN_WIFE}"
    ttl: 1
    service:
      type: LoadBalancer
      port: 53
      annotations:
        lbipam.cilium.io/ips: "${KUBE_VIP_GATEWAY}"
      externalTrafficPolicy: Cluster
    watchedResources: ["HTTPRoute", "Service"]
