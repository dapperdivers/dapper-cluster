---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: molt
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      molt:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          sync-plugins:
            image:
              repository: ghcr.io/openclaw/openclaw
              tag: 2026.11.7@sha256:461cc655301409901f2df11d6ec9f029f9709e4607826e9780fd74f8e1d12a16
            command:
              - /bin/sh
              - -c
              - |
                # Tools (gh, go, bun, claude, kubectl, pip packages, ...) live on
                # the PVC and are restored by VolSync; they are not installed here.
                mkdir -p /home/node/.local/bin /home/node/.openclaw
                ln -sf /app/openclaw.mjs /home/node/.local/bin/openclaw

                # Re-sync external plugins once per OpenClaw version, not every
                # boot (each openclaw CLI call costs ~10s of startup). A stale
                # plugin from an older release shadowing a newer core broke
                # Discord delivery before, so a version bump always re-syncs.
                # discord: channel plugin. searxng: web_search provider (external
                # since ~2026.6; without it web_search silently falls back).
                version="$(node -p 'require("/app/package.json").version')"
                marker=/home/node/.openclaw/.plugins-synced-for
                if [ "$(cat "$marker" 2>/dev/null)" = "$version" ]; then
                  echo "Plugins already synced for OpenClaw $version"
                  exit 0
                fi

                echo "Syncing plugins for OpenClaw $version..."
                # OpenClaw refuses a group-writable temp root (same fix as the app container).
                mkdir -p -m 700 /tmp/xdg-cache
                export XDG_CACHE_HOME=/tmp/xdg-cache
                ls -d /home/node/.openclaw/npm/projects/openclaw-discord-* >/dev/null 2>&1 \
                  || openclaw plugins install @openclaw/discord
                [ -d /home/node/.openclaw/extensions/searxng ] \
                  || openclaw plugins install @openclaw/searxng-plugin
                # install skips existing copies; update moves them to the newest
                # version compatible with this runtime. It exits non-zero when the
                # registry's latest is newer than the runtime supports, and that is
                # expected, so the marker is written either way.
                openclaw plugins update discord searxng \
                  || echo "plugin update reported errors (see above); continuing"
                echo "$version" > "$marker"
            resources:
              requests:
                cpu: 500m
                memory: 512Mi
              limits:
                cpu: 2000m
                memory: 4Gi
            env:
              HOME: /home/node
              PATH: /home/node/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        containers:
          app:
            image:
              repository: ghcr.io/openclaw/openclaw
              tag: 2026.11.7@sha256:461cc655301409901f2df11d6ec9f029f9709e4607826e9780fd74f8e1d12a16
            command:
              - /bin/sh
              - -c
              - |
                # Run on OpenClaw's own config (managed on the PVC with `openclaw config`).
                # The old patch layer was removed for 2026.11; port settings back
                # deliberately, against the current schema.

                mkdir -p -m 700 /tmp/xdg-cache
                # 2026.11.6 also rejects a temp root under a group-writable
                # ancestor unless it is sticky; /home/node must stay g+w for
                # fsGroup, so mark it sticky (a recursive fsGroup chown clears it).
                chmod +t /home/node
                exec node dist/index.js gateway --bind lan --port 18789 --allow-unconfigured
            resources:
              requests:
                cpu: 500m
                memory: 512Mi
              limits:
                cpu: 2000m
                # Sized for the old QMD memory backend (removed upstream in 2026.11).
                # Right-size once the built-in memory engine has run for a while.
                memory: 12Gi
            env:
              TZ: ${TIME_ZONE}
              HOME: /home/node
              # 2026.11 refuses a temp root under any group-writable ancestor,
              # and the PVC root (/home/node) must stay g+w for fsGroup. Keep
              # XDG cache (where openclaw derives its temp root) off the PVC,
              # and pin the big tool caches back onto it so they persist.
              XDG_CACHE_HOME: /tmp/xdg-cache
              GOCACHE: /home/node/.cache/go-build
              PIP_CACHE_DIR: /home/node/.cache/pip
              UV_CACHE_DIR: /home/node/.cache/uv
              HOMEBREW_CACHE: /home/node/.cache/Homebrew
              TERM: xterm-256color
              PATH: /home/node/.local/bin:/home/node/.local/go/bin:/home/node/.local/homebrew/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              GOPATH: /home/node/go
              HOMEBREW_PREFIX: /home/node/.local/homebrew
              HOMEBREW_CELLAR: /home/node/.local/homebrew/Cellar
              HOMEBREW_REPOSITORY: /home/node/.local/homebrew
              PIP_BREAK_SYSTEM_PACKAGES: "1"
              BROWSER_WS_ENDPOINT: "ws://localhost:9222"
            envFrom:
              - secretRef:
                  name: molt-secret
          ha-mcp:
            image:
              repository: ghcr.io/homeassistant-ai/ha-mcp
              tag: 9.3.0
            # ha-mcp 9.x dropped the fastmcp CLI; ha-mcp-web serves streamable
            # HTTP on :8086/mcp. Loopback-only: just the app container in this
            # pod talks to it.
            command:
              - ha-mcp-web
            env:
              MCP_HOST: 127.0.0.1
              TZ: ${TIME_ZONE}
              UV_NO_CACHE: "1"
              HOME: /tmp
              HOMEASSISTANT_URL: "http://home-assistant.home-automation.svc.cluster.local:8123"
              HOMEASSISTANT_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: molt-secret
                    key: HOMEASSISTANT_TOKEN
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
          chrome:
            image:
              repository: zenika/alpine-chrome
              tag: with-node
            command:
              - chromium-browser
              - --headless=new
              - --disable-gpu
              - --remote-debugging-address=0.0.0.0
              - --remote-debugging-port=9222
              - --no-sandbox
              - --disable-dev-shm-usage
              # Stealth flags to reduce bot detection
              - --disable-blink-features=AutomationControlled
              - --user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36
            env:
              TZ: ${TIME_ZONE}
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1000m
                memory: 1Gi
      syncthing:
        containers:
          app:
            image:
              repository: lscr.io/linuxserver/syncthing
              tag: 2.1.7@sha256:91e5a75d719b4f9919fc5332c7350d1477cf07bd62143506cec88694e94fbbc9
            env:
              PUID: "1000"
              PGID: "1000"
              TZ: ${TIME_ZONE}
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
            securityContext:
              runAsUser: 0
              runAsGroup: 0
        pod:
          shareProcessNamespace: false
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
    defaultPodOptions:
      shareProcessNamespace: true
      # Mount the SA token so Tim's kubectl can reach the API (read-only,
      # via the openclaw-reader ClusterRole). app-template 5.x runs the pod as the auto-created
      # 'molt' SA with automount off by default; without this the token is
      # absent and kubectl falls back to localhost:8080. Pairs with the RBAC
      # binding on the 'molt' SA in rbac.yaml.
      automountServiceAccountToken: true
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: molt
        ports:
          http:
            port: 18789
      syncthing:
        controller: syncthing
        ports:
          http:
            port: 8384
          sync:
            port: 22000
            protocol: TCP
      syncthing-lb:
        controller: syncthing
        type: LoadBalancer
        annotations:
          io.cilium/lb-ipam-ips: "10.100.0.30"
        ports:
          sync:
            port: 22000
            protocol: TCP
    route:
      app:
        hostnames: ["molt.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: http
      syncthing:
        hostnames: ["molt-syncthing.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: syncthing
                port: http
    persistence:
      config:
        enabled: true
        existingClaim: molt
        advancedMounts:
          molt:
            sync-plugins:
              - path: /home/node
            app:
              - path: /home/node
      vault:
        enabled: true
        existingClaim: molt-vault
        advancedMounts:
          molt:
            app:
              - path: /home/node/obsidian-vault
          syncthing:
            app:
              - path: /data/vault
      syncthing-config:
        enabled: true
        existingClaim: molt-syncthing-config
        advancedMounts:
          syncthing:
            app:
              - path: /config
