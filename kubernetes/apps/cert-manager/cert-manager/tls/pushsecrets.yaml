---
# Backs up each production wildcard cert to Infisical (/Certificates/<domain>),
# so a cluster rebuild restores it (see ../remotetls) instead of re-issuing
# and burning Let's Encrypt rate limit. Unchanged values are skipped, so the
# interval only bounds how stale the backup can be after a renewal.
# deletionPolicy defaults to None: removing a PushSecret keeps the backup.
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: "${SECRET_DOMAIN/./-}-tls"
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: infisical
  selector:
    secret:
      name: "${SECRET_DOMAIN/./-}-tls"
  data:
    - match:
        secretKey: tls.crt
        remoteRef:
          remoteKey: "/Certificates/${SECRET_DOMAIN/./-}/tls.crt"
    - match:
        secretKey: tls.key
        remoteRef:
          remoteKey: "/Certificates/${SECRET_DOMAIN/./-}/tls.key"
---
