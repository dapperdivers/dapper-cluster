---
# Restores each production wildcard cert from its Infisical backup (pushed by
# ../tls/pushsecrets.yaml) before cert-manager-tls creates the Certificates.
# The cert-manager annotations make cert-manager adopt the restored Secret
# instead of issuing a new one.
#
# refreshPolicy CreatedOnce: pull only when the Secret is first created
# (bootstrap). Afterwards cert-manager owns renewals, and this never
# overwrites a freshly renewed cert with the older backup.
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "${SECRET_DOMAIN/./-}-tls"
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: "${SECRET_DOMAIN/./-}-tls"
    creationPolicy: Orphan
    template:
      type: kubernetes.io/tls
      metadata:
        labels:
          controller.cert-manager.io/fao: "true"
        annotations:
          cert-manager.io/alt-names: "*.${SECRET_DOMAIN},${SECRET_DOMAIN}"
          cert-manager.io/certificate-name: "${SECRET_DOMAIN/./-}"
          cert-manager.io/common-name: "${SECRET_DOMAIN}"
          cert-manager.io/ip-sans: ""
          cert-manager.io/issuer-group: ""
          cert-manager.io/issuer-kind: ClusterIssuer
          cert-manager.io/issuer-name: letsencrypt-production
          cert-manager.io/uri-sans: ""
  data:
    - secretKey: tls.crt
      remoteRef:
        key: "/Certificates/${SECRET_DOMAIN/./-}/tls.crt"
    - secretKey: tls.key
      remoteRef:
        key: "/Certificates/${SECRET_DOMAIN/./-}/tls.key"
---
