---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

set: [pipefail]

tasks:
  talos:
    desc: Bootstrap the Talos cluster
    dir: "{{.TALOS_DIR}}"
    cmds:
      # New secrets bundle only if none exists (a talosctl secrets bundle, SOPS-encrypted).
      - |
        if [ ! -f talsecret.sops.yaml ]; then
          tmp="$(mktemp -d)" && talosctl gen secrets --output-file "$tmp/secrets.yaml" \
            && sops --filename-override talos/talsecret.sops.yaml --encrypt "$tmp/secrets.yaml" > talsecret.sops.yaml
          rm -rf "$tmp"
        fi
      - |
        ./nodes.sh | while read -r host ip _; do
          echo "### $host ($ip)"
          talosctl --nodes "$ip" apply-config --insecure --file <(./render.sh "$host")
        done
      - until talosctl --nodes {{.CONTROLLER}} bootstrap; do sleep 10; done
      - until talosctl --nodes {{.CONTROLLER}} kubeconfig {{.ROOT_DIR}} --force; do sleep 10; done
    vars:
      CONTROLLER:
        sh: '{{.TALOS_DIR}}/nodes.sh | awk ''$3 == "controlplane" {print $2; exit}'''
    preconditions:
      - test -f {{.ROOT_DIR}}/.sops.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - test -f {{.TALOS_DIR}}/versions.yaml
      - which talosctl sops yq envsubst

  apps:
    desc: Bootstrap apps into the Talos cluster
    cmds:
      - until kubectl wait --for=condition=Ready=False nodes --all --timeout=600s; do sleep 10; done
      - for: { var: APPLY_NAMESPACES }
        cmd: kubectl create namespace {{base .ITEM}} --dry-run=client --output=yaml | kubectl apply --server-side --filename -
      - for: { var: APPLY_SECRETS }
        cmd: sops exec-file {{.ITEM}} "kubectl --namespace flux-system apply --server-side --filename {}"
      - kubectl --namespace flux-system apply --server-side --filename {{.KUBERNETES_DIR}}/flux/components/common/substitutions/cluster-settings.yaml
      - helmfile --file {{.KUBERNETES_DIR}}/bootstrap/apps/helmfile.yaml apply --skip-diff-on-install --suppress-diff
      - helmfile --file {{.KUBERNETES_DIR}}/bootstrap/apps/helmfile.yaml destroy --selector name=prometheus-operator-crds
    vars:
      APPLY_NAMESPACES:
        sh: ls -d {{.KUBERNETES_DIR}}/apps/*
      APPLY_SECRETS:
        sh: find {{.KUBERNETES_DIR}}/bootstrap/apps {{.KUBERNETES_DIR}}/flux -type f -name '*.sops.yaml'
    preconditions:
      - test -f {{.KUBECONFIG}}
      - test -f {{.KUBERNETES_DIR}}/bootstrap/apps/helmfile.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which helmfile kubectl sops
