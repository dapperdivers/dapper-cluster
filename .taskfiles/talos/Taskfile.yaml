---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

set: [pipefail]

# Machine configs are rendered on demand by kubernetes/bootstrap/talos/render.sh
# (talosctl gen config + patches) and streamed straight into talosctl, so the
# rendered secrets never land on disk. See kubernetes/bootstrap/talos/README.md.

# `nodes.sh <ip>` prints "<hostname> <ip> <role> <install-image>" for one node.

tasks:
  render-config:
    desc: Print the rendered machine config for a node (contains secrets) [IP=required]
    cmd: ./render.sh "$({{.TALOS_DIR}}/nodes.sh {{.IP}} | cut -d' ' -f1)"
    dir: "{{.TALOS_DIR}}"
    requires:
      vars: [IP]
    preconditions:
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which talosctl sops yq envsubst

  diff-node:
    desc: Summarise what applying the rendered config would change on a node (dry run, no values shown) [IP=required] [FULL=false]
    cmd: FULL={{.FULL}} ./diff.sh "$({{.TALOS_DIR}}/nodes.sh {{.IP}} | cut -d' ' -f1)"
    dir: "{{.TALOS_DIR}}"
    vars:
      # FULL=true prints talosctl's raw diff, which contains CA keys and tokens.
      FULL: '{{.FULL | default "false"}}'
    requires:
      vars: [IP]
    preconditions:
      - talosctl --nodes {{.IP}} get machineconfig
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which talosctl sops yq envsubst

  diff-cluster:
    desc: Dry-run the rendered config against every node (summary only, no values shown)
    dir: "{{.TALOS_DIR}}"
    cmd: |
      ./nodes.sh | while read -r host _; do
        ./diff.sh "$host" || true
      done
    preconditions:
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which talosctl sops yq envsubst

  apply-node:
    desc: Render and apply Talos config to a node [IP=required] [MODE=auto] [INSECURE=false]
    dir: "{{.TALOS_DIR}}"
    cmds:
      - task: diff-node
        vars: { IP: "{{.IP}}" }
      - talosctl --nodes {{.IP}} apply-config --mode={{.MODE}} --timeout={{.TIMEOUT}} {{if eq .INSECURE "true"}}--insecure{{end}} --file <(./render.sh "$({{.TALOS_DIR}}/nodes.sh {{.IP}} | cut -d' ' -f1)")
    vars:
      MODE: '{{.MODE | default "auto"}}'
      TIMEOUT: '{{.TIMEOUT | default "10m"}}'
      INSECURE: '{{.INSECURE | default "false"}}'
    requires:
      vars: [IP]
    prompt: Apply the rendered Talos config to {{.IP}} (summary of the change shown first)... continue?
    preconditions:
      - sh: '{{if eq .INSECURE "true"}}exit 0{{else}}talosctl --nodes {{.IP}} get machineconfig{{end}}'
        msg: "Node {{.IP}} is not reachable or not configured. Use INSECURE=true for first-time setup."
      - sh: "{{.TALOS_DIR}}/nodes.sh {{.IP}}"
        msg: "No nodes/<role>/<hostname>.yaml has {{.IP}} as its ethSel0 address."
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which talosctl sops yq envsubst

  apply-cluster:
    desc: Render and apply Talos config to every node, one at a time [MODE=auto]
    prompt: Apply Talos config to EVERY node... continue? (run task talos:diff-cluster first)
    dir: "{{.TALOS_DIR}}"
    cmd: |
      ./nodes.sh | while read -r host ip _; do
        echo "### $host ($ip)"
        talosctl --nodes "$ip" apply-config --mode={{.MODE}} --timeout={{.TIMEOUT}} --file <(./render.sh "$host")
      done
    vars:
      MODE: '{{.MODE | default "auto"}}'
      TIMEOUT: '{{.TIMEOUT | default "10m"}}'
    preconditions:
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which talosctl sops yq envsubst

  add-node:
    desc: Add a new node to the cluster [IP=required] (add nodes/<role>/<hostname>.yaml first)
    vars:
      IP: "{{.IP}}"
    requires:
      vars: [IP]
    preconditions:
      - sh: "{{.TALOS_DIR}}/nodes.sh {{.IP}}"
        msg: "No nodes/<role>/<hostname>.yaml has {{.IP}} as its ethSel0 address. Add the node file first."
    cmds:
      - echo "Applying configuration to node {{.IP}}..."
      - talosctl --nodes {{.IP}} apply-config --insecure --file <({{.TALOS_DIR}}/render.sh "$({{.TALOS_DIR}}/nodes.sh {{.IP}} | cut -d' ' -f1)")
      - echo "Waiting for node to boot and join cluster (60 seconds)..."
      - sleep 60
      - kubectl get nodes -o wide | grep -E "NAME|{{.IP}}"

  upgrade-node:
    desc: Upgrade Talos on a single node [IP=required]
    prompt: Upgrade Talos on {{.IP}} (node reboots; normally tuppr does this)... continue?
    cmd: talosctl --nodes {{.IP}} upgrade --image='{{.TALOS_IMAGE}}' --timeout=120m
    vars:
      TALOS_IMAGE:
        sh: "{{.TALOS_DIR}}/nodes.sh {{.IP}} | cut -d' ' -f4"
    requires:
      vars: [IP]
    preconditions:
      - talosctl --nodes {{.IP}} get machineconfig
      - which talosctl yq

  upgrade-talos:
    desc: Upgrade Talos on all nodes, one at a time
    prompt: Upgrade Talos on EVERY node (normally tuppr does this)... continue?
    dir: "{{.TALOS_DIR}}"
    cmd: |
      ./nodes.sh | while read -r host ip _ image; do
        echo "### $host ($ip) -> $image"
        talosctl --nodes "$ip" upgrade --image="$image" --preserve --wait --timeout=30m
      done
    preconditions:
      - which talosctl yq

  upgrade-k8s:
    desc: Upgrade Kubernetes
    prompt: Upgrade Kubernetes on the whole cluster (normally tuppr does this)... continue?
    cmd: talosctl --nodes {{.CONTROLLER}} upgrade-k8s --to '{{.KUBERNETES_VERSION}}'
    vars:
      KUBERNETES_VERSION:
        sh: yq '.kubernetesVersion' {{.TALOS_DIR}}/versions.yaml
      CONTROLLER:
        sh: '{{.TALOS_DIR}}/nodes.sh | awk ''$3 == "controlplane" {print $2; exit}'''
    preconditions:
      - which talosctl yq

  reboot-node:
    desc: Reboot a single node [IP=required] [MODE=default|powercycle]
    prompt: Reboot node {{.IP}}... continue?
    cmd: talosctl --nodes {{.IP}} reboot --mode={{.MODE}}
    vars:
      MODE: '{{.MODE | default "default"}}'
    requires:
      vars: [IP]
    preconditions:
      - talosctl --nodes {{.IP}} get machineconfig
      - test -f {{.TALOSCONFIG}}
      - which talosctl

  download-image:
    desc: Download the Talos ISO for a node's schematic into .private/ [IP=required] [VERSION=versions.yaml] [PLATFORM=metal]
    cmds:
      - mkdir -p {{.PRIVATE_DIR}}
      - curl -fL --remove-on-error --retry 5 --retry-delay 5 --retry-all-errors --progress-bar -o "{{.ISO}}" "https://factory.talos.dev/image/{{.SCHEMATIC}}/{{.VERSION}}/{{.PLATFORM}}-amd64.iso"
      - echo "Saved {{.ISO}}"
    vars:
      PLATFORM: '{{.PLATFORM | default "metal"}}'
      VERSION:
        sh: "{{if .VERSION}}echo {{.VERSION}}{{else}}yq .talosVersion {{.TALOS_DIR}}/versions.yaml{{end}}"
      SCHEMATIC:
        sh: "{{.TALOS_DIR}}/nodes.sh {{.IP}} | cut -d' ' -f4 | sed -e 's#.*/installer/##' -e 's#:.*##'"
      ISO: "{{.PRIVATE_DIR}}/talos-{{.VERSION}}-{{.PLATFORM}}-{{trunc 8 .SCHEMATIC}}.iso"
    requires:
      vars: [IP]
    preconditions:
      - sh: test -n "{{.SCHEMATIC}}"
        msg: "No install image found for {{.IP}} in nodes/"
      - which curl yq

  reset:
    desc: Resets nodes back to maintenance mode
    prompt: This will destroy your cluster and reset the nodes back to maintenance mode... continue?
    dir: "{{.TALOS_DIR}}"
    cmd: |
      ./nodes.sh | while read -r host ip _; do
        echo "### resetting $host ($ip)"
        talosctl --nodes "$ip" reset --reboot {{- if eq .CLI_FORCE false }} --system-labels-to-wipe STATE --system-labels-to-wipe EPHEMERAL{{ end }} --graceful=false --wait=false
      done
    preconditions:
      - which talosctl yq
